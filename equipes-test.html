function login(){
  const redirect=encodeURIComponent(location.origin+location.pathname);
  localStorage.removeItem('mcm-discord-session');
  const scope=encodeURIComponent('identify guilds.members.read');
  location.href=`https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=${scope}&prompt=consent`;

async function initAuth(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));

  if(hash.get('error')){
    localStorage.removeItem('mcm-discord-session');
    history.replaceState(null,'',location.pathname);
    return renderGate(`Discord a refusé l’autorisation : ${hash.get('error_description')||hash.get('error')}`);
  }

  if(hash.get('access_token')){
    session={
      accessToken:hash.get('access_token'),
      expiresAt:Date.now()+Number(hash.get('expires_in')||3600)*1000,
      scope:hash.get('scope')||''
    };
    localStorage.setItem('mcm-discord-session',JSON.stringify(session));
    history.replaceState(null,'',location.pathname);
  }else{
    try{
      session=JSON.parse(localStorage.getItem('mcm-discord-session')||'null');
    }catch{
      session=null;
    }
  }

  if(!session||!session.accessToken||!session.expiresAt||session.expiresAt<=Date.now()){
    localStorage.removeItem('mcm-discord-session');
    return renderGate();
  }

  try{
    await firebaseAuthReady;
    const headers={Authorization:`Bearer ${session.accessToken}`};

    const u=await fetch('https://discord.com/api/users/@me',{headers});
    if(u.status===401||u.status===403){
      localStorage.removeItem('mcm-discord-session');
      session=null;
      return renderGate('Ta session Discord a expiré. Reconnecte-toi.');
    }

async function createSearchGroup(activity){
  if(!SEARCH_ACTIVITIES.includes(activity))return;
  const me=myPlayer();
  if(!me||!me.classId)return showToast('Configure d’abord ta classe');

  // Sanctuary = activité à 10 joueurs : création automatique de deux groupes de 5.
  if(activity==='Sanctuary'){
    const pairId='sanctuary_'+Date.now();
    const makeGroup=(letter)=>{
      const g={
        id:'sg_'+Date.now()+'_'+letter.toLowerCase(),
        activity:'Sanctuary',
        type:'pve',
        subgroup:letter,
        sanctuaryPairId:pairId,
        sequence:letter==='A'?1:2,
        createdAt:Date.now(),
        createdByPlayerId:me.id,
        leaderId:letter==='A'?me.id:'',
        memberIds:[],
        slots:{tank:'',dps1:'',dps2:'',dps3:'',heal:''}
      };
      return g;
    };

    const groupA=makeGroup('A');
    const groupB=makeGroup('B');

    const preferred=myPreferredSearchSlot(me.classId,groupA);
    if(!preferred)return showToast('Aucun slot compatible disponible');
    groupA.slots[preferred]=me.id;
    groupA.memberIds=[me.id];

    SEARCH_GROUPS.push(groupA,groupB);
    await saveData();
    overlay.innerHTML='';
    showToast('Sanctuary créé : Groupe A + Groupe B');
    render();
    return;
  }

  let max=0;
  SEARCH_GROUPS.filter(g=>g.activity===activity).forEach(g=>{const n=Number(g.sequence)||0;max=Math.max(max,n)});
  const g={
    id:'sg_'+Date.now(),
    activity,
    type:searchActivityType(activity),
    sequence:max+1,
    createdAt:Date.now(),
    createdByPlayerId:me.id,
    leaderId:me.id,
    memberIds:[],
    slots:{tank:'',dps1:'',dps2:'',dps3:'',heal:''}
  };
  const preferred=myPreferredSearchSlot(me.classId,g);
  if(!preferred)return showToast('Aucun slot compatible disponible');
  g.slots[preferred]=me.id;
  g.memberIds=[me.id];
  SEARCH_GROUPS.push(g);
  await saveData();
  overlay.innerHTML='';
  showToast(`${activity} : recherche créée`);
  render();
}

async function postGroupEventToDiscord(g,ev){
  if(!DISCORD_GROUP_EVENT_WEBHOOK_URL)return 'not_configured';
  const leader=PLAYERS.find(p=>p.id===g.leaderId); const members=groupMembers(g);
  const roster=fixedSlotDefs().map(d=>{const p=PLAYERS.find(x=>x.id===g.slots[d.key]); const c=p?cls(p.classId):null; return `${d.icon} **${d.label}** : ${p?playerName(p)+' ('+(c?.name||'')+')':'Libre'}`;}).join('\n');
  const timestamp=new Date(`${ev.date}T${ev.time}`).toISOString();
  const payload={username:'MCM · MMO Connect Manager',embeds:[{
    title:`📅 ${ev.activity} — ${g.name}`,
    description:`**STATIC · ${members.length}/5**\n\n${roster}${ev.note?`\n\n📝 ${ev.note}`:''}`,
    color:g.type==='pvp'?0xff4d67:0x168bff,
    fields:[{name:'👑 Leader',value:leader?playerName(leader):'À définir',inline:true},{name:'🗓️ Date',value:ev.date,inline:true},{name:'🕒 Heure',value:ev.time,inline:true}],
    timestamp,
    footer:{text:'MCM · MMO Connect Manager'}
  }]};
  try{
    const fd=new FormData(); fd.append('payload_json',JSON.stringify(payload));
    await fetch(DISCORD_GROUP_EVENT_WEBHOOK_URL,{method:'POST',mode:'no-cors',body:fd});
    return 'posted';
  }catch(e){console.error('Discord publish failed',e);return 'error'}
}

async function createFixedGroupInstant(){
  const me=myPlayer();
  if(!me)return showToast('Ton profil joueur est introuvable');
  if(!me.classId)return showToast('Configure d’abord ta classe dans Joueurs');
  let max=0;
  FIXED_GROUPS.forEach(g=>{const n=Number(g.sequence)||parseInt(String(g.name||'').match(/\d+/)?.[0]||0);max=Math.max(max,n)});
  const g={
    id:'fg_'+Date.now(),
    sequence:max+1,
    type:'static',
    name:`Groupe ${max+1}`,
    createdAt:Date.now(),
    createdByPlayerId:me.id,
    leaderId:me.id,
    memberIds:[],
    slots:{tank:'',dps1:'',dps2:'',dps3:'',heal:''}
  };
  const pref=(me.classId==='templar')?'tank':
    (me.classId==='cleric')?'heal':
    (me.classId==='gladiator')?'tank':
    (me.classId==='chanter')?'heal':'dps1';
  if(classCanRole(me.classId,pref==='tank'?'tank':pref==='heal'?'heal':'dps'))g.slots[pref]=me.id;
  g.memberIds=Object.values(g.slots).filter(Boolean);
  FIXED_GROUPS.push(g);
  await saveData();
  ACTIVE='fixed-all';
  showToast(`${g.name} créé`);
  render();
}

async function deleteFixedGroup(id){

  const allowed=(IS_ADMIN&&!PREVIEW_AS_MEMBER)||(me&&g.createdByPlayerId===me.id);

  if(!confirm(`Supprimer « ${g.name} » ?`))return;
  FIXED_GROUPS=FIXED_GROUPS.filter(x=>x.id!==id);

function eventRoleForMember(ev,playerId){
  const inspect=(g)=>{
    if(!g||!g.slots)return '';
    if(g.slots.tank===playerId)return 'tank';
    if(g.slots.heal===playerId)return 'heal';
    if([g.slots.dps1,g.slots.dps2,g.slots.dps3].includes(playerId))return 'dps';
    return '';
  };
  if(ev?.source==='searchGroup')return inspect(SEARCH_GROUPS.find(g=>g.id===ev.sourceGroupId))||'dps';
  if(ev?.source==='fixedGroup')return inspect(FIXED_GROUPS.find(g=>g.id===ev.sourceGroupId))||'dps';
  const fg=FIXED_GROUPS.find(g=>g.id===ev?.groupId);
  if(fg)return inspect(fg)||'dps';
  const p=PLAYERS.find(x=>x.id===playerId);
  if(p?.classId==='templar')return 'tank';
  if(p?.classId==='cleric'||p?.classId==='chanter')return 'heal';
  return 'dps';
}

function plannedEventMemberIds(ev){
  if(Array.isArray(ev.memberIds)&&ev.memberIds.length)return ev.memberIds;
  if(ev?.source==='searchGroup'){
    const g=SEARCH_GROUPS.find(x=>x.id===ev.sourceGroupId);
    return g?searchGroupMembers(g).map(p=>p.id):[];
  }
  const fg=FIXED_GROUPS.find(x=>x.id===(ev?.sourceGroupId||ev?.groupId));
  return fg?groupMembers(fg).map(p=>p.id):[];
}

function eventAvatars(ev){
  return plannedEventMemberIds(ev).slice(0,5).map(id=>{
    const p=PLAYERS.find(x=>x.id===id); if(!p)return '';
    const role=eventRoleForMember(ev,id),name=playerName(p);
    return `<span class="event-avatar-ring ${role}" title="${esc(name)} · ${role.toUpperCase()}">${p.discordAvatar?`<img src="${esc(p.discordAvatar)}" alt="${esc(name)}">`:`<span class="avatar-fallback">${esc(name.slice(0,2).toUpperCase())}</span>`}</span>`;
  }).join('');
}

function preferredOpenSlotForGroup(g,player){
  if(!g||!player||!player.classId)return '';
  normalizeSearchGroup(g);
  const order=player.classId==='templar'?['tank']:
    player.classId==='cleric'?['heal']:
    player.classId==='gladiator'?['tank','dps1','dps2','dps3']:
    player.classId==='chanter'?['heal','dps1','dps2','dps3']:
    ['dps1','dps2','dps3'];
  return order.find(k=>!g.slots[k] && classCanRole(player.classId,k==='tank'?'tank':k==='heal'?'heal':'dps'))||'';
}

function dashboardSearchAction(g){

  return `<button class="dashboard-join-btn" data-dashboard-join-search="${g.id}" data-dashboard-slot="${slot}">S’inscrire · ${esc(def?.label||'Slot')}</button>`;
}

function dashboardFixedAction(g){

  if(mine)return `<button class="dashboard-join-btn leave" data-dashboard-leave-fixed="${g.id}">Se retirer</button>`;

function dashboardPreferredSlot(g,player,isFixed=false){
  if(!g||!player||!player.classId)return '';
  if(isFixed)normalizeFixedGroup(g); else normalizeSearchGroup(g);
  const order=player.classId==='templar'?['tank']:
    player.classId==='cleric'?['heal']:
    player.classId==='gladiator'?['tank','dps1','dps2','dps3']:
    player.classId==='chanter'?['heal','dps1','dps2','dps3']:
    ['dps1','dps2','dps3'];

  return order.find(k=>{
    if(g.slots[k])return false;
    const role=k==='tank'?'tank':k==='heal'?'heal':'dps';
    return classCanRole(player.classId,role);
  })||'';
}

function dashboardSearchAction(g){

  if(playerInSearchGroup(g,me.id)){
    return `<button class="dashboard-join-btn leave" data-dash-leave-search="${g.id}">Se retirer</button>`;

  const slot=dashboardPreferredSlot(g,me,false);
  if(!slot){
    return `<button class="dashboard-join-btn" disabled>Complet / incompatible</button>`;

  const def=fixedSlotDefs().find(d=>d.key===slot);
  return `<button class="dashboard-join-btn" data-dash-join-search="${g.id}" data-dash-slot="${slot}">S’inscrire · ${esc(def?.label||'Slot')}</button>`;
}

function dashboardFixedAction(g){

    return `<button class="dashboard-join-btn leave" data-dash-leave-fixed="${g.id}">Se retirer</button>`;

function sanctuaryPairGroups(g){
  if(!g||g.activity!=='Sanctuary'||!g.sanctuaryPairId)return [];
  return SEARCH_GROUPS.filter(x=>x.sanctuaryPairId===g.sanctuaryPairId).sort((a,b)=>(a.subgroup||'').localeCompare(b.subgroup||''));
}

function sanctuaryPairFull(g){
  const pair=sanctuaryPairGroups(g);
  return pair.length===2 && pair.every(x=>searchGroupMembers(x).length===5);
}

function canShowSanctuaryPublish(g){
  if(g.activity!=='Sanctuary')return true;
  // Un seul bouton de publication : Groupe A uniquement, et seulement quand A+B = 10/10.
  return g.subgroup==='A' && sanctuaryPairFull(g);
}

        <h3 class="card-title">${icon('swords','ui-icon')}RECHERCHES DE GROUPE</h3>
        <div class="dashboard-scroll-wrap"><div class="dashboard-scroll-wrap"><div class="groups-grid">${SEARCH_GROUPS.map(g=>{normalizeSearchGroup(g);const members=searchGroupMembers(g);return `<div class="group-tile"><span class="tag" style="border-color:${activityColor(g.activity)}88;color:${activityColor(g.activity)}">${activityTypeLabel(g.activity)}</span><div class="group-name">${esc(g.activity)}${g.activity==='Sanctuary'&&g.subgroup?` · Groupe ${esc(g.subgroup)}`:''}</div><div class="group-time">Recherche en cours</div><div class="avatar-stack">${members.slice(0,5).map(p=>p.discordAvatar?`<img src="${esc(p.discordAvatar)}" alt="">`:'').join('')}</div><div class="group-count">${members.length}/5 joueurs</div><div class="dashboard-group-actions">${dashboardSearchAction(g)}</div></div>`}).join('')||'<div class="group-count">Aucune recherche active.</div>'}</div></div>
        <div class="view-all" data-tab="search-groups">Voir toutes les recherches ›</div>
      </section>

      <section class="card groups-card">
        <h3 class="card-title">${icon('swords','ui-icon')}GROUPES STATIC</h3>
        <div class="dashboard-scroll-wrap"><div class="dashboard-scroll-wrap"><div class="groups-grid">${FIXED_GROUPS.map(g=>{normalizeFixedGroup(g);const members=groupMembers(g),ev=latestGroupEvent(g.id);return `<div class="group-tile"><span class="tag">STATIC</span><div class="group-name">${esc(g.name)}</div><div class="group-time">${ev?esc(ev.activity)+' · '+esc(ev.date)+' · '+esc(ev.time):'Aucun événement planifié'}</div><div class="avatar-stack">${members.slice(0,5).map(p=>p.discordAvatar?`<img src="${esc(p.discordAvatar)}" alt="">`:'').join('')}</div><div class="group-count">${members.length}/5 joueurs</div></div>`}).join('')||'<div class="group-count">Aucun groupe STATIC créé.</div>'}</div></div>
        <div class="view-all" data-tab="fixed-all">Voir tous les groupes ›</div>
      </section>
    </div>
  </div>`;
}
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ACTIVE=b.dataset.tab;render()}));
  document.getElementById('previewBtn')?.addEventListener('click',()=>{PREVIEW_AS_MEMBER=!PREVIEW_AS_MEMBER;render()});
  document.getElementById('logoutBtn')?.addEventListener('click',logout);
  document.getElementById('addPlayerBtn')?.addEventListener('click',()=>openPlayerModal());
  document.querySelectorAll('[data-edit-player]').forEach(b=>b.addEventListener('click',()=>openPlayerModal(b.dataset.editPlayer)));
  document.querySelectorAll('[data-delete-player]').forEach(b=>b.addEventListener('click',()=>deletePlayer(b.dataset.deletePlayer)));

  document.getElementById('addFixedBtn')?.addEventListener('click',createFixedGroupInstant);
  document.querySelectorAll('[data-delete-fixed]').forEach(b=>b.addEventListener('click',()=>deleteFixedGroup(b.dataset.deleteFixed)));
  document.querySelectorAll('[data-join-fixed]').forEach(b=>b.addEventListener('click',()=>joinFixedSlot(b.dataset.joinFixed,b.dataset.slot)));
  document.querySelectorAll('[data-leave-fixed]').forEach(b=>b.addEventListener('click',()=>leaveFixedGroup(b.dataset.leaveFixed)));
  document.querySelectorAll('[data-leader-fixed]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)claimOrChangeLeader(b.dataset.leaderFixed)}));
  document.querySelectorAll('[data-publish-fixed]').forEach(b=>b.addEventListener('click',()=>openGroupEventPlanner(b.dataset.publishFixed)));

  document.getElementById('createSearchBtn')?.addEventListener('click',openSearchGroupCreate);
  document.querySelectorAll('[data-search-filter]').forEach(b=>b.addEventListener('click',()=>{SEARCH_FILTER=b.dataset.searchFilter;render()}));
  document.querySelectorAll('[data-join-search]').forEach(b=>b.addEventListener('click',()=>joinSearchSlot(b.dataset.joinSearch,b.dataset.searchSlot)));
  document.querySelectorAll('[data-leave-search]').forEach(b=>b.addEventListener('click',()=>leaveSearchGroup(b.dataset.leaveSearch)));
  document.querySelectorAll('[data-delete-search]').forEach(b=>b.addEventListener('click',()=>deleteSearchGroup(b.dataset.deleteSearch)));
  document.querySelectorAll('[data-publish-search]').forEach(b=>b.addEventListener('click',()=>openSearchEventPlanner(b.dataset.publishSearch)));

  document.querySelectorAll('[data-dashboard-join-search]').forEach(b=>b.addEventListener('click',()=>joinSearchSlot(b.dataset.dashboardJoinSearch,b.dataset.dashboardSlot)));
  document.querySelectorAll('[data-dashboard-leave-search]').forEach(b=>b.addEventListener('click',()=>leaveSearchGroup(b.dataset.dashboardLeaveSearch)));
  document.querySelectorAll('[data-dashboard-join-fixed]').forEach(b=>b.addEventListener('click',()=>joinFixedSlot(b.dataset.dashboardJoinFixed,b.dataset.dashboardSlot)));
  document.querySelectorAll('[data-dashboard-leave-fixed]').forEach(b=>b.addEventListener('click',()=>leaveFixedGroup(b.dataset.dashboardLeaveFixed)));


  document.querySelectorAll('[data-dash-join-search]').forEach(b=>b.addEventListener('click',()=>joinSearchSlot(b.dataset.dashJoinSearch,b.dataset.dashSlot)));
  document.querySelectorAll('[data-dash-leave-search]').forEach(b=>b.addEventListener('click',()=>leaveSearchGroup(b.dataset.dashLeaveSearch)));

}

initAuth();
</script></body></html>

let lang = localStorage.getItem('equipes-lang') || 'fr';
function t(key){ return TRANSLATIONS[lang][key]; }

function setLang(l){
  lang = l;
  localStorage.setItem('equipes-lang', l);
  applyStaticTranslations();
  render();
}

function applyStaticTranslations(){
  document.documentElement.lang = lang;
  document.getElementById('pageTitle').textContent = t('pageTitle');
  document.getElementById('pageH1').textContent = t('h1');
  document.getElementById('pageSubtitle').textContent = t('subtitle');
  document.getElementById('howtoSummary').textContent = t('howtoSummary');
  document.getElementById('howtoSteps').innerHTML = t('howtoSteps').map(s => `<li>${s}</li>`).join('');
  document.getElementById('sidebarTitle').textContent = t('sidebarTitle');
  document.getElementById('addTeamBtn').textContent = t('addTeam');
  document.getElementById('tabBtn-pvp').textContent = 'PVP';
  document.getElementById('tabBtn-pve').textContent = 'PVE';
  document.getElementById('langBtn-fr').classList.toggle('active', lang === 'fr');
  document.getElementById('langBtn-en').classList.toggle('active', lang === 'en');
}

let allTeams = { pve: [], pvp: [], roster: [] };
let activeTab = 'pvp';
let openClaimSlot = null; // "mode:teamId:slotIndex"
let pendingClassId = null;

function makeId(){ return Math.random().toString(36).slice(2, 9); }

function switchTab(tab){
  activeTab = tab;
  openClaimSlot = null;
  pendingClassId = null;
  render();
}

function emptyTeam(mode){
  const list = allTeams[mode];
  return { id: makeId(), name: t('teamDefaultName') + ' ' + (list.length + 1), slots: ROLES.map(r => ({ role: r, name: '', classId: '', isNewPlayer: false })) };
}

function addTeam(){
  if (activeTab !== 'pve' && activeTab !== 'pvp') return;
  allTeams[activeTab].push(emptyTeam(activeTab));
  saveTeams();
}

function deleteTeam(mode, teamId){
  if (!confirm(t('deleteTeamConfirm'))) return;
  allTeams[mode] = allTeams[mode].filter(t => t.id !== teamId);
  saveTeams();
}

function renameTeam(mode, teamId, value){
  const tm = allTeams[mode].find(t => t.id === teamId);
  if (tm) tm.name = value;
  saveTeams();
}

function openClaim(mode, teamId, slotIndex){
  openClaimSlot = mode + ':' + teamId + ':' + slotIndex;
  pendingClassId = null;
  render();
}

function cancelClaim(){
  openClaimSlot = null;
  render();
}

function pickClass(classId, imgEl){
  pendingClassId = classId;
  if (imgEl){
    imgEl.parentElement.querySelectorAll('img').forEach(img => img.classList.remove('selected'));
    imgEl.classList.add('selected');
  }
}

function confirmClaim(mode, teamId, slotIndex){
  const select = document.getElementById('claimNameSelect');
  const name = select ? select.value : '';
  if (!name){ alert(t('chooseNameAlert')); return; }
  const player = allTeams.roster.find(p => p.name === name);
  if (!player){ alert(t('playerNotFoundAlert')); return; }
  const tm = allTeams[mode].find(t => t.id === teamId);
  if (tm) tm.slots[slotIndex] = { role: tm.slots[slotIndex].role, name: player.name, classId: player.classId, isNewPlayer: player.isNewPlayer };
  openClaimSlot = null;
  saveTeams();
}

function leaveSlot(mode, teamId, slotIndex){
  const tm = allTeams[mode].find(t => t.id === teamId);
  if (tm) tm.slots[slotIndex] = { role: tm.slots[slotIndex].role, name: '', classId: '', isNewPlayer: false };
  saveTeams();
}

function toggleNewPlayer(mode, teamId, slotIndex){
  const tm = allTeams[mode].find(t => t.id === teamId);
  if (tm) tm.slots[slotIndex].isNewPlayer = !tm.slots[slotIndex].isNewPlayer;
  saveTeams();
}

let rosterFormOpen = false;
let rosterEditName = null;

function openRosterForm(){
  rosterFormOpen = true;
  rosterEditName = null;
  pendingClassId = null;
  render();
}

function editRoster(name){
  const p = allTeams.roster.find(p => p.name === name);
  rosterFormOpen = true;
  rosterEditName = name;
  pendingClassId = p ? p.classId : null;
  render();
}

function cancelRosterForm(){
  rosterFormOpen = false;
  rosterEditName = null;
  render();
}

function confirmRosterJoin(){
  const input = document.getElementById('rosterNameInput');
  const name = input ? input.value.trim() : '';
  const newPlayerCheckbox = document.getElementById('rosterNewPlayer');
  const isNewPlayer = newPlayerCheckbox ? newPlayerCheckbox.checked : false;
  if (!name){ alert(t('enterNameAlert')); return; }
  if (!pendingClassId){ alert(t('chooseClassAlert')); return; }
  allTeams.roster = allTeams.roster.filter(p => p.name.toLowerCase() !== name.toLowerCase());
  allTeams.roster.push({ name, classId: pendingClassId, isNewPlayer });
  rosterFormOpen = false;
  rosterEditName = null;
  pendingClassId = null;
  saveTeams();
}

function leaveRoster(name){
  allTeams.roster = allTeams.roster.filter(p => p.name.toLowerCase() !== name.toLowerCase());
  saveTeams();
}

let resetConfirmPending = false;

function askResetRoster(){
  resetConfirmPending = true;
  render();
}

function cancelResetRoster(){
  resetConfirmPending = false;
  render();
}

function resetRoster(){
  resetConfirmPending = false;
  allTeams.roster = [];
  saveTeams();
}

function saveTeams(){
  document.getElementById('statusLine').textContent = t('registering');
  docRef.set({ pve: allTeams.pve, pvp: allTeams.pvp, roster: allTeams.roster }).then(() => {
    document.getElementById('statusLine').textContent = '';
  }).catch(err => {
    console.error(err);
    document.getElementById('statusLine').textContent = t('syncError');
  });
}

function renderTeamCard(mode, team){
  const slotsHtml = team.slots.map((slot, i) => {
    const key = mode + ':' + team.id + ':' + i;
    if (openClaimSlot === key){
      if (!allTeams.roster.length){
        return `<div class="slot">
          <div class="slot-role">${slot.role}</div>
          <div class="claim-form">
            <div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#544b68;font-size:11px;">${t('needRosterFirst')}</div>
            <button class="claim-btn-cancel" onclick="cancelClaim()">${t('cancel')}</button>
          </div>
        </div>`;
      }
      const alreadyUsedNames = new Set(team.slots.filter((s,si) => si !== i && s.name).map(s => s.name));
      const optionsHtml = allTeams.roster
        .filter(p => !alreadyUsedNames.has(p.name))
        .map(p => `<option value="${p.name.replace(/"/g,'&quot;')}">${p.name}</option>`).join('');
      return `<div class="slot">
        <div class="slot-role">${slot.role}</div>
        <div class="claim-form">
          <select id="claimNameSelect" class="claim-select">
            <option value="">${t('chooseNamePlaceholder')}</option>
            ${optionsHtml}
          </select>
          <div class="claim-form-actions">
            <button class="claim-btn-ok" onclick="confirmClaim('${mode}', '${team.id}', ${i})">${t('ok')}</button>
            <button class="claim-btn-cancel" onclick="cancelClaim()">${t('cancel')}</button>
          </div>
        </div>
      </div>`;
    }
    if (slot.name){
      const cls = CLASS_OPTIONS.find(c => c.id === slot.classId);
      return `<div class="slot">
        <div class="slot-role">${slot.role}</div>
        <div class="slot-filled">
          ${cls ? `<img class="class-icon" src="${cls.icon}" alt="" title="${cls.label}" />` : ''}
          <span class="slot-player-name">${slot.name.replace(/</g,'&lt;')}</span>
          <button class="new-player-toggle ${slot.isNewPlayer ? 'active' : ''}" onclick="toggleNewPlayer('${mode}', '${team.id}', ${i})" title="${t('newPlayerToggleTitle')}">${LEAF_IMG}</button>
          <button class="slot-leave-btn" onclick="leaveSlot('${mode}', '${team.id}', ${i})" title="${t('leaveSlotTitle')}">✕</button>
        </div>
      </div>`;
    }
    return `<div class="slot">
      <div class="slot-role">${slot.role}</div>
      <div class="slot-empty" onclick="openClaim('${mode}', '${team.id}', ${i})">${t('slotEmpty')}</div>
    </div>`;
  }).join('');
  return `<div class="team-card">
    <div class="team-head">
      <input class="team-name-input" value="${team.name.replace(/"/g,'&quot;')}" onchange="renameTeam('${mode}', '${team.id}', this.value)" />
      <button class="delete-team-btn" onclick="deleteTeam('${mode}', '${team.id}')">${t('deleteTeam')}</button>
    </div>
    <div class="slots">${slotsHtml}</div>
  </div>`;
}

function renderModeView(mode){
  const teams = allTeams[mode];
  const totalSlots = teams.reduce((sum, t) => sum + t.slots.length, 0);
  const filledSlots = teams.reduce((sum, t) => sum + t.slots.filter(s => s.name).length, 0);

  const classCounterEl = document.getElementById('classCounter');
  if (classCounterEl){
    const counts = {};
    CLASS_OPTIONS.forEach(c => counts[c.id] = 0);
    teams.forEach(t => t.slots.forEach(s => { if (s.classId && counts[s.classId] !== undefined) counts[s.classId]++; }));
    classCounterEl.innerHTML = filledSlots ? `<div class="class-counter">${CLASS_OPTIONS.map(c =>
      `<div class="class-count-item ${counts[c.id] > 0 ? 'has-players' : ''}"><img src="${c.icon}" alt="" title="${c.label}" /> ${c.label} · ${counts[c.id]}</div>`
    ).join('')}</div>` : '';
  }

  const container = document.getElementById('teamsContainer');
  if (!teams.length){
    container.innerHTML = `<div class="empty-state">${t('noTeamsYet')(MODE_LABELS[mode])}</div>`;
    return;
  }
  container.innerHTML = teams.map(team => renderTeamCard(mode, team)).join('');
}

function renderSidebarRoster(){
  const countEl = document.getElementById('signupCount');
  if (countEl) countEl.textContent = allTeams.roster.length ? t('rosterCount')(allTeams.roster.length) : '';

  const byName = {};
  allTeams.roster.forEach(p => {
    const key = p.name.toLowerCase();
    byName[key] = { name: p.name, classId: p.classId, isNewPlayer: p.isNewPlayer, tags: [], fromRoster: true };
  });
  ['pve', 'pvp'].forEach(mode => {
    allTeams[mode].forEach(team => {
      team.slots.forEach(slot => {
        if (!slot.name) return;
        const key = slot.name.toLowerCase();
        if (!byName[key]) return;
        byName[key].tags.push({ mode, team: team.name, role: slot.role });
      });
    });
  });

  const players = Object.values(byName).sort((a,b) => a.name.localeCompare(b.name));
  const container = document.getElementById('rosterContainer');

  const editingPlayer = rosterEditName ? allTeams.roster.find(p => p.name === rosterEditName) : null;
  const joinFormHtml = rosterFormOpen ? `<div class="roster-row" style="flex-direction:column;align-items:stretch;gap:8px;">
    ${rosterEditName ? `<div style="font-size:11px;color:#8b8299;">${t('editingLabel')} <strong style="color:#e8e3f0;">${rosterEditName}</strong></div>` : ''}
    <input id="rosterNameInput" type="text" placeholder="${t('pseudoPlaceholder')}" maxlength="20" value="${rosterEditName ? rosterEditName.replace(/"/g,'&quot;') : ''}" style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:7px;color:#e8e3f0;font-size:13px;" />
    <div class="class-picker">${CLASS_OPTIONS.map(c =>
      `<img src="${c.icon}" title="${c.label}" class="${pendingClassId===c.id?'selected':''}" onclick="pickClass('${c.id}', this)" />`
    ).join('')}</div>
    <label class="new-player-check">
      <input type="checkbox" id="rosterNewPlayer" ${editingPlayer && editingPlayer.isNewPlayer ? 'checked' : ''} />
      ${LEAF_IMG} ${t('newPlayerLabel')}
    </label>
    <div class="claim-form-actions">
      <button class="claim-btn-ok" onclick="confirmRosterJoin()">${rosterEditName ? t('save') : t('register')}</button>
      <button class="claim-btn-cancel" onclick="cancelRosterForm()">${t('cancel')}</button>
    </div>
  </div>` : `<button class="roster-join-btn" onclick="openRosterForm()">${t('joinList')}</button>`;

  let resetBtnHtml = '';
  if (allTeams.roster.length){
    resetBtnHtml = resetConfirmPending
      ? `<div style="margin:0 0 14px;background:rgba(212,120,90,.1);border:1px solid rgba(212,120,90,.4);border-radius:12px;padding:12px;">
          <div style="font-size:12px;color:#e8e3f0;margin-bottom:10px;">${t('resetConfirmMsg')}</div>
          <div style="display:flex;gap:8px;">
            <button class="delete-team-btn" style="flex:1;background:#d4785a;color:#0f0d1a;border-color:#d4785a;" onclick="resetRoster()">${t('resetYes')}</button>
            <button class="claim-btn-cancel" style="flex:1;border-radius:8px;padding:5px 10px;" onclick="cancelResetRoster()">${t('cancel')}</button>
          </div>
        </div>`
      : `<button class="delete-team-btn" style="display:block;width:100%;margin:0 0 14px;" onclick="askResetRoster()">${t('resetList')}</button>`;
  }

  if (!players.length){
    container.innerHTML = joinFormHtml + `<div class="empty-state" style="margin-top:16px;">${t('nobodyYet')}</div>`;
    return;
  }
  container.innerHTML = joinFormHtml + resetBtnHtml + `<div class="roster-list">${players.map(p => {
    const cls = CLASS_OPTIONS.find(c => c.id === p.classId);
    const tagsHtml = p.tags.map(t => `<span class="roster-tag ${t.mode}">${MODE_LABELS[t.mode]} · ${t.team} · ${t.role}</span>`).join('');
    const editBtn = p.fromRoster ? `<button class="slot-leave-btn" onclick="editRoster('${p.name.replace(/'/g,"\\'")}')" title="${t('editTitle')}">✎</button>` : '';
    const leaveBtn = p.fromRoster ? `<button class="slot-leave-btn" onclick="leaveRoster('${p.name.replace(/'/g,"\\'")}')" title="${t('leaveListTitle')}">✕</button>` : '';
    return `<div class="roster-row">
      ${cls ? `<img class="class-icon" src="${cls.icon}" alt="" title="${cls.label}" />` : ''}
      <span class="roster-name">${p.name.replace(/</g,'&lt;')} ${p.isNewPlayer ? LEAF_IMG : ''}</span>
      <div class="roster-tags">${tagsHtml}</div>
      ${editBtn}
      ${leaveBtn}
    </div>`;
  }).join('')}</div>`;
}

function render(){
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('tabBtn-' + activeTab);
  if (activeBtn) activeBtn.classList.add('active');

  renderModeView(activeTab);
  renderSidebarRoster();
}

applyStaticTranslations();

let firstLoad = true;
docRef.onSnapshot(snap => {
  if (snap.exists){
    const d = snap.data();
    allTeams.pve = d.pve || (Array.isArray(d.teams) ? d.teams : []);
    allTeams.pvp = d.pvp || [];
    allTeams.roster = d.roster || [];
  } else if (firstLoad){
    allTeams = { pve: [], pvp: [], roster: [] };
  }
  firstLoad = false;
  render();
}, err => {
  console.error('Firestore error', err);
  document.getElementById('statusLine').textContent = t('connError');
});
</script>
</body>
</html>

/* ===== CACHE VALIDATION DISCORD 24H ===== */
const MCM_ROLE_CACHE_KEY='mcm-discord-role-cache-v1';
const MCM_ROLE_CACHE_TTL=24*60*60*1000;

function readRoleCache(userId=''){
  try{
    const c=JSON.parse(localStorage.getItem(MCM_ROLE_CACHE_KEY)||'null');
    if(!c||!c.userId||!c.validatedAt)return null;
    if(userId && String(c.userId)!==String(userId))return null;
    if(Date.now()-Number(c.validatedAt)>MCM_ROLE_CACHE_TTL){
      localStorage.removeItem(MCM_ROLE_CACHE_KEY);
      return null;
    }
    return c;
  }catch{
    localStorage.removeItem(MCM_ROLE_CACHE_KEY);
    return null;
  }
}

function writeRoleCache(userId,roles,hasMember,hasAdmin){
  localStorage.setItem(MCM_ROLE_CACHE_KEY,JSON.stringify({
    userId:String(userId),
    roles:Array.isArray(roles)?roles.map(String):[],
    hasMember:!!hasMember,
    hasAdmin:!!hasAdmin,
    validatedAt:Date.now()
  }));
}

function clearRoleCache(){
  localStorage.removeItem(MCM_ROLE_CACHE_KEY);
}

async function initAuth(){
  renderLoading(0,'Connexion à Discord…');
  const diag={steps:[],roles:[],scope:'',userId:'',memberStatus:'',firebase:'EN ATTENTE'};
  const step=(name,status,detail='')=>diag.steps.push({name,status,detail});

  try{
    const hash=new URLSearchParams(location.hash.replace(/^#/,''));
    diag.scope=hash.get('scope')||'';

    if(hash.get('error')){
      step('Autorisation OAuth Discord','ERREUR',hash.get('error_description')||hash.get('error'));
      return renderConnectionDiagnostic(diag);
    }

    if(hash.get('access_token')){
      session={
        accessToken:hash.get('access_token'),
        expiresAt:Date.now()+Number(hash.get('expires_in')||3600)*1000
      };
      localStorage.setItem('mcm-discord-session',JSON.stringify(session));
      step('Token OAuth Discord','OK',`scope: ${diag.scope||'non indiqué'}`);
      history.replaceState(null,'',location.pathname);
    }else{
      try{session=JSON.parse(localStorage.getItem('mcm-discord-session')||'null')}catch{session=null}
      step('Session locale',session?.accessToken?'OK':'ABSENTE',session?.expiresAt?`expire: ${new Date(session.expiresAt).toLocaleString('fr-FR')}`:'');
    }

    if(!session?.accessToken){
      step('Token Discord','ERREUR','Aucun access_token');
      return renderConnectionDiagnostic(diag);
    }
    if(session.expiresAt && session.expiresAt<Date.now()){
      step('Token Discord','ERREUR','Token expiré');
      localStorage.removeItem('mcm-discord-session');
      return renderConnectionDiagnostic(diag);
    }

    try{
      await firebaseAuthReady;
      diag.firebase='OK';
      step('Firebase','OK');
    }catch(e){
      diag.firebase='ERREUR';
      step('Firebase','ERREUR',String(e?.message||e));
      return renderConnectionDiagnostic(diag);
    }

    const headers={Authorization:`Bearer ${session.accessToken}`};

    let u;
    try{
      u=await fetch('https://discord.com/api/users/@me',{headers});
      step('Discord /users/@me',u.ok?'OK':`HTTP ${u.status}`,u.statusText||'');
    }catch(e){
      step('Discord /users/@me','ERREUR RÉSEAU',String(e?.message||e));
      return renderConnectionDiagnostic(diag);
    }
    if(!u.ok)return renderConnectionDiagnostic(diag);

    discordUser=await u.json();
    renderLoading(1,'Vérification des rôles Discord…');

    const cachedRoles=readRoleCache(discordUser.id);
    if(cachedRoles && (cachedRoles.hasMember||cachedRoles.hasAdmin)){
      IS_ADMIN=!!cachedRoles.hasAdmin;
      renderLoading(2,'Rôles Discord validés depuis le cache 24h…');
      await loadData();
      renderLoading(3,'Préparation du tableau de bord…');
      await syncOwnPlayer();
      await new Promise(resolve=>setTimeout(resolve,80));
      return window.MCM_RENDER();
    }
    diag.userId=discordUser.id||'';
    step('Utilisateur Discord','OK',`${discordUser.username||'Utilisateur'} · ID ${diag.userId}`);

    let m;
    try{
      m=await fetch(`https://discord.com/api/users/@me/guilds/${GUILD_ID}/member`,{headers});

      if(m.status===429){
        let retryAfter=2;
        try{
          const rate=await m.clone().json();
          retryAfter=Math.max(1,Number(rate.retry_after)||2);
          step('Discord rate limit','ATTENTE',`Nouvel essai automatique dans ${Math.ceil(retryAfter)} s`);
        }catch{}
        await new Promise(resolve=>setTimeout(resolve,Math.min(retryAfter*1000+300,45000)));
        m=await fetch(`https://discord.com/api/users/@me/guilds/${GUILD_ID}/member`,{headers});
      }

      diag.memberStatus=`HTTP ${m.status}`;
      step('Discord membre du serveur',m.ok?'OK':`HTTP ${m.status}`,m.statusText||'');
    }catch(e){
      step('Discord membre du serveur','ERREUR RÉSEAU',String(e?.message||e));
      return renderConnectionDiagnostic(diag);
    }

    if(!m.ok){
      try{
        const body=await m.text();
        if(body)step('Réponse API membre','INFO',body.slice(0,500));
      }catch{}
      return renderConnectionDiagnostic(diag);
    }

    discordMember=await m.json();
    diag.roles=Array.isArray(discordMember.roles)?discordMember.roles.map(String):[];
    step('Rôles Discord','OK',`${diag.roles.length} rôle(s) reçu(s)`);

    const hasMember=diag.roles.includes(String(REQUIRED_ROLE_ID));
    const hasAdmin=diag.roles.includes(String(ADMIN_ROLE_ID));
    step('Rôle membre requis',hasMember?'OK':'NON',String(REQUIRED_ROLE_ID));
    step('Rôle admin',hasAdmin?'OK':'NON',String(ADMIN_ROLE_ID));

    if(!hasMember&&!hasAdmin)return renderConnectionDiagnostic(diag);

    IS_ADMIN=hasAdmin;
    writeRoleCache(discordUser.id,diag.roles,hasMember,hasAdmin);
    renderLoading(2,'Chargement des joueurs et des classes…');
    await loadData();
    renderLoading(3,'Préparation du tableau de bord…');
    step('Chargement des données','OK');
    syncOwnPlayer();
    window.MCM_RENDER();

  }catch(e){
    step('Erreur JavaScript','ERREUR',`${e?.name||'Error'}: ${e?.message||e}`);
    console.error(e);
    renderConnectionDiagnostic(diag);
  }
}

function startPresenceTracking(){
  if(!discordUser||PRESENCE_UNSUB)return;
  const mine=presenceRef.doc(String(discordUser.id));
  const ping=()=>mine.set({discordId:String(discordUser.id),lastSeen:Date.now(),online:true},{merge:true}).catch(err=>console.warn('Présence indisponible',err));
  ping(); PRESENCE_TIMER=setInterval(ping,45000);
  PRESENCE_UNSUB=presenceRef.onSnapshot(snapshot=>{
    const limit=Date.now()-120000;
    ONLINE_DISCORD_IDS=new Set(snapshot.docs.map(d=>d.data()).filter(p=>p.online!==false&&Number(p.lastSeen||0)>=limit).map(p=>String(p.discordId||'')));
    if(ACTIVE==='dashboard'&&document.querySelector('.shell'))window.MCM_RENDER();
  },err=>console.warn('Liste de présence indisponible',err));
  window.addEventListener('beforeunload',()=>mine.set({online:false,lastSeen:Date.now()},{merge:true}).catch(()=>{}),{once:true});
}

async function createSearchGroup(activity,expeditionDungeon='',sanctuaryDungeon='',sanctuaryMode='',transcendenceDungeon='',schedule=null){
  if(!window.MCM_SEARCH_ACTIVITIES.includes(activity))return;
  const me=myPlayer();
  if(!me||!me.classId)return showToast('Configure d’abord ta classe');
  if(activity==='Expéditions'&&!MCM_EXPEDITION_DUNGEONS.includes(expeditionDungeon)){
    return openExpeditionDungeonChoice();
  }
  if(activity==='Sanctuary'){
    if(!MCM_SANCTUARY_DUNGEONS.includes(sanctuaryDungeon))return openSanctuaryDungeonChoice();
    const allowedModes=MCM_SANCTUARY_MODES[sanctuaryDungeon]||['Normal'];
    if(!allowedModes.includes(sanctuaryMode))return openSanctuaryDungeonChoice();
  }
  if(activity==='Transcendances'&&!MCM_TRANSCENDENCE_DUNGEONS.includes(transcendenceDungeon)){
    return openTranscendenceDungeonChoice();
  }

  // Sanctuary = activité à 10 joueurs : création automatique de deux groupes de 5.
  if(activity==='Sanctuary'){
    const pairId='sanctuary_'+Date.now();
    const makeGroup=(letter)=>{
      const g={
        id:'sg_'+Date.now()+'_'+letter.toLowerCase(),
        activity:'Sanctuary',
        sanctuaryDungeon,
        sanctuaryMode,
        type:'pve',
        subgroup:letter,
        sanctuaryPairId:pairId,
        sequence:letter==='A'?1:2,
        createdAt:Date.now(),
        createdByPlayerId:me.id,
        leaderId:letter==='A'?me.id:'',
        memberIds:[],
        slots:{tank:'',dps1:'',dps2:'',dps3:'',heal:''}
      };
      return g;
    };

    const groupA=makeGroup('A');
    const groupB=makeGroup('B');

    const preferred=myPreferredSearchSlot(me.classId,groupA);
    if(!preferred)return showToast('Aucun slot compatible disponible');
    groupA.slots[preferred]=me.id;
    groupA.memberIds=[me.id];

    SEARCH_GROUPS.push(groupA,groupB);
    addActivity('group',`${playerName(me)} a créé une recherche Sanctuary`,`${sanctuaryDungeon}${sanctuaryMode?' · '+sanctuaryMode:''}`,me);
    let scheduledEvent=null;
    if(schedule){scheduledEvent={id:'gev_'+Date.now(),source:'searchGroup',sourceGroupId:groupA.id,sanctuaryPairId:pairId,groupId:groupA.id,groupName:`Sanctuary · ${sanctuaryDungeon}`,sanctuaryDungeon,sanctuaryMode,activity:'Sanctuary',type:'pve',date:schedule.date,time:schedule.time,note:schedule.note||'',leaderId:me.id,memberIds:[me.id],createdAt:Date.now(),createdBy:discordUser?.id||'',status:'planned'};PLANNED_EVENTS.push(scheduledEvent);addActivity('event',`${playerName(me)} a planifié un événement`,`Sanctuary · ${schedule.date} à ${schedule.time}`,me)}
    await saveData();
    if(schedule?.publish)await postSearchGroupToDiscord(groupA,scheduledEvent);
    overlay.innerHTML='';
    showToast('Sanctuary créé : Groupe A + Groupe B');
    window.MCM_RENDER();
    return;
  }

  let max=0;
  SEARCH_GROUPS.filter(g=>g.activity===activity).forEach(g=>{const n=Number(g.sequence)||0;max=Math.max(max,n)});
  const g={
    id:'sg_'+Date.now(),
    activity,
    expeditionDungeon:activity==='Expéditions'?expeditionDungeon:'',
    transcendenceDungeon:activity==='Transcendances'?transcendenceDungeon:'',
    type:window.MCM_ACTIVITY_TYPE(activity),
    sequence:max+1,
    createdAt:Date.now(),
    createdByPlayerId:me.id,
    leaderId:me.id,
    memberIds:[],
    slots:{tank:'',dps1:'',dps2:'',dps3:'',heal:''}
  };
  const preferred=myPreferredSearchSlot(me.classId,g);
  if(!preferred)return showToast('Aucun slot compatible disponible');
  g.slots[preferred]=me.id;
  g.memberIds=[me.id];
  SEARCH_GROUPS.push(g);

function missingRoleTags(groups){
  const missing=new Set();
  groups.forEach(g=>{
    fixedSlotDefs().forEach(d=>{
      if(!g.slots||!g.slots[d.key])missing.add(d.role);
    });
  });
  return ['tank','dps','heal'].filter(r=>missing.has(r)).map(r=>`<@&${ROLE_TAG_IDS[r]}>`).join(' ');
}

async function loadData(){
  const snap=await docRef.get();
  if(snap.exists){
    const d=snap.data();
    PLAYERS=Array.isArray(d.players)?d.players:[];
    FIXED_GROUPS=Array.isArray(d.fixedGroups)?d.fixedGroups:[];
    SEARCH_GROUPS=Array.isArray(d.searchGroups)?d.searchGroups:[];
    PLANNED_EVENTS=Array.isArray(d.plannedEvents)?d.plannedEvents:[];
    ACTIVITY_LOG=Array.isArray(d.activityLog)?d.activityLog:[];
    REMOVED_LEGACY_DISCORD_IDS=Array.isArray(d.removedLegacyDiscordIds)?d.removedLegacyDiscordIds:[];
    if(Array.isArray(d.classes)&&d.classes.length)CLASSES=d.classes;
    normalizeClassRoles();
  }
  /* Importation sûre des membres de l'ancien site : lecture seule de guildManager,
     fusion par identifiant Discord, puis sauvegarde uniquement dans guildManagerTest. */
  try{
    const legacySnap=await legacyDocRef.get();
    const legacyPlayers=legacySnap.exists&&Array.isArray(legacySnap.data().players)?legacySnap.data().players:[];
    const knownDiscordIds=new Set(PLAYERS.map(p=>p.discordId).filter(Boolean));
    const knownIds=new Set(PLAYERS.map(p=>p.id).filter(Boolean));
    const removedLegacyIds=new Set(REMOVED_LEGACY_DISCORD_IDS);
    const imported=legacyPlayers.filter(p=>p&&!removedLegacyIds.has(p.discordId)&&(p.discordId?!knownDiscordIds.has(p.discordId):!knownIds.has(p.id))).map(p=>({...p,importedFromLegacy:true}));
    if(imported.length){
      PLAYERS.push(...imported);
      addActivity('profile',`${imported.length} compte${imported.length>1?'s':''} membre${imported.length>1?'s':''} importé${imported.length>1?'s':''}`,'Synchronisation depuis equipes.html');
      await saveData();
    }
  }catch(err){console.warn('Import des anciens membres indisponible',err)}
  startRealtimeDataSync();
}
function dataFingerprint(d){return JSON.stringify([d.players||[],d.fixedGroups||[],d.searchGroups||[],d.plannedEvents||[],d.activityLog||[]])}
function startRealtimeDataSync(){
  if(LIVE_DATA_UNSUB)return;
  LIVE_DATA_FINGERPRINT=dataFingerprint({players:PLAYERS,fixedGroups:FIXED_GROUPS,searchGroups:SEARCH_GROUPS,plannedEvents:PLANNED_EVENTS,activityLog:ACTIVITY_LOG});
  LIVE_DATA_UNSUB=docRef.onSnapshot(snap=>{
    if(!snap.exists)return;
    const d=snap.data(),fingerprint=dataFingerprint(d);
    if(fingerprint===LIVE_DATA_FINGERPRINT)return;
    LIVE_DATA_FINGERPRINT=fingerprint;
    PLAYERS=Array.isArray(d.players)?d.players:[];
    FIXED_GROUPS=Array.isArray(d.fixedGroups)?d.fixedGroups:[];
    SEARCH_GROUPS=Array.isArray(d.searchGroups)?d.searchGroups:[];
    PLANNED_EVENTS=Array.isArray(d.plannedEvents)?d.plannedEvents:[];
    ACTIVITY_LOG=Array.isArray(d.activityLog)?d.activityLog:[];
    REMOVED_LEGACY_DISCORD_IDS=Array.isArray(d.removedLegacyDiscordIds)?d.removedLegacyDiscordIds:REMOVED_LEGACY_DISCORD_IDS;
    if(Array.isArray(d.classes)&&d.classes.length)CLASSES=d.classes;
    normalizeClassRoles();
    if(document.querySelector('.shell'))window.MCM_RENDER();
  },err=>console.error('Synchronisation Firebase en temps réel indisponible',err));
}
function saveData(){
  return docRef.set({players:PLAYERS,classes:CLASSES,fixedGroups:FIXED_GROUPS,searchGroups:SEARCH_GROUPS,plannedEvents:PLANNED_EVENTS,activityLog:ACTIVITY_LOG,removedLegacyDiscordIds:REMOVED_LEGACY_DISCORD_IDS},{merge:true})
}

}
function activitySymbol(type){return ({profile:'✎',group:'⚔',join:'+',leave:'−',event:'◆',delete:'×'})[type]||'•'}
function activityTime(ts){const diff=Math.max(0,Date.now()-Number(ts||0));if(diff<60000)return 'Maintenant';if(diff<3600000)return `${Math.floor(diff/60000)} min`;if(diff<86400000)return `${Math.floor(diff/3600000)} h`;return new Date(ts).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}

function translateTextToEnglish(text){
  const lead=text.match(/^\s*/)?.[0]||'',trail=text.match(/\s*$/)?.[0]||'',core=text.trim();
  if(!core)return text;
  if(EN_TRANSLATIONS[core])return lead+EN_TRANSLATIONS[core]+trail;
  const lowerCore=core.toLowerCase();
  for(const key in EN_TRANSLATIONS){
    if(key.toLowerCase()===lowerCore){
      let translated=EN_TRANSLATIONS[key];
      if(core===core.toUpperCase()&&core!==core.toLowerCase())translated=translated.toUpperCase();
      return lead+translated+trail;
    }
  }
  const rules=[[/^(\d+) profils complétés$/,'$1 completed profiles'],[/^(\d+) joueur\(s\)$/,'$1 player(s)'],[/^(\d+)\/(\d+) joueurs$/,'$1/$2 players'],[/^(\d+) joueurs$/,'$1 players'],[/^(\d+) joueur$/,'$1 player'],[/^Groupe supprimé$/,'Group deleted'],[/^Membre ajouté au groupe$/,'Member added to group'],[/^Emplacement libéré$/,'Slot cleared'],
    [/(\d{4}-\d{2}-\d{2}) à (\d{1,2}:\d{2})/,'$1 at $2'],
    [/^(.+) a été supprimé par un administrateur$/,'$1 was deleted by an administrator'],
    [/^(.+) a planifié un événement$/,'$1 scheduled an event'],
    [/^(.+) a créé une recherche de groupe$/,'$1 created a group search'],
    [/^(.+) a créé une recherche Sanctuary$/,'$1 created a Sanctuary search'],
    [/^(.+) a créé son profil$/,'$1 created their profile'],
    [/^(.+) a mis à jour son profil$/,'$1 updated their profile'],
    [/^(.+) a rejoint une recherche$/,'$1 joined a search'],
    [/^(.+) a créé (.+)$/,'$1 created $2'],
    [/^(.+) a rejoint (.+)$/,'$1 joined $2'],
  ];
  for(const [pattern,replacement] of rules)if(pattern.test(core))return lead+core.replace(pattern,replacement)+trail;
  return text;
}
function applyLanguage(root=document){
  document.documentElement.lang=CURRENT_LANG;
  if(CURRENT_LANG!=='en')return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{n.nodeValue=translateTextToEnglish(n.nodeValue)});
  root.querySelectorAll?.('[placeholder]').forEach(el=>{const translated=EN_TRANSLATIONS[el.placeholder];if(translated)el.placeholder=translated});
}

  const embed={

      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({channelId:LFG_CHANNEL_ID,content,embed,refType,refId,docId:MCM_DOC_ID,threadName:activityLabel})

function eventRoleForMember(ev,playerId){
  const inspect=(g)=>{
    if(!g||!g.slots)return '';
    if(g.slots.tank===playerId)return 'tank';
    if(g.slots.heal===playerId)return 'heal';
    if([g.slots.dps1,g.slots.dps2,g.slots.dps3].includes(playerId))return 'dps';
    return '';
  };
  if(ev?.source==='searchGroup')return inspect(SEARCH_GROUPS.find(g=>g.id===ev.sourceGroupId))||'dps';
  if(ev?.source==='fixedGroup')return inspect(FIXED_GROUPS.find(g=>g.id===ev.sourceGroupId))||'dps';
  const fg=FIXED_GROUPS.find(g=>g.id===ev?.groupId);
  if(fg)return inspect(fg)||'dps';
  const p=PLAYERS.find(x=>x.id===playerId);
  if(p?.classId==='templar')return 'tank';
  if(p?.classId==='cleric'||p?.classId==='chanter')return 'heal';
  return 'dps';
}

function plannedEventMemberIds(ev){
  if(Array.isArray(ev.memberIds)&&ev.memberIds.length)return ev.memberIds;
  if(ev?.source==='searchGroup'){
    const g=SEARCH_GROUPS.find(x=>x.id===ev.sourceGroupId);
    return g?searchGroupMembers(g).map(p=>p.id):[];
  }
  const fg=FIXED_GROUPS.find(x=>x.id===(ev?.sourceGroupId||ev?.groupId));
  return fg?groupMembers(fg).map(p=>p.id):[];
}

function eventSourceStillExists(ev){
  if(!ev)return false;

  // Événement provenant d'une recherche de groupe.
  if(ev.source==='searchGroup' || ev.sourceGroupId || ev.sanctuaryPairId){
    if(ev.sanctuaryPairId){
      return SEARCH_GROUPS.some(g=>g.sanctuaryPairId===ev.sanctuaryPairId);
    }
    const id=ev.sourceGroupId||ev.groupId;
    if(ev.source==='searchGroup') return !!SEARCH_GROUPS.find(g=>g.id===id);
  }

  // Événement provenant d'un groupe STATIC.
  if(ev.source==='fixedGroup'){
    const id=ev.sourceGroupId||ev.groupId;
    return !!FIXED_GROUPS.find(g=>g.id===id);
  }

  // Compatibilité avec les anciens événements qui n'avaient pas "source".
  if(ev.groupId){
    return !!SEARCH_GROUPS.find(g=>g.id===ev.groupId) || !!FIXED_GROUPS.find(g=>g.id===ev.groupId);
  }

  // Événement autonome : on le garde.
  return true;
}

        sanctuaryMode:a?.sanctuaryMode||b?.sanctuaryMode||'',

function localEventParts(timestamp){const d=new Date(timestamp),pad=n=>String(n).padStart(2,'0');return{date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,time:`${pad(d.getHours())}:${pad(d.getMinutes())}`}}
function abyssBossEvents(startMs,endMs,intervalMode='none'){
  const events=[],seenDays=new Set(),taiwanShift=8*3600000;
  for(let cursor=startMs-2*86400000;cursor<=endMs+2*86400000;cursor+=86400000){
    const tw=new Date(cursor+taiwanShift),y=tw.getUTCFullYear(),m=tw.getUTCMonth(),d=tw.getUTCDate(),dayKey=`${y}-${m}-${d}`;
    if(seenDays.has(dayKey))continue;seenDays.add(dayKey);

    MCM_ABYSS_BOSSES.filter(b=>b.days?.includes(weekday)).forEach(b=>{
      const timestamp=Date.UTC(y,m,d,b.hour-8,b.minute||0),parts=localEventParts(timestamp);
      if(timestamp<startMs||timestamp>endMs)return;
      events.push({id:`abyss-${b.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${timestamp}`,source:'abyssBoss',type:'abyss',activity:b.name,groupName:`Abyss Boss · ${b.zone}`,date:parts.date,time:parts.time,timestamp,note:'Horaire serveur Taïwan (GMT+8), converti automatiquement dans ton fuseau local.'});
    });

  const watcher=MCM_ABYSS_BOSSES[0];

    const first=new Date(startMs);first.setHours(0,0,0,0);
    for(let day=new Date(first);day.getTime()<=endMs;day.setDate(day.getDate()+1)){
      const timestamp=new Date(day).setHours(12,0,0,0),parts=localEventParts(timestamp);
      events.push({id:`abyss-watcher-${parts.date}`,source:'abyssBoss',type:'abyss',activity:watcher.name,groupName:`Abyss Boss · ${watcher.zone}`,date:parts.date,time:'Toutes les heures',timestamp,note:'Réapparition toutes les 60 minutes.'});
    }
  }else if(intervalMode==='next'){
    const timestamp=Math.ceil((Math.max(Date.now(),startMs)+1)/3600000)*3600000;
    if(timestamp<=endMs){const parts=localEventParts(timestamp);events.push({id:`abyss-watcher-${timestamp}`,source:'abyssBoss',type:'abyss',activity:watcher.name,groupName:`Abyss Boss · ${watcher.zone}`,date:parts.date,time:parts.time,timestamp,note:'Prochaine réapparition horaire estimée.'})}
  }
  return events.sort((a,b)=>a.timestamp-b.timestamp);
}

  return `${hero('CALENDRIER','Tous les événements de la guilde')}<div class="calendar-toolbar"><div class="calendar-nav"><button class="btn ghost" id="calendarPrev">‹</button><div class="calendar-week-label">${label}</div><button class="btn ghost" id="calendarNext">›</button><button class="btn" id="calendarToday">Aujourd’hui</button></div><div class="calendar-filters">${[['all','Tous'],['abyss','Abyss Boss'],['pve','PvE'],['pvp','PvP'],['rvr','RVR'],['static','STATIC']].map(([key,name])=>`<button class="btn calendar-filter ${CALENDAR_FILTER===key?'active':''}" data-calendar-filter="${key}">${name}</button>`).join('')}</div></div><div class="calendar-grid">${days.map(day=>{const pad=n=>String(n).padStart(2,'0'),key=`${day.getFullYear()}-${pad(day.getMonth()+1)}-${pad(day.getDate())}`,today=new Date().toDateString()===day.toDateString(),dayEvents=events.filter(event=>event.date===key).sort((a,b)=>(a.timestamp||new Date(`${a.date}T${a.time||'00:00'}`).getTime())-(b.timestamp||new Date(`${b.date}T${b.time||'00:00'}`).getTime()));return `<section class="calendar-day${today?' today':''}"><div class="calendar-day-head">${day.toLocaleDateString(CURRENT_LANG==='en'?'en-GB':'fr-FR',{weekday:'long'})}<b>${day.getDate()}</b>${day.toLocaleDateString(CURRENT_LANG==='en'?'en-GB':'fr-FR',{month:'short'})}</div><div class="calendar-events">${dayEvents.length?dayEvents.map(event=>`<button class="calendar-event" style="--event-color:${eventDisplayColor(event)}" data-calendar-event="${esc(event.id)}"><div class="calendar-event-time">${esc(event.time||'—')}</div><div class="calendar-event-name">${esc(event.activity||event.title||'Événement')}</div><div class="calendar-event-group">${esc(event.groupName||'Groupe')}</div></button>`).join(''):'<div class="calendar-day-empty">Aucun événement</div>'}</div></section>`}).join('')}</div>`;
}
function openCalendarEvent(eventId){
  const event=PLANNED_EVENTS.find(item=>item.id===eventId)||MCM_ABYSS_EVENT_CACHE.find(item=>item.id===eventId);if(!event)return;
  if(event.source==='abyssBoss'){overlay.innerHTML=`<div class="modal-backdrop"><div class="modal"><h3 style="color:#f5b84b">${esc(event.activity)}</h3><div class="event-summary"><b>${esc(event.groupName)}</b><br>📅 ${esc(event.date)} · ${esc(event.time)}<br><br>${esc(event.note||'Horaire Abyss Boss')}</div><div class="modal-actions"><button class="btn" id="closeCalendarEvent">Fermer</button><a class="btn primary" href="./abyss-boss.html">Ouvrir Abyss Boss</a></div></div></div>`;document.getElementById('closeCalendarEvent').onclick=()=>overlay.innerHTML='';return}
  const search=SEARCH_GROUPS.find(group=>group.id===(event.sourceGroupId||event.groupId)),fixed=FIXED_GROUPS.find(group=>group.id===event.groupId),group=search||fixed,me=myPlayer();let action='';
  if(search&&me&&!playerInSearchGroup(search,me.id)){const slot=preferredOpenSlotForGroup(search,me);if(slot)action=`<button class="btn primary" id="calendarJoin" data-kind="search" data-group="${search.id}" data-slot="${slot}">Rejoindre le groupe</button>`}
  if(fixed&&me&&!playerInFixedGroup(fixed,me.id)){const slot=preferredOpenSlotForGroup(fixed,me);if(slot)action=`<button class="btn primary" id="calendarJoin" data-kind="fixed" data-group="${fixed.id}" data-slot="${slot}">Rejoindre le groupe</button>`}
  const members=group?(search?searchGroupMembers(search):groupMembers(fixed)):[];
  overlay.innerHTML=`<div class="modal-backdrop"><div class="modal"><h3>${esc(event.activity||event.title||'Événement')}</h3><div class="event-summary"><b>${esc(event.groupName||'Groupe')}</b><br>📅 ${esc(event.date)} · ${esc(event.time||'')}<br>👥 ${members.length}/${search?.activity==='Sanctuary'?10:5} joueurs${event.note?`<br><br>${esc(event.note)}`:''}</div><div class="avatar-stack" style="margin:14px 0">${members.map(player=>player.discordAvatar?`<img src="${esc(player.discordAvatar)}" title="${esc(playerName(player))}" alt="">`:'').join('')}</div><div class="modal-actions"><button class="btn" id="closeCalendarEvent">Fermer</button>${action}</div></div></div>`;
  document.getElementById('closeCalendarEvent').onclick=()=>overlay.innerHTML='';document.getElementById('calendarJoin')?.addEventListener('click',async button=>{const target=button.currentTarget;overlay.innerHTML='';if(target.dataset.kind==='search')await joinSearchSlot(target.dataset.group,target.dataset.slot);else await joinFixedSlot(target.dataset.group,target.dataset.slot)});
}

function fetchDiscordMembersList(){
  fetch('./discord-members.json?t='+Date.now())
    .then(r=>r.ok?r.json():null)
    .then(data=>{
      if(!data)return;
      DISCORD_MEMBERS_WITH_ROLE=data.members||[];
      if(ACTIVE==='dashboard'&&document.querySelector('.shell'))window.MCM_RENDER();
    })
    .catch(()=>{});
}
function unregisteredDiscordMembers(){
  const registeredIds=new Set(PLAYERS.map(p=>p.discordId).filter(Boolean));
  return DISCORD_MEMBERS_WITH_ROLE.filter(m=>!registeredIds.has(m.id));
}
function openUnregisteredList(){
  const members=unregisteredDiscordMembers();
  overlay.innerHTML=`<div class="modal-backdrop"><div class="modal"><h3>Joueurs non inscrits</h3><div class="class-members-list">${members.length?members.map(m=>`<div class="class-member-row">${m.avatar?`<img class="member-avatar" src="${esc(m.avatar)}" alt="">`:`<div class="member-avatar avatar-fallback">${esc((m.nick||m.globalName||m.username||'?').slice(0,2).toUpperCase())}</div>`}<div><div class="class-member-name">${esc(m.nick||m.globalName||m.username)}</div></div></div>`).join(''):'<div style="padding:14px;color:#8290aa;">Tout le monde est inscrit 🎉</div>'}</div><div class="modal-actions"><button class="btn" id="closeUnregistered">Fermer</button></div></div></div>`;
  document.getElementById('closeUnregistered').onclick=()=>overlay.innerHTML='';
}
function openPresenceList(kind){
  const online=kind==='online', members=PLAYERS.filter(p=>!!(p.discordId&&ONLINE_DISCORD_IDS.has(String(p.discordId)))===online);

  document.getElementById('closePresenceList').onclick=()=>overlay.innerHTML='';

function renderDashboard(){
  const total=PLAYERS.length,assigned=PLAYERS.filter(p=>p.classId).length,newc=PLAYERS.filter(p=>p.isNewPlayer).length;

    <div class="stats">
      <div class="metric blue"><div class="metric-icon">${icon('users','ui-icon')}</div><div><div class="metric-value">${total}</div><div class="metric-label">MEMBRES ACTIFS</div><div class="metric-note good">${assigned} profils complétés</div></div></div>
      <div class="metric violet"><div class="metric-icon">${icon('shield','ui-icon')}</div><div><div class="metric-value">${CLASSES.length}</div><div class="metric-label">CLASSES DISPONIBLES</div><div class="metric-note">Système Aion 2</div></div></div>
      <div class="metric green"><div class="metric-icon">${icon('swords','ui-icon')}</div><div><div class="metric-value">${SEARCH_GROUPS.length}</div><div class="metric-label">RECHERCHES ACTIVES</div><div class="metric-note good">${SEARCH_GROUPS.filter(g=>window.MCM_ACTIVITY_TYPE(g.activity)==='pve').length} PvE · ${SEARCH_GROUPS.filter(g=>window.MCM_ACTIVITY_TYPE(g.activity)==='pvp').length} PvP · ${SEARCH_GROUPS.filter(g=>window.MCM_ACTIVITY_TYPE(g.activity)==='rvr').length} RVR</div></div></div>
      <div class="metric gold"><div class="metric-icon">${icon('calendar','ui-icon')}</div><div><div class="metric-value">${upcoming.length}</div><div class="metric-label">ÉVÉNEMENTS À VENIR</div><div class="metric-note">Groupes et Abyss Boss</div></div></div>
    </div>

    <div class="main-grid">
      <section class="card card-pad">
        <h3 class="card-title">${icon('dashboard','ui-icon')}ACTIVITÉ RÉCENTE ${IS_ADMIN&&!PREVIEW_AS_MEMBER?`<button class="btn ghost activity-admin-btn" id="manageActivitiesBtn">Gérer</button>`:''}</h3>
        <div class="activity-list">${recent.length?recent.map(a=>`<div class="activity-row"><div class="act-ico">${a.avatar?`<img src="${esc(a.avatar)}" alt="${esc(a.playerName||'Joueur')}" loading="lazy">`:activitySymbol(a.type)}</div><div><div class="act-main"><strong>${esc(a.message||'Nouvelle activité')}</strong></div><div class="act-sub">${esc(a.detail||'MCM')}</div></div><div class="act-time">${activityTime(a.createdAt)}</div></div>`).join(''):'<div class="act-sub">Aucune activité enregistrée pour le moment. Les prochaines créations, inscriptions et mises à jour apparaîtront ici.</div>'}</div>
      </section>

      <section class="card members-card">
        <h3 class="card-title">${icon('users','ui-icon')}APERÇU DES MEMBRES</h3>
        <div class="members-top"><div class="donut" style="--a:${cutA}%;--b:${cutB}%;--c:${cutC}%"><div class="donut-inner"><div><b>${grandTotal}</b><span>Total</span></div></div></div><div class="legend"><div class="legend-row" data-presence-list="online" style="cursor:pointer" title="Voir les membres en ligne"><span class="dot" style="background:#00d99f;box-shadow:0 0 8px #00d99f"></span><span>En ligne</span><b>${onlineCount}</b></div><div class="legend-row" data-presence-list="offline" style="cursor:pointer" title="Voir les membres déconnectés"><span class="dot" style="background:#64748b"></span><span>Déconnectés</span><b>${offlineCount}</b></div><div class="legend-row"><span class="dot" style="background:#f0a641"></span><span>Nouveaux</span><b>${newc}</b></div><div class="legend-row" data-open-unregistered="1" style="cursor:pointer" title="Voir les membres Discord non inscrits"><span class="dot" style="background:#7657ff"></span><span>Joueurs non inscrits</span><b>${unregisteredCount}</b></div></div></div>
        <div class="split-title">RÉPARTITION DES CLASSES</div>
        <div class="dashboard-class-grid">${CLASSES.map(c=>{const count=PLAYERS.filter(p=>p.classId===c.id).length;return `<button class="dashboard-class-item" style="--class-color:${c.color||'#168bff'}" data-dashboard-class="${esc(c.id)}" title="Voir les joueurs ${esc(c.name)}"><img src="${c.icon}" alt="${esc(c.name)}"><div class="dashboard-class-count">${count}</div><div class="dashboard-class-name">${esc(c.name)}</div></button>`}).join('')}</div>
      </section>

      <section class="card events-card">
        <h3 class="card-title">${icon('calendar','ui-icon')}ÉVÉNEMENTS À VENIR</h3>
        <div class="events-scroll">${upcoming.map(e=>`<div class="event-row">
          <div class="event-icon" style="border-color:${eventDisplayColor(e)}66;background:${eventDisplayColor(e)}18;color:${eventDisplayColor(e)}">${e.source==='abyssBoss'?'☠':e.type==='rvr'?'⚑':e.type==='pvp'?'⚔':'✦'}</div>
          <div>

            <div class="event-sub">${e.source==='abyssBoss'?'ABYSS BOSS':e.source==='searchGroup'?'RECHERCHE':'STATIC'} · ${esc(e.time||'')}</div>
            <div class="event-avatar-stack">${e.source==='abyssBoss'?'':eventAvatars(e)}</div>
          </div>
          <div class="event-date">${new Date(e.date+'T00:00').toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','').toUpperCase()}<b>${e.date.slice(-2)}</b>${new Date(e.date+'T00:00').toLocaleDateString('fr-FR',{month:'short'})}</div>
        </div>`).join('')||'<div class="act-sub">Aucun événement planifié.</div>'}</div>

        <div class="dashboard-scroll-wrap"><div class="groups-grid">${dashboardSearchGroups().map(dashboardSearchTile).join('')||'<div class="group-count">Aucune recherche active.</div>'}</div></div>
      </section>

      <section class="card groups-card">
        <h3 class="card-title">${icon('swords','ui-icon')}GROUPES STATIC <span class="card-title-link" data-tab="fixed-all">Voir tous les groupes ›</span></h3>
        <div class="dashboard-scroll-wrap"><div class="groups-grid">${FIXED_GROUPS.map(g=>{normalizeFixedGroup(g);const members=groupMembers(g),ev=latestGroupEvent(g.id);return `<div class="group-tile"><span class="tag">STATIC</span><div class="group-name">${esc(g.name)}</div><div class="group-time">${ev?esc(ev.activity)+' · '+esc(ev.date)+' · '+esc(ev.time):'Aucun événement planifié'}</div><div class="avatar-stack">${members.slice(0,5).map(p=>p.discordAvatar?`<img src="${esc(p.discordAvatar)}" alt="">`:'').join('')}</div><div class="group-count">${members.length}/5 joueurs</div></div>`}).join('')||'<div class="group-count">Aucun groupe STATIC créé.</div>'}</div></div>

    </div>
  </div>`;
}

window.MCM_RENDER=function(){
  let content='';
  if(ACTIVE==='players') content=renderPlayers();
  else if(ACTIVE==='classes') content=renderClasses();
  else if(ACTIVE==='fixed-all'||ACTIVE==='fixed-pve'||ACTIVE==='fixed-pvp') content=renderFixedGroups();
  else if(ACTIVE==='search-groups') content=renderSearchGroups();
  else if(ACTIVE==='messages') content=renderMessages();
  else if(ACTIVE==='calendar') content=renderCalendar();
  else content=renderDashboard();

  app.innerHTML=`<div class="mobile-topbar"><img src="./mcm-logo.png" alt="MCM"><span class="mobile-topbar-title">MMO Connect Manager</span><button class="mobile-menu-btn" id="mobileMenuBtn">☰</button></div><div class="mobile-overlay${MOBILE_NAV_OPEN?' open':''}" id="mobileOverlay"></div><div class="shell">${sidebar()}<main class="main">${content}</main></div>${mobileBottomNav()}`;
  document.querySelector('.sidebar')?.classList.toggle('mobile-open',MOBILE_NAV_OPEN);
  bind();
  applyLanguage(app);
  checkEventNotifications();
};
function mobileBottomNav(){
  const items=[
    {tab:'dashboard',icon:'dashboard',label:'Accueil'},
    {tab:'players',icon:'users',label:'Joueurs'},
    {tab:'search-groups',icon:'swords',label:'Recherche'},
    {tab:'messages',icon:'message',label:'Chat'},
  ];
  const unread=unreadMentionCount();
  return `<div class="mobile-bottom-nav">${items.map(it=>`<button data-tab="${it.tab}" class="mobile-bottom-item${ACTIVE===it.tab?' active':''}">${icon(it.icon,'mobile-bottom-icon')}<span>${it.label}</span>${it.tab==='messages'&&unread?`<span class="mobile-bottom-badge">${unread}</span>`:''}</button>`).join('')}<button class="mobile-bottom-item" id="mobileMoreBtn"><span class="mobile-bottom-icon" style="font-size:19px;line-height:1">⋯</span><span>Plus</span></button></div>`;
}


function bind(){

  document.getElementById('mobileOverlay')?.addEventListener('click',()=>{MOBILE_NAV_OPEN=false;window.MCM_RENDER()});
  document.getElementById('mobileMoreBtn')?.addEventListener('click',()=>{MOBILE_NAV_OPEN=true;window.MCM_RENDER()});
  document.getElementById('announceBtn')?.addEventListener('click',openAnnounceModal);
  document.getElementById('previewBtn')?.addEventListener('click',()=>{PREVIEW_AS_MEMBER=!PREVIEW_AS_MEMBER;window.MCM_RENDER()});

  document.getElementById('languageBtn')?.addEventListener('click',openLanguageMenu);

  const chatMessages=document.getElementById('chatMessages');if(chatMessages)requestAnimationFrame(()=>chatMessages.scrollTop=chatMessages.scrollHeight);
  document.getElementById('calendarPrev')?.addEventListener('click',()=>{CALENDAR_OFFSET--;window.MCM_RENDER()});
  document.getElementById('calendarNext')?.addEventListener('click',()=>{CALENDAR_OFFSET++;window.MCM_RENDER()});
  document.getElementById('calendarToday')?.addEventListener('click',()=>{CALENDAR_OFFSET=0;window.MCM_RENDER()});
  document.querySelectorAll('[data-calendar-filter]').forEach(button=>button.addEventListener('click',()=>{CALENDAR_FILTER=button.dataset.calendarFilter;window.MCM_RENDER()}));
  document.querySelectorAll('[data-calendar-event]').forEach(button=>button.addEventListener('click',()=>openCalendarEvent(button.dataset.calendarEvent)));
  document.getElementById('addPlayerBtn')?.addEventListener('click',()=>openPlayerModal());

    PLAYER_FILTERS.search=e.target.value;

  });
  document.getElementById('playerClassFilter')?.addEventListener('change',(e)=>{PLAYER_FILTERS.classId=e.target.value;window.MCM_RENDER()});
  document.getElementById('playerStatusFilter')?.addEventListener('change',(e)=>{PLAYER_FILTERS.status=e.target.value;window.MCM_RENDER()});
  document.getElementById('playerSortFilter')?.addEventListener('change',(e)=>{PLAYER_FILTERS.sort=e.target.value;window.MCM_RENDER()});
  document.getElementById('manageActivitiesBtn')?.addEventListener('click',openActivityResetModal);
  document.querySelectorAll('[data-edit-player]').forEach(b=>b.addEventListener('click',()=>openPlayerModal(b.dataset.editPlayer)));
  document.querySelectorAll('[data-delete-player]').forEach(b=>b.addEventListener('click',()=>deletePlayer(b.dataset.deletePlayer)));

  document.getElementById('addFixedBtn')?.addEventListener('click',createFixedGroupInstant);
  document.querySelectorAll('[data-delete-fixed]').forEach(b=>b.addEventListener('click',()=>deleteFixedGroup(b.dataset.deleteFixed)));
  document.querySelectorAll('[data-join-fixed]').forEach(b=>b.addEventListener('click',()=>joinFixedSlot(b.dataset.joinFixed,b.dataset.slot)));
  document.querySelectorAll('[data-leave-fixed]').forEach(b=>b.addEventListener('click',()=>leaveFixedGroup(b.dataset.leaveFixed)));
  document.querySelectorAll('[data-admin-fixed-group]').forEach(b=>b.addEventListener('click',()=>openAdminFixedSlot(b.dataset.adminFixedGroup,b.dataset.adminFixedSlot)));
  document.querySelectorAll('[data-leader-fixed]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)claimOrChangeLeader(b.dataset.leaderFixed)}));
  document.querySelectorAll('[data-publish-fixed]').forEach(b=>b.addEventListener('click',()=>openGroupEventPlanner(b.dataset.publishFixed)));

  document.getElementById('createSearchBtn')?.addEventListener('click',openSearchGroupCreate);
  document.querySelectorAll('[data-search-filter]').forEach(b=>b.addEventListener('click',()=>{SEARCH_FILTER=b.dataset.searchFilter;window.MCM_RENDER()}));
  document.querySelectorAll('[data-join-search]').forEach(b=>b.addEventListener('click',()=>joinSearchSlot(b.dataset.joinSearch,b.dataset.searchSlot)));
  document.querySelectorAll('[data-leave-search]').forEach(b=>b.addEventListener('click',()=>leaveSearchGroup(b.dataset.leaveSearch)));
  document.querySelectorAll('[data-delete-search]').forEach(b=>b.addEventListener('click',()=>deleteSearchGroup(b.dataset.deleteSearch)));
  document.querySelectorAll('[data-publish-search]').forEach(b=>b.addEventListener('click',()=>openSearchEventPlanner(b.dataset.publishSearch)));

  document.querySelectorAll('[data-dashboard-class]').forEach(b=>b.addEventListener('click',()=>openDashboardClassMembers(b.dataset.dashboardClass)));
  document.querySelectorAll('[data-presence-list]').forEach(b=>b.addEventListener('click',()=>openPresenceList(b.dataset.presenceList)));
  document.querySelectorAll('[data-open-unregistered]').forEach(b=>b.addEventListener('click',openUnregisteredList));

  document.querySelectorAll('[data-dash-join-search]').forEach(b=>b.addEventListener('click',()=>joinSearchSlot(b.dataset.dashJoinSearch,b.dataset.dashSlot)));
  document.querySelectorAll('[data-dash-leave-search]').forEach(b=>b.addEventListener('click',()=>leaveSearchGroup(b.dataset.dashLeaveSearch)));
  document.querySelectorAll('[data-dash-join-fixed]').forEach(b=>b.addEventListener('click',()=>joinFixedSlot(b.dataset.dashJoinFixed,b.dataset.dashSlot)));
  document.querySelectorAll('[data-dash-leave-fixed]').forEach(b=>b.addEventListener('click',()=>leaveFixedGroup(b.dataset.dashLeaveFixed)));

}

renderLoading(0,'Initialisation…');
initAuth();
</script></body></html>

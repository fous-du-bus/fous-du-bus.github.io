<title>Compositions d'équipes - Fous du bus</title>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1a1530 0%, #0f0d1a 55%, #0a0812 100%);
    color: #e8e3f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1400px; margin: 0 auto; }
  .back-link { display: inline-block; color: #8b8299; text-decoration: none; font-size: 13px; margin-bottom: 16px; }
  .back-link:hover { color: #4fd1c5; }
  h1 { font-family: Georgia, serif; font-size: clamp(22px, 5vw, 30px); text-align: center; margin: 0 0 4px;
       background: linear-gradient(135deg, #4fd1c5, #7c9fd4 55%, #c47ed4); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: #8b8299; font-size: 13px; margin-bottom: 24px; }
  .mode-tabs { display: flex; gap: 8px; justify-content: center; margin: 0 0 20px; flex-wrap: wrap; }
  .mode-tab { border: 1px solid rgba(255,255,255,0.12); background: #1a1530; color: #8b8299; border-radius: 12px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .mode-select { border: 1px solid #4fd1c5; background: rgba(79,209,197,0.1); color: #4fd1c5; border-radius: 12px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .mode-select option { background: #1a1530; color: #e8e3f0; }
  .mode-tab.active { border-color: #4fd1c5; background: rgba(79,209,197,0.1); color: #4fd1c5; }
  .class-counter { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 4px 0 18px; }
  .class-count-item { display: flex; align-items: center; gap: 5px; background: #1a1530; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: #8b8299; }
  .class-count-item img { width: 18px; height: 18px; border-radius: 5px; }
  .class-count-item.has-players { color: #e8e3f0; border-color: rgba(79,209,197,0.25); }
  .add-team-btn { display: block; margin: 0 auto 24px; background: rgba(79,209,197,0.1); border: 1px solid #4fd1c5; color: #4fd1c5; border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .add-team-btn:hover { background: rgba(79,209,197,0.18); }
  .team-card { background: rgba(196,126,212,0.06); border: 1px solid rgba(196,126,212,0.25); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px; }
  .team-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
  .team-name-input { background: transparent; border: none; color: #f0eaf5; font-family: Georgia, serif; font-size: 18px; font-weight: 700; flex: 1; padding: 4px 0; }
  .team-name-input:focus { outline: none; border-bottom: 1px solid #4fd1c5; }
  .delete-team-btn { background: transparent; border: 1px solid rgba(212,120,90,.4); color: #e08a6a; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .delete-team-btn:hover { background: rgba(212,120,90,.1); }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .slot { background: #1a1530; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; min-height: 90px; display: flex; flex-direction: column; }
  .slot-role { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #7c9fd4; font-weight: 700; margin-bottom: 6px; }
  .slot-empty { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: #544b68; font-size: 12px; cursor: pointer; border-radius: 8px; padding: 6px; }
  .slot-empty:hover { background: rgba(79,209,197,0.08); color: #4fd1c5; }
  .slot-filled { flex: 1; display: flex; align-items: center; gap: 8px; }
  .slot-filled img.class-icon { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; }
  .slot-player-name { font-size: 13px; font-weight: 700; color: #e8e3f0; white-space: nowrap; flex: 1; min-width: 0; }
  .new-player-toggle { background: none; border: none; font-size: 13px; cursor: pointer; padding: 2px; flex-shrink: 0; opacity: 0; filter: grayscale(1); }
  .new-player-toggle.active { opacity: 1; filter: none; }
  .slot-filled:hover .new-player-toggle { opacity: 0.4; }
  .new-player-toggle:hover { opacity: 0.9 !important; }
  .new-player-toggle.active:hover { opacity: 1 !important; }
  .slot-leave-btn { background: none; border: none; color: #544b68; font-size: 14px; cursor: pointer; padding: 2px; flex-shrink: 0; }
  .slot-leave-btn:hover { color: #e08a6a; }
  .claim-form { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .claim-form input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 5px 7px; color: #e8e3f0; font-size: 12px; }
  .class-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .class-picker img { width: 24px; height: 24px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; opacity: 0.6; }
  .class-picker img.selected { border-color: #4fd1c5; opacity: 1; }
  .new-player-check { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #8b8299; cursor: pointer; }
  .claim-form-actions { display: flex; gap: 4px; }
  .claim-form-actions button { flex: 1; border-radius: 6px; border: none; padding: 5px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .claim-btn-ok { background: #4fd1c5; color: #0f0d1a; }
  .claim-btn-cancel { background: rgba(255,255,255,0.08); color: #8b8299; }
  .empty-state { text-align: center; color: #544b68; font-size: 13px; margin-top: 40px; }
  .status-line { text-align: center; font-size: 11px; color: #544b68; margin-top: 20px; }
  .roster-list { display: flex; flex-direction: column; gap: 8px; max-width: 640px; margin: 0 auto; }
  .roster-row { display: flex; align-items: center; gap: 10px; background: #1a1530; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 14px; }
  .roster-row img.class-icon { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; }
  .roster-name { font-size: 14px; font-weight: 700; color: #e8e3f0; display: flex; align-items: center; gap: 6px; }
  .roster-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-left: auto; }
  .roster-tag { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #8b8299; white-space: nowrap; }
  .roster-tag.pve { color: #4fd1c5; background: rgba(79,209,197,0.1); }
  .roster-tag.pvp { color: #e08a6a; background: rgba(212,120,90,0.1); }
  @media (max-width: 800px) {
    .slots { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  }
</style>

quZVdBi3Z/Mmd6IaFGF9WPY/z7YwTND3Y0Tqix4CHe0ztZK69CpvOTqA0It9adcvn4PyNYoK9tYmXCaLHtWuYQedmm7AKeklEA74mnldsyzZ/Kk8b2XGrkE9NdLpZY37XiQHLlRZrH76b3AfZInPHVx9awQcNRiIkl5E5LzggFoxIm/r1//1QZZED1IxcAZz87avFU5b/OAOmVAwvP1C7BsMKWaGhdouehvTEl8NWZTfdtDrB2V6VB7bDy4wvztTT7blgO1c5j/mFcAAAAA" alt="Nouveau joueur" style="width:20px;height:20px;vertical-align:-4px;" />';
const MODE_LABELS = { pve: 'PvE', pvp: 'PvP' };

let allTeams = { pve: [], pvp: [], roster: [] };
let activeTab = 'pve';
let openClaimSlot = null; // "mode:teamId:slotIndex"
let pendingClassId = null;

function makeId(){ return Math.random().toString(36).slice(2, 9); }

function switchTab(tab){
  activeTab = tab;
  openClaimSlot = null;
  pendingClassId = null;
  render();
}

function emptyTeam(mode){
  const list = allTeams[mode];
  return { id: makeId(), name: 'Groupe ' + (list.length + 1), slots: ROLES.map(r => ({ role: r, name: '', classId: '', isNewPlayer: false })) };
}

function addTeam(){
  if (activeTab !== 'pve' && activeTab !== 'pvp') return;
  allTeams[activeTab].push(emptyTeam(activeTab));
  saveTeams();
}

function deleteTeam(mode, teamId){
  if (!confirm('Supprimer ce groupe ?')) return;
  allTeams[mode] = allTeams[mode].filter(t => t.id !== teamId);
  saveTeams();
}

function renameTeam(mode, teamId, value){
  const t = allTeams[mode].find(t => t.id === teamId);
  if (t) t.name = value;
  saveTeams();
}

function openClaim(mode, teamId, slotIndex){
  openClaimSlot = mode + ':' + teamId + ':' + slotIndex;
  pendingClassId = null;
  render();
}

function cancelClaim(){
  openClaimSlot = null;
  render();
}

function pickClass(classId, imgEl){
  pendingClassId = classId;
  if (imgEl){
    imgEl.parentElement.querySelectorAll('img').forEach(img => img.classList.remove('selected'));
    imgEl.classList.add('selected');
  }
}

function confirmClaim(mode, teamId, slotIndex){
  const input = document.getElementById('claimNameInput');
  const name = input ? input.value.trim() : '';
  const newPlayerCheckbox = document.getElementById('claimNewPlayer');
  const isNewPlayer = newPlayerCheckbox ? newPlayerCheckbox.checked : false;
  if (!name){ alert('Entre un pseudo.'); return; }
  if (!pendingClassId){ alert('Choisis une classe.'); return; }
  const t = allTeams[mode].find(t => t.id === teamId);
  if (t) t.slots[slotIndex] = { role: t.slots[slotIndex].role, name, classId: pendingClassId, isNewPlayer };
  openClaimSlot = null;
  pendingClassId = null;
  saveTeams();
}

function leaveSlot(mode, teamId, slotIndex){
  const t = allTeams[mode].find(t => t.id === teamId);
  if (t) t.slots[slotIndex] = { role: t.slots[slotIndex].role, name: '', classId: '', isNewPlayer: false };
  saveTeams();
}

function toggleNewPlayer(mode, teamId, slotIndex){
  const t = allTeams[mode].find(t => t.id === teamId);
  if (t) t.slots[slotIndex].isNewPlayer = !t.slots[slotIndex].isNewPlayer;
  saveTeams();
}

let rosterFormOpen = false;

function openRosterForm(){
  rosterFormOpen = true;
  pendingClassId = null;
  render();
}

function cancelRosterForm(){
  rosterFormOpen = false;
  render();
}

function confirmRosterJoin(){
  const input = document.getElementById('rosterNameInput');
  const name = input ? input.value.trim() : '';
  const newPlayerCheckbox = document.getElementById('rosterNewPlayer');
  const isNewPlayer = newPlayerCheckbox ? newPlayerCheckbox.checked : false;
  if (!name){ alert('Entre un pseudo.'); return; }
  if (!pendingClassId){ alert('Choisis une classe.'); return; }
  allTeams.roster = allTeams.roster.filter(p => p.name.toLowerCase() !== name.toLowerCase());
  allTeams.roster.push({ name, classId: pendingClassId, isNewPlayer });
  rosterFormOpen = false;
  pendingClassId = null;
  saveTeams();
}

function leaveRoster(name){
  allTeams.roster = allTeams.roster.filter(p => p.name.toLowerCase() !== name.toLowerCase());
  saveTeams();
}

function saveTeams(){
  document.getElementById('statusLine').textContent = 'Enregistrement...';
  docRef.set({ pve: allTeams.pve, pvp: allTeams.pvp, roster: allTeams.roster }).then(() => {
    document.getElementById('statusLine').textContent = '';
  }).catch(err => {
    console.error(err);
    document.getElementById('statusLine').textContent = 'Erreur de synchronisation';
  });
}

function renderTeamCard(mode, team){
  const slotsHtml = team.slots.map((slot, i) => {
    const key = mode + ':' + team.id + ':' + i;
    if (openClaimSlot === key){
      const classPickerHtml = CLASS_OPTIONS.map(c =>
        `<img src="${c.icon}" title="${c.label}" class="${pendingClassId===c.id?'selected':''}" onclick="pickClass('${c.id}', this)" />`
      ).join('');
      return `<div class="slot">
        <div class="slot-role">${slot.role}</div>
        <div class="claim-form">
          <input id="claimNameInput" type="text" placeholder="Pseudo" maxlength="20" />
          <div class="class-picker">${classPickerHtml}</div>
          <label class="new-player-check">
            <input type="checkbox" id="claimNewPlayer" />
            ${LEAF_IMG} Nouveau joueur sur Aion 2
          </label>
          <div class="claim-form-actions">
            <button class="claim-btn-ok" onclick="confirmClaim('${mode}', '${team.id}', ${i})">OK</button>
            <button class="claim-btn-cancel" onclick="cancelClaim()">Annuler</button>
          </div>
        </div>
      </div>`;
    }
    if (slot.name){
      const cls = CLASS_OPTIONS.find(c => c.id === slot.classId);
      return `<div class="slot">
        <div class="slot-role">${slot.role}</div>
        <div class="slot-filled">
          ${cls ? `<img class="class-icon" src="${cls.icon}" alt="" title="${cls.label}" />` : ''}
          <span class="slot-player-name">${slot.name.replace(/</g,'&lt;')}</span>
          <button class="new-player-toggle ${slot.isNewPlayer ? 'active' : ''}" onclick="toggleNewPlayer('${mode}', '${team.id}', ${i})" title="Nouveau joueur sur Aion 2 — clique pour basculer">${LEAF_IMG}</button>
          <button class="slot-leave-btn" onclick="leaveSlot('${mode}', '${team.id}', ${i})" title="Se retirer">✕</button>
        </div>
      </div>`;
    }
    return `<div class="slot">
      <div class="slot-role">${slot.role}</div>
      <div class="slot-empty" onclick="openClaim('${mode}', '${team.id}', ${i})">Libre —<br>clique pour t'inscrire</div>
    </div>`;
  }).join('');
  return `<div class="team-card">
    <div class="team-head">
      <input class="team-name-input" value="${team.name.replace(/"/g,'&quot;')}" onchange="renameTeam('${mode}', '${team.id}', this.value)" />
      <button class="delete-team-btn" onclick="deleteTeam('${mode}', '${team.id}')">Supprimer</button>
    </div>
    <div class="slots">${slotsHtml}</div>
  </div>`;
}

function renderModeView(mode){
  const teams = allTeams[mode];
  const totalSlots = teams.reduce((sum, t) => sum + t.slots.length, 0);
  const filledSlots = teams.reduce((sum, t) => sum + t.slots.filter(s => s.name).length, 0);
  const countEl = document.getElementById('signupCount');
  if (countEl) countEl.textContent = totalSlots ? `${filledSlots}/${totalSlots} inscrits (${MODE_LABELS[mode]})` : '';

  const classCounterEl = document.getElementById('classCounter');
  if (classCounterEl){
    const counts = {};
    CLASS_OPTIONS.forEach(c => counts[c.id] = 0);
    teams.forEach(t => t.slots.forEach(s => { if (s.classId && counts[s.classId] !== undefined) counts[s.classId]++; }));
    classCounterEl.innerHTML = filledSlots ? `<div class="class-counter">${CLASS_OPTIONS.map(c =>
      `<div class="class-count-item ${counts[c.id] > 0 ? 'has-players' : ''}"><img src="${c.icon}" alt="" title="${c.label}" /> ${c.label} · ${counts[c.id]}</div>`
    ).join('')}</div>` : '';
  }

  const container = document.getElementById('teamsContainer');
  if (!teams.length){
    container.innerHTML = `<div class="empty-state">Aucune équipe ${MODE_LABELS[mode]} pour le moment — clique sur "+ Ajouter une équipe" pour commencer.</div>`;
    return;
  }
  container.innerHTML = teams.map(team => renderTeamCard(mode, team)).join('');
}

function renderRosterView(){
  const countEl = document.getElementById('signupCount');
  const classCounterEl = document.getElementById('classCounter');
  if (countEl) countEl.textContent = allTeams.roster.length ? `${allTeams.roster.length} inscrit(s) sur la liste` : '';
  if (classCounterEl) classCounterEl.innerHTML = '';

  const byName = {};
  allTeams.roster.forEach(p => {
    const key = p.name.toLowerCase();
    byName[key] = { name: p.name, classId: p.classId, isNewPlayer: p.isNewPlayer, tags: [], fromRoster: true };
  });
  ['pve', 'pvp'].forEach(mode => {
    allTeams[mode].forEach(team => {
      team.slots.forEach(slot => {
        if (!slot.name) return;
        const key = slot.name.toLowerCase();
        if (!byName[key]){
          byName[key] = { name: slot.name, classId: slot.classId, isNewPlayer: false, tags: [], fromRoster: false };
        }
        if (slot.isNewPlayer) byName[key].isNewPlayer = true;
        byName[key].tags.push({ mode, team: team.name, role: slot.role });
      });
    });
  });

  const players = Object.values(byName).sort((a,b) => a.name.localeCompare(b.name));
  const container = document.getElementById('teamsContainer');

  const joinFormHtml = rosterFormOpen ? `<div class="roster-row" style="flex-direction:column;align-items:stretch;gap:8px;">
    <input id="rosterNameInput" type="text" placeholder="Pseudo" maxlength="20" style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:7px;color:#e8e3f0;font-size:13px;" />
    <div class="class-picker">${CLASS_OPTIONS.map(c =>
      `<img src="${c.icon}" title="${c.label}" class="${pendingClassId===c.id?'selected':''}" onclick="pickClass('${c.id}', this)" />`
    ).join('')}</div>
    <label class="new-player-check">
      <input type="checkbox" id="rosterNewPlayer" />
      ${LEAF_IMG} Nouveau joueur sur Aion 2
    </label>
    <div class="claim-form-actions">
      <button class="claim-btn-ok" onclick="confirmRosterJoin()">S'inscrire</button>
      <button class="claim-btn-cancel" onclick="cancelRosterForm()">Annuler</button>
    </div>
  </div>` : `<button class="add-team-btn" style="margin:0 0 16px;" onclick="openRosterForm()">+ M'inscrire sur la liste</button>`;

  if (!players.length){
    container.innerHTML = joinFormHtml + '<div class="empty-state">Personne n\'est encore inscrit.</div>';
    return;
  }
  container.innerHTML = joinFormHtml + `<div class="roster-list">${players.map(p => {
    const cls = CLASS_OPTIONS.find(c => c.id === p.classId);
    const tagsHtml = p.tags.map(t => `<span class="roster-tag ${t.mode}">${MODE_LABELS[t.mode]} · ${t.team} · ${t.role}</span>`).join('');
    const leaveBtn = p.fromRoster ? `<button class="slot-leave-btn" onclick="leaveRoster('${p.name.replace(/'/g,"\\'")}')" title="Se retirer de la liste">✕</button>` : '';
    return `<div class="roster-row">
      ${cls ? `<img class="class-icon" src="${cls.icon}" alt="" title="${cls.label}" />` : ''}
      <span class="roster-name">${p.name.replace(/</g,'&lt;')} ${p.isNewPlayer ? LEAF_IMG : ''}</span>
      <div class="roster-tags">${tagsHtml}</div>
      ${leaveBtn}
    </div>`;
  }).join('')}</div>`;
}

function render(){
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  const rosterBtn = document.getElementById('tabBtn-roster');
  if (rosterBtn) rosterBtn.classList.toggle('active', activeTab === 'roster');
  const modeSelect = document.getElementById('modeSelect');
  if (modeSelect && activeTab !== 'roster') modeSelect.value = activeTab;

  const addBtn = document.getElementById('addTeamBtn');
  if (addBtn) addBtn.style.display = (activeTab === 'roster') ? 'none' : 'block';

  if (activeTab === 'roster'){
    renderRosterView();
  } else {
    renderModeView(activeTab);
  }
}

let firstLoad = true;
docRef.onSnapshot(snap => {
  if (snap.exists){
    const d = snap.data();
    allTeams.pve = d.pve || (Array.isArray(d.teams) ? d.teams : []);
    allTeams.pvp = d.pvp || [];
    allTeams.roster = d.roster || [];
  } else if (firstLoad){
    allTeams = { pve: [], pvp: [], roster: [] };
  }
  firstLoad = false;
  render();
}, err => {
  console.error('Firestore error', err);
  document.getElementById('statusLine').textContent = 'Erreur de connexion';
});
</script>
</body>
</html>

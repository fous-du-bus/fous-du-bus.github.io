<style>

.gm-root {
  --bg: #090c16; --bg-2: #0d1220; --panel: rgba(24, 30, 51, 0.62); --panel-solid: #141a2e;
  --border: rgba(139, 130, 255, 0.16); --border-strong: rgba(139, 130, 255, 0.32);
  --violet: #8b6bff; --blue: #45c1ff; --text: #e7e9f7; --muted: #8790ac; --muted-2: #5c6482;
  --tank: #4f9dff; --healer: #35d29a; --dps: #ff6b7a; --support: #f6c552;
  --danger: #ef4d5f; --success: #35d29a; --new: #ffb84f;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(1200px 800px at 15% -10%, rgba(139,107,255,0.14), transparent 60%),
              radial-gradient(1000px 700px at 100% 10%, rgba(69,193,255,0.08), transparent 55%), var(--bg);
  color: var(--text); min-height: 100vh; width: 100%; position: relative;
}

.gm-bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.gm-bg-nebula {
  position: absolute; inset: -10%; opacity: 0.5;
  background:
    radial-gradient(700px 500px at 20% 20%, rgba(139,107,255,0.16), transparent 60%),
    radial-gradient(600px 450px at 80% 70%, rgba(69,193,255,0.13), transparent 60%),
    radial-gradient(500px 400px at 50% 100%, rgba(139,107,255,0.10), transparent 60%);
  animation: gm-nebula-drift 40s ease-in-out infinite alternate;
}
@keyframes gm-nebula-drift {
  0% { transform: translate(-2%, -1%) scale(1); }
  50% { transform: translate(2%, 2%) scale(1.06); }
  100% { transform: translate(-1%, 3%) scale(1); }
}

  box-shadow: 1309px 228px #fff, 51px 563px #fff, 501px 457px #fff, 285px 209px #fff, 1385px 178px #fff, 1209px 864px #fff, 65px 61px #fff, 191px 447px #fff, 476px 1034px #fff, 1232px 54px #fff, 1149px 407px #fff, 1466px 859px #fff, 451px 919px #fff, 1206px 569px #fff, 1657px 13px #fff, 1554px 326px #fff, 1429px 865px #fff, 696px 569px #fff, 318px 440px #fff, 1563px 689px #fff, 209px 189px #fff, 778px 198px #fff, 735px 704px #fff, 1236px 541px #fff, 1652px 88px #fff, 1494px 940px #fff, 1098px 255px #fff, 1888px 775px #fff, 161px 600px #fff, 1698px 740px #fff, 1182px 393px #fff, 1442px 142px #fff, 93px 466px #fff, 1583px 592px #fff, 163px 476px #fff, 1774px 206px #fff, 778px 569px #fff, 928px 747px #fff, 333px 758px #fff, 727px 429px #fff, 1372px 546px #fff, 1437px 146px #fff, 1247px 350px #fff, 1093px 501px #fff, 334px 946px #fff, 777px 552px #fff, 1895px 449px #fff, 1402px 664px #fff, 1726px 114px #fff, 469px 65px #fff, 1648px 646px #fff, 821px 548px #fff, 135px 432px #fff, 1870px 644px #fff, 435px 1022px #fff, 810px 939px #fff, 292px 542px #fff, 285px 505px #fff, 1525px 538px #fff, 1529px 877px #fff, 1838px 817px #fff, 741px 449px #fff, 283px 1043px #fff, 1010px 186px #fff, 1547px 96px #fff, 1763px 224px #fff, 313px 327px #fff, 1622px 864px #fff, 1221px 130px #fff, 788px 781px #fff;
  opacity: 0.35; animation: gm-twinkle-a 6s ease-in-out infinite;
}
.gm-bg-stars-big {
  position: absolute; inset: 0; width: 2.5px; height: 2.5px; border-radius: 50%;
  box-shadow: 1220px 958px #a8c8ff, 1083px 514px #a8c8ff, 1133px 23px #a8c8ff, 1393px 234px #a8c8ff, 1396px 546px #a8c8ff, 1574px 696px #a8c8ff, 228px 601px #a8c8ff, 890px 323px #a8c8ff, 929px 6px #a8c8ff, 1478px 539px #a8c8ff, 1025px 365px #a8c8ff, 1039px 217px #a8c8ff, 1782px 611px #a8c8ff, 1723px 1039px #a8c8ff, 1247px 407px #a8c8ff, 313px 765px #a8c8ff, 1561px 330px #a8c8ff, 1104px 1px #a8c8ff, 1226px 663px #a8c8ff, 1000px 39px #a8c8ff, 229px 743px #a8c8ff, 1799px 629px #a8c8ff, 490px 118px #a8c8ff, 493px 161px #a8c8ff, 175px 995px #a8c8ff, 1671px 141px #a8c8ff, 1557px 257px #a8c8ff, 262px 973px #a8c8ff, 1125px 338px #a8c8ff, 542px 1080px #a8c8ff, 1786px 866px #a8c8ff, 433px 411px #a8c8ff, 1460px 638px #a8c8ff, 817px 764px #a8c8ff, 897px 1059px #a8c8ff;
  opacity: 0.25; animation: gm-twinkle-b 8s ease-in-out infinite;
}
@keyframes gm-twinkle-a { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.55; } }
@keyframes gm-twinkle-b { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.15; } }
.gm-root > *:not(.gm-bg-layer):not(.gm-modal-overlay):not(.gm-toast-container) { position: relative; z-index: 1; }

.gm-root *, .gm-root *:before, .gm-root *:after { box-sizing: border-box; }
.gm-root h1, .gm-root h2, .gm-root h3, .gm-root .gm-font-display { font-family: 'Cinzel', serif; letter-spacing: 0.02em; }
.gm-mono { font-family: 'JetBrains Mono', monospace; }
.gm-shell { display: flex; min-height: 100vh; }
.gm-sidebar { width: 350px; flex-shrink: 0; background: linear-gradient(180deg, rgba(20,26,46,0.9), rgba(13,18,32,0.9)); border-right: 1px solid var(--border); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; }
.gm-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.gm-brand-crest { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.gm-brand-text { font-size: 15px; font-weight: 600; line-height: 1.15; }
.gm-brand-text span { display:block; font-size: 10px; color: var(--muted); font-family:'Inter'; font-weight:500; letter-spacing:0.08em; text-transform: uppercase; }
.gm-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.gm-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; user-select: none; text-decoration: none; }
.gm-nav-item:hover { background: rgba(139,107,255,0.08); color: var(--text); }
.gm-nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.gm-nav-item.active { background: rgba(139,107,255,0.14); border-color: var(--border-strong); color: var(--text); box-shadow: inset 2px 0 0 var(--violet); }
.gm-nav-icon { width: 16px; text-align:center; opacity: 0.9; }
.gm-nav-chevron { margin-left: auto; font-size: 11px; opacity: 0.6; }
.gm-nav-item.expanded { color: var(--text); }
.gm-nav-subitem { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 30px; border-radius: 10px; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .15s ease; user-select: none; }
.gm-nav-subitem:hover { background: rgba(139,107,255,0.08); color: var(--text); }
.gm-nav-subitem.active { background: rgba(139,107,255,0.14); border-color: var(--border-strong); color: var(--text); box-shadow: inset 2px 0 0 var(--violet); }
.gm-role-box { margin-top: auto; background: var(--panel-solid); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.gm-role-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.gm-discord-account { display: flex; align-items: center; gap: 8px; }
.gm-discord-account img { width: 28px; height: 28px; border-radius: 50%; }
.gm-lang-switch { display: flex; gap: 6px; }
.gm-lang-switch .gm-btn { flex: 1; padding: 6px 8px; font-size: 12px; justify-content: center; }
.gm-main { flex: 1; min-width: 0; padding: 26px 30px 60px; }
.gm-main-inner { width: 82%; margin: 0 auto; }
.gm-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px;}
.gm-page-title { font-size: 22px; font-weight: 600; }
.gm-page-sub { color: var(--muted); font-size: 13px; margin-top: 3px; font-family:'Inter'; }
.gm-search { position: relative; }
.gm-search input { background: var(--panel-solid); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px 9px 32px; color: var(--text); font-size: 13px; width: 230px; outline: none; font-family: 'Inter'; }
.gm-search input:focus { border-color: var(--border-strong); }
.gm-search:before { content: '⚲'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%) rotate(90deg); color: var(--muted); font-size: 12px; }
.gm-btn { border: 1px solid var(--border-strong); background: rgba(139,107,255,0.1); color: var(--text); padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter'; display: inline-flex; align-items: center; gap: 6px; transition: all .15s ease; white-space: nowrap; }
.gm-btn:hover { background: rgba(139,107,255,0.2); }
.gm-btn-primary { background: linear-gradient(135deg, var(--violet), var(--blue)); border: none; color: #060810; }
.gm-btn-primary:hover { filter: brightness(1.08); }
.gm-btn-danger { background: rgba(239,77,95,0.12); border-color: rgba(239,77,95,0.4); color: #ff8b96; }
.gm-btn-danger:hover { background: rgba(239,77,95,0.22); }
.gm-btn-ghost { background: transparent; border-color: var(--border); }
.gm-btn-sm { padding: 6px 11px; font-size: 12px; border-radius: 8px; }
.gm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.gm-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; backdrop-filter: blur(6px); }
.gm-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin-bottom: 20px; }
.gm-dash-columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: start; }
.gm-dash-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 1100px) { .gm-dash-columns { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .gm-dash-columns { grid-template-columns: 1fr; } }
.gm-stat-card { padding: 16px; }
.gm-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600; background: linear-gradient(135deg, #fff, var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gm-stat-label { color: var(--muted); font-size: 12px; margin-top: 4px; }
.gm-dash-row { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .gm-dash-row { grid-template-columns: 1fr; } }
.gm-bar-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 12.5px; }
.gm-bar-label { width: 110px; flex-shrink: 0; color: var(--muted); }
.gm-bar-track { flex: 1; height: 8px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; }
.gm-bar-fill { height: 100%; border-radius: 6px; }
.gm-bar-value { width: 26px; text-align: right; font-family: 'JetBrains Mono'; color: var(--text); }
.gm-class-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border-radius: 20px; font-size: 11.5px; font-weight: 600; border: 1px solid; white-space: nowrap; }
.gm-class-pill img { width: 15px; height: 15px; object-fit: contain; vertical-align: -3px; }
.gm-badge-new { background: rgba(255,184,79,0.14); color: var(--new); border: 1px solid rgba(255,184,79,0.4); font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.03em; display: inline-flex; align-items: center; gap: 3px; backdrop-filter: blur(2px); }
.gm-badge-new img { width: 10px; height: 10px; }
.gm-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.gm-select { background: var(--panel-solid); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 9px; font-size: 12.5px; font-family: 'Inter'; outline: none; }
.gm-players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 350px)); gap: 14px; }
.gm-players-layout { display: flex; gap: 20px; align-items: flex-start; }
.gm-players-main { flex: 1; min-width: 0; }
.gm-not-registered { flex: 0 0 260px; position: sticky; top: 20px; }
.gm-not-registered-list { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
.gm-not-registered-item { font-size: 12.5px; color: var(--text); background: var(--panel-solid); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
@media (max-width: 900px) { .gm-players-layout { flex-direction: column; } .gm-not-registered { flex: none; width: 100%; position: static; } }
.gm-player-card { padding: 18px; position: relative; transition: transform .15s ease, border-color .15s ease; overflow: hidden; display: flex; align-items: center; gap: 12px; }
.gm-player-info { flex: 1; min-width: 0; }
.gm-player-emblem { width: 108px; height: 108px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)); align-self: center; margin-top: 14px; position: relative; z-index: 1; }
.gm-emblem-glow-wrap { position: relative; flex-shrink: 0; align-self: center; margin-top: 14px; width: 108px; height: 108px; }
.gm-emblem-glow-wrap .gm-player-emblem { margin-top: 0; position: absolute; inset: 0; }
.gm-emblem-glow { position: absolute; inset: 8px; border-radius: 50%; filter: blur(22px); opacity: 0.5; z-index: 0; }
.gm-player-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.gm-player-top { display: flex; gap: 10px; align-items: flex-start; }
.gm-badge-new-ribbon { position: absolute; top: 10px; right: calc(18px + 108px/2); transform: translateX(50%); z-index: 2; }
.gm-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; object-fit: cover; border: 2px solid var(--border-strong); background: #222840; }
.gm-avatar-fallback { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, var(--violet), var(--blue)); font-weight: 700; color: #0a0e1a; font-family:'Cinzel'; border: 2px solid var(--border-strong); }
.gm-player-names { flex: 1; min-width: 0; }
.gm-player-pseudo { font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-player-discord { color: var(--muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-player-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.gm-player-avail { display: flex; gap: 12px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.gm-player-actions { display: flex; gap: 6px; margin-top: 10px; }
.gm-group-card { padding: 16px; margin-bottom: 18px; }
.gm-mygroup-section-title { font-family: 'Cinzel'; font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.gm-open-create-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.gm-event-request-banner { background: rgba(255,184,79,0.14); border: 1px solid rgba(255,184,79,0.4); color: var(--new); font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; }
.gm-events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.gm-view-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
.gm-cal-header { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
.gm-cal-month-label { font-size: 15px; text-transform: capitalize; min-width: 160px; text-align: center; }
.gm-cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; max-width: 480px; margin-left: auto; margin-right: auto; }
.gm-cal-weekdays div { text-align: center; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.gm-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 480px; margin: 0 auto; }
.gm-cal-cell { aspect-ratio: 1 / 1; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); padding: 4px; cursor: pointer; transition: all .15s ease; display: flex; flex-direction: column; }
.gm-cal-cell:hover { border-color: var(--border-strong); background: rgba(139,107,255,0.08); }
.gm-cal-cell.gm-cal-empty { background: transparent; border: none; cursor: default; }
.gm-cal-cell.gm-cal-today { border-color: var(--violet); box-shadow: inset 0 0 0 1px var(--violet); }
.gm-cal-cell.gm-cal-selected { background: rgba(139,107,255,0.16); border-color: var(--violet); }
.gm-cal-daynum { font-size: 11px; font-weight: 600; color: var(--text); }
.gm-cal-dots { display: flex; gap: 2px; align-items: center; margin-top: auto; flex-wrap: wrap; }
.gm-cal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.gm-cal-more { font-size: 8px; color: var(--muted); }
.gm-cal-day-detail { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
@media (max-width: 700px) { .gm-cal-daynum { font-size: 10px; } .gm-cal-cell { padding: 3px; } .gm-cal-grid, .gm-cal-weekdays { max-width: 100%; } }
.gm-event-card { padding: 16px; }
.gm-event-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.gm-event-actions { display: flex; gap: 6px; }
.gm-event-title { font-family: 'Cinzel'; font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.gm-event-datetime { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.gm-event-desc { font-size: 12.5px; color: var(--text); line-height: 1.5; margin-bottom: 8px; white-space: pre-wrap; }
.gm-event-creator { font-size: 11px; color: var(--muted-2); }
.gm-rsvp-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.gm-rsvp-buttons { display: flex; gap: 6px; }
.gm-rsvp-btn { background: var(--panel); border: 1px solid var(--border); color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer; transition: all .15s ease; }
.gm-rsvp-btn:hover { border-color: var(--border-strong); color: var(--text); }
.gm-rsvp-btn.gm-rsvp-active-yes { background: rgba(53,210,154,0.16); border-color: var(--success); color: var(--success); }
.gm-rsvp-btn.gm-rsvp-active-no { background: rgba(239,77,95,0.16); border-color: var(--danger); color: var(--danger); }
.gm-rsvp-lists { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
.gm-rsvp-list-col { flex: 1; min-width: 120px; }
.gm-rsvp-list-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.gm-rsvp-chips { display: flex; flex-direction: column; gap: 4px; }
.gm-rsvp-chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); }
.gm-rsvp-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gm-rsvp-empty-note { font-size: 11px; color: var(--muted-2); font-style: italic; }
.gm-dashboard-event-card { padding: 14px; border-left: 3px solid var(--violet); }
.gm-open-group-mini { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--text); padding: 8px 10px; background: var(--bg-2); border-radius: 8px; }
.gm-group-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.gm-group-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gm-open-badge { background: rgba(53,210,154,0.14); border: 1px solid rgba(53,210,154,0.4); color: var(--success); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 20px; }
.gm-needed-roles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.gm-needed-roles-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.gm-role-pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid; text-transform: uppercase; letter-spacing: 0.03em; }
.gm-role-pill-clickable { cursor: pointer; transition: all .15s ease; }
.gm-role-pill-clickable:hover { filter: brightness(1.3); transform: translateY(-1px); }
.gm-group-creator { font-size: 11px; color: var(--muted-2); margin: -4px 0 10px; }
.gm-group-name { font-family: 'Cinzel'; font-size: 16px; font-weight: 600; background: transparent; border: none; color: var(--text); outline: none; border-bottom: 1px dashed transparent; }
.gm-group-name:focus { border-bottom: 1px dashed var(--border-strong); }
.gm-group-meta-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
.gm-group-meta-inputs input { background: var(--panel-solid); border: 1px solid var(--border); color: var(--text); padding: 6px 9px; border-radius: 8px; font-size: 12px; outline: none; font-family:'Inter'; }
.gm-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.gm-slot-wrapper { position: relative; }
.gm-slot-wrapper .gm-slot-num { position: absolute; top: 14px; left: 18px; z-index: 2; background: var(--panel-solid); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; }
.gm-slot { border: 1.5px dashed var(--border); border-radius: 12px; padding: 10px; min-height: auto; display: flex; flex-direction: column; gap: 6px; position: relative; background: rgba(255,255,255,0.015); }
.gm-slot.filled { border-style: solid; border-color: var(--border-strong); background: rgba(139,107,255,0.05); }
.gm-slot-num { font-size: 10px; color: var(--muted-2); font-family:'JetBrains Mono'; margin-bottom: 0; }
.gm-slot-empty { flex: 1; display: flex; align-items: center; justify-content: center; }
.gm-slot select { width: 100%; background: var(--panel-solid); border: 1px solid var(--border); color: var(--text); padding: 7px 8px; border-radius: 8px; font-size: 12px; outline: none; font-family:'Inter'; cursor:pointer; }
.gm-slot select:hover, .gm-slot select:focus { border-color: #4fd1c5; color: #4fd1c5; }
.gm-slot-filled-body { display: flex; align-items: center; gap: 8px; }
.gm-slot-filled-body img.gm-avatar, .gm-slot-filled-body .gm-avatar-fallback { width: 34px; height: 34px; font-size: 12px; }
.gm-slot-remove { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; line-height:1; padding: 2px;}
.gm-slot-remove:hover { color: var(--danger); }
.gm-subs-title { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
.gm-subs-list { display: flex; flex-wrap: wrap; gap: 8px; }
.gm-sub-chip { display: flex; align-items: center; gap: 6px; background: var(--panel-solid); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px 4px 4px; font-size: 12px; }
.gm-sub-chip img.gm-avatar, .gm-sub-chip .gm-avatar-fallback { width: 22px; height: 22px; font-size: 9px; }
.gm-sub-chip button { background: none; border: none; color: var(--muted); cursor: pointer; margin-left: 2px; }
.gm-add-sub select { background: var(--panel-solid); border: 1px dashed var(--border-strong); color: var(--muted); padding: 6px 10px; border-radius: 20px; font-size: 12px; cursor:pointer; }
.gm-group-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.gm-modal-overlay { position: fixed; inset: 0; background: rgba(4,6,12,0.72); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.gm-modal { background: var(--panel-solid); border: 1px solid var(--border-strong); border-radius: 16px; padding: 24px; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; }
.gm-modal h3 { margin: 0 0 16px; font-size: 17px; }
.gm-form-row { margin-bottom: 13px; }
.gm-form-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
.gm-form-row input, .gm-form-row select { width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 9px; font-size: 13px; outline: none; font-family:'Inter'; }
.gm-form-row input:focus, .gm-form-row select:focus { border-color: var(--border-strong); }
.gm-form-error { color: var(--danger); font-size: 11.5px; margin-top: 4px; }
.gm-toggle-card { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
.gm-toggle-card:hover { border-color: var(--border-strong); }
.gm-toggle-card-icon { font-size: 18px; flex-shrink: 0; }
.gm-toggle-card-text { flex: 1; min-width: 0; }
.gm-toggle-card-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.35; }
.gm-toggle-card-hint { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.gm-toggle-input { position: absolute; opacity: 0; width: 0; height: 0; }
.gm-toggle-switch { position: relative; flex-shrink: 0; width: 40px; height: 22px; border-radius: 20px; background: var(--bg-2); border: 1px solid var(--border); transition: background .2s ease, border-color .2s ease; }
.gm-toggle-switch::before { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s ease, background .2s ease; }
.gm-toggle-input:checked + .gm-toggle-switch { background: linear-gradient(135deg, #8b6bff, #45c1ff); border-color: transparent; }
.gm-toggle-input:checked + .gm-toggle-switch::before { transform: translateX(18px); background: #fff; }
.gm-toggle-card:has(.gm-toggle-input:checked) { border-color: var(--violet); background: rgba(139,107,255,0.08); }
.gm-form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gm-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.gm-toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }
.gm-toast { background: var(--panel-solid); border: 1px solid var(--border-strong); border-left: 3px solid var(--success); border-radius: 10px; padding: 11px 16px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: gm-toast-in .2s ease; }
@keyframes gm-toast-in { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }
.gm-empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.gm-empty-crest { width: 50px; height: 50px; margin: 0 auto 14px; border-radius: 50%; background: rgba(139,107,255,0.15); border: 1px dashed var(--border-strong); }
.gm-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.gm-table th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.gm-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
.gm-table tr:hover td { background: rgba(255,255,255,0.02); }
.gm-color-swatch { width: 16px; height: 16px; border-radius: 5px; display: inline-block; vertical-align: middle; }
.gm-note { font-size: 11.5px; color: var(--muted-2); margin-top: 4px; line-height: 1.5; }
.gm-scrollx { overflow-x: auto; }
.gm-mobile-topbar { display: none; }
@media (max-width: 780px) {

  .gm-sidebar { display: none; }
  .gm-sidebar.open { display: flex; position: fixed; z-index: 500; top:0; left:0; bottom:0; }
  .gm-mobile-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .gm-main { padding: 16px; }
  .gm-main-inner { width: 100%; }
}

  LANG = lang; localStorage.setItem('equipes-lang', lang);
  document.documentElement.lang = lang;
  document.title = t('page.title');

}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cls(id){ return CLASSES.find(c => c.id === id); }
function player(id){ return PLAYERS.find(p => p.id === id); }

function toast(msg, tone){
  const id = uid('t');
  TOASTS.push({ id, msg, tone: tone || 'success' });
  render();
  setTimeout(() => { TOASTS = TOASTS.filter(t => t.id !== id); render(); }, 3000);
}

let SAVE_TIMER = null;
function scheduleSave(){
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(() => {
    docRef.set({ players: PLAYERS, classes: CLASSES, groups: GROUPS, events: EVENTS, auditLog: AUDIT_LOG }).catch(err => console.error('save error', err));
  }, 500);
}

  size = size || 34;
  if (p && p.discordAvatar) {
    return `<img class="gm-avatar" style="width:${size}px;height:${size}px" src="${esc(p.discordAvatar)}" alt="${esc(p.pseudo)}">`;
  }
  const initials = p ? p.pseudo.slice(0,2).toUpperCase() : '?';
  return `<div class="gm-avatar-fallback" style="width:${size}px;height:${size}px">${esc(initials)}</div>`;
}

function classPill(classId, overrideName){
  const c = cls(classId);
  if (!c && !overrideName) return `<span class="gm-class-pill" style="border-color:var(--border);color:var(--muted)">—</span>`;
  const name = overrideName || (c ? c.name : '?');
  const color = c ? c.color : '#888';
  return `<span class="gm-class-pill" style="border-color:${color}66;background:${color}1c;color:${color}">
    ${c ? `<img src="${c.icon}" alt="" />` : ''}${esc(name)}
  </span>`;
}

function roleColor(role){
  return { Tank: 'var(--tank)', Heal: 'var(--healer)', DPS: 'var(--dps)', Flex: 'var(--support)' }[role] || '#888';
}
function computeNeededRoles(g){
  const template = { Tank: 1, Heal: 1, DPS: 3 };
  const counts = { Tank: 0, Heal: 0, DPS: 0, Flex: 0 };
  g.slots.forEach(s => {
    if (!s.playerId) return;
    const p = player(s.playerId);
    const c = p ? cls(p.classId) : null;
    if (c && counts[c.role] !== undefined) counts[c.role]++;
  });
  const needed = [];
  Object.keys(template).forEach(role => {
    let missing = template[role] - counts[role];
    while (missing > 0) { needed.push(role); missing--; }
  });
  return needed;
}
function toggleGroupOpen(groupId){
  const g = GROUPS.find(x => x.id === groupId);
  if (!g) return;
  g.open = !g.open;
  saveTeams(); render();
}
function quickJoinGroupRole(groupId, role){
  const g = GROUPS.find(x => x.id === groupId);
  if (!g) return;
  const me = myPlayerRecord();
  if (!me) { toast(t('rsvp.no_profile'), 'danger'); return; }
  const myClass = cls(me.classId);
  if (!myClass || myClass.role !== role) { toast(t('groups.role_mismatch'), 'danger'); return; }
  if (playerLimitReached(me.id, g)) { toast(t('groups.limit_reached'), 'danger'); return; }
  const emptyIdx = g.slots.findIndex(s => !s.playerId);
  if (emptyIdx === -1) { toast(t('groups.group_full'), 'danger'); return; }
  g.slots[emptyIdx].playerId = me.id;
  toast(t('toast.player_added'));
  saveTeams(); render();
}

function groupsContainingPlayer(playerId, type, excludeGroupId){
  return GROUPS.filter(g => g.type === type && g.id !== excludeGroupId &&
    (g.slots.some(s => s.playerId === playerId) || g.substitutes.includes(playerId)));
}
function playerLimitReached(playerId, targetGroup){
  const isMember = g => g.slots.some(s => s.playerId === playerId) || g.substitutes.includes(playerId);
  if (targetGroup.open){
    return GROUPS.some(g => g.id !== targetGroup.id && g.open && isMember(g));
  }
  return GROUPS.some(g => g.id !== targetGroup.id && !g.open && g.type === targetGroup.type && isMember(g));
}

/* ---------- Discord OAuth (individual auto-sync) ---------- */
function getRedirectUri(){ return location.origin + location.pathname; }

function loginWithDiscord(){
  const redirect = encodeURIComponent(getRedirectUri());
  location.href = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=identify%20guilds.members.read`;
}

function logoutDiscord(){
  discordUser = null;
  discordSession = null;
  localStorage.removeItem('equipes-discord-session');
  ACCESS_STATE = 'gate';
  renderGate();
}

function bootstrapAccess(){
  const hash = location.hash;
  if (hash && hash.includes('access_token')){
    const params = new URLSearchParams(hash.slice(1));
    const token = params.get('access_token');
    const expiresIn = parseInt(params.get('expires_in') || '0', 10);
    history.replaceState(null, '', getRedirectUri());
    if (!token) { ACCESS_STATE = 'gate'; renderGate(); return; }
    fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json())
      .then(user => {
        const avatarUrl = user.avatar
          ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=64`
          : `https://cdn.discordapp.com/embed/avatars/0.png`;
        const displayName = user.global_name || user.username;
        discordSession = { id: user.id, username: displayName, avatar: avatarUrl, accessToken: token, expiresAt: Date.now() + expiresIn * 1000 };
        discordUser = { id: user.id, username: displayName, avatar: avatarUrl };
        localStorage.setItem('equipes-discord-session', JSON.stringify(discordSession));
        verifyRoleAndProceed(true);
      })
      .catch(() => { ACCESS_STATE = 'gate'; renderGate(); });
    return;
  }
  if (discordSession && discordSession.accessToken && discordSession.expiresAt > Date.now()){
    const ROLE_CACHE_MS = 20 * 60 * 1000;
    if (discordSession.roleVerifiedAt && (Date.now() - discordSession.roleVerifiedAt) < ROLE_CACHE_MS){
      ACCESS_STATE = 'granted';
      startApp();
      return;
    }
    verifyRoleAndProceed(false);
    return;
  }
  ACCESS_STATE = 'gate';
  renderGate();
}

function verifyRoleAndProceed(isNewLogin){
  ACCESS_STATE = 'checking';
  renderGate();
  fetch(`https://discord.com/api/users/@me/guilds/${GUILD_ID}/member`, { headers: { Authorization: `Bearer ${discordSession.accessToken}` } })
    .then(r => {
      if (r.status === 404){ ACCESS_STATE = 'denied'; renderGate(); return null; }
      if (r.status === 401){ discordSession = null; discordUser = null; localStorage.removeItem('equipes-discord-session'); ACCESS_STATE = 'gate'; renderGate(); return null; }
      if (!r.ok){ ACCESS_STATE = 'error'; renderGate(); return null; }
      return r.json();
    })
    .then(member => {
      if (!member) return;
      const roles = member.roles || [];
      if (roles.includes(REQUIRED_ROLE_ID)){
        ACCESS_STATE = 'granted';
        IS_ADMIN = roles.includes(ADMIN_ROLE_ID);
        discordSession.roleVerifiedAt = Date.now();
        discordSession.isAdmin = IS_ADMIN;
        localStorage.setItem('equipes-discord-session', JSON.stringify(discordSession));
        if (isNewLogin){
          docRef.get().then(snap => {
            if (snap.exists){
              const d = snap.data();
              if (d.players) PLAYERS = d.players;
              if (d.classes && d.classes.length) CLASSES = d.classes;
              if (d.groups) GROUPS = d.groups;
              if (d.events) EVENTS = d.events;
              if (d.auditLog) AUDIT_LOG = d.auditLog;
            }
            syncOwnPlayerFromDiscord();
            docRef.set({ players: PLAYERS, classes: CLASSES, groups: GROUPS, events: EVENTS, auditLog: AUDIT_LOG }).catch(err => console.error('save error', err))
              .then(() => startApp());
          }).catch(() => startApp());
        } else {
          startApp();
        }
      } else {
        ACCESS_STATE = 'denied';
        renderGate();
      }
    })
    .catch(() => {
      ACCESS_STATE = 'error';
      renderGate();
    });
}

function syncOwnPlayerFromDiscord(){
  if (!discordUser) return;
  let p = PLAYERS.find(pl => pl.discordId === discordUser.id);
  if (p) {
    p.discordUsername = discordUser.username;
    p.discordAvatar = discordUser.avatar;
    toast(t('toast.discord_synced'));

    render();

    p = {
      id: uid('p'), pseudo: uniquePseudo(discordUser.username), classId: '',
      isNewPlayer: false, pve: true, pvp: true,
      discordId: discordUser.id, discordUsername: discordUser.username, discordAvatar: discordUser.avatar,
    };

}

function uniquePseudo(base){
  let candidate = base;
  let i = 2;
  while (PLAYERS.find(p => p.pseudo.toLowerCase() === candidate.toLowerCase())) {
    candidate = `${base} (${i})`; i++;
  }
  return candidate;
}

function copyGroupToClipboard(groupId){
  const g = GROUPS.find(x => x.id === groupId);

  const lines = [];
  lines.push((g.type === 'pve' ? 'Groupe PvE ' : 'Groupe PvP ') + g.name.replace(/^Groupe\s*/i, ''));
  const filled = g.slots.filter(s => s.playerId).map(s => {

    return { pseudo: p ? p.pseudo : '?', className: c ? c.name : '?', role: c ? c.role : '' };
  });
  roleOrder.forEach(role => {
    filled.filter(f => f.role === role).forEach(f => lines.push(`${role} : ${f.pseudo} — ${f.className}`));
  });
  filled.filter(f => !roleOrder.includes(f.role)).forEach(f => lines.push(`${f.role || '?'} : ${f.pseudo} — ${f.className}`));
  const subs = g.substitutes.map(id => { const p = player(id); return p ? p.pseudo : null; }).filter(Boolean);
  if (subs.length) lines.push('Remplaçants : ' + subs.join(', '));
  const text = lines.join('\n');
  const finish = () => toast(t('toast.comp_copied'));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
  } else { fallbackCopy(text, finish); }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta); cb();
}

    const mention = p && p.discordId ? `<@${p.discordId}>` : (p ? esc(p.pseudo) : '?');
    if (p && p.discordId) mentionIds.push(p.discordId);
    return { mention, className: c ? c.name : '?', role: c ? c.role : '' };
  });
  const lines = [];
  roleOrder.forEach(role => {
    filled.filter(f => f.role === role).forEach(f => lines.push(`**${role}** — ${f.mention} (${f.className})`));
  });
  filled.filter(f => !roleOrder.includes(f.role)).forEach(f => lines.push(`**${f.role || '?'}** — ${f.mention} (${f.className})`));
  const filledCount = filled.length;
  const dateLabel = (opts && opts.date) ? new Date(opts.date + 'T' + (opts.time || '00:00')).toLocaleString(LANG==='en'?'en-GB':'fr-FR', { weekday:'long', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
  const typeLabel = eventTypeLabel(opts && opts.type ? opts.type : g.type);
  const seeking = !!(opts && opts.seekingSecondGroup);
  const descParts = [];
  if (seeking) descParts.push(`🔍 **${t('groups.lfg_seeking_banner')}**`, '');
  if (dateLabel) descParts.push(`🗓️ ${dateLabel}`);
  descParts.push(`🏷️ ${typeLabel}`);
  descParts.push('');
  descParts.push(lines.join('\n') || t('groups.lfg_empty'));
  descParts.push('');
  const neededRoles = computeNeededRoles(g);
  if (neededRoles.length) descParts.push(`🔍 **${t('groups.seeking_roles')}** ${neededRoles.join(', ')}`, '');
  descParts.push(`${filledCount}/5 ${t('groups.registered')}`);
  descParts.push('');
  descParts.push(t('groups.lfg_react_prompt'));
  const titlePrefix = seeking ? '🔍 [x2] ' : '';
  const contentPrefix = seeking ? `📣 **${t('groups.lfg_seeking_short')}**\n` : '';
  const content = contentPrefix + (mentionIds.length ? mentionIds.map(id => `<@${id}>`).join(' ') : `📣 ${g.name}`);
  const payload = {
    content,
    allowed_mentions: { parse: ['users'] },
    embeds: [{
      title: titlePrefix + ((opts && opts.title && opts.title.trim()) ? esc(opts.title.trim()) : `${g.type === 'pve' ? 'PvE' : 'PvP'} — ${g.name}`),
      description: descParts.join('\n'),
      color: seeking ? 0xffb84f : (g.type === 'pve' ? 0x4f9dff : 0xff6b7a),
    }],
  };
  fetch(DISCORD_LFG_WEBHOOK_URL, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  }).then(r => {
    if (r.ok) toast(t('groups.lfg_posted'));
    else toast(t('groups.lfg_error'), 'danger');
  }).catch(() => toast(t('groups.lfg_error'), 'danger'));
}

/* ---- Dashboard ---- */
function renderDashboard(){
  const totalPlayers = PLAYERS.length;
  const pveCount = PLAYERS.filter(p => p.pve).length;
  const pvpCount = PLAYERS.filter(p => p.pvp).length;
  const newCount = PLAYERS.filter(p => p.isNewPlayer).length;
  const pveGroups = GROUPS.filter(g => g.type === 'pve').length;
  const pvpGroups = GROUPS.filter(g => g.type === 'pvp').length;

  const roleCounts = { Tank: 0, DPS: 0, Heal: 0, Flex: 0 };
  PLAYERS.forEach(p => { const c = cls(p.classId); if (c && roleCounts[c.role] !== undefined) roleCounts[c.role]++; });
  const maxRole = Math.max(1, ...Object.values(roleCounts));

  const classCounts = {};
  CLASSES.forEach(c => classCounts[c.id] = 0);
  PLAYERS.forEach(p => { if (classCounts[p.classId] !== undefined) classCounts[p.classId]++; });
  const maxClass = Math.max(1, ...Object.values(classCounts));

  const now = Date.now();
  const upcoming = EVENTS.filter(e => e.date && (new Date(e.date + 'T' + (e.time || '00:00')).getTime() >= now))
    .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  const nextEvent = upcoming[0] || null;
  const myGroupEvents = myUpcomingGroupEvents();

  return `
    <div class="gm-dash-columns">
      <div class="gm-dash-col">
        <div class="gm-panel gm-stat-card"><div class="gm-stat-value">${totalPlayers}</div><div class="gm-stat-label">${t('dash.stat.players')}</div></div>
        <div class="gm-panel">
          <h3 style="font-size:14px;margin:0 0 12px;">${t('dash.class_breakdown')}</h3>
            ${CLASSES.map(c => `
              <div class="gm-bar-row" style="gap:8px;margin-bottom:8px;">
                <div class="gm-bar-label" style="display:flex;align-items:center;gap:6px;font-size:13px;width:100px;"><img src="${c.icon}" style="width:16px;height:16px;border-radius:3px;" alt="" />${c.name}</div>
                <div class="gm-bar-track" style="height:10px;"><div class="gm-bar-fill" style="width:${(classCounts[c.id]/maxClass)*100}%;background:${c.color};"></div></div>
                <div class="gm-bar-value" style="font-size:13px;">${classCounts[c.id]}</div>
              </div>
            `).join('')}
        </div>
      </div>
      <div class="gm-dash-col">
        <div class="gm-panel gm-stat-card"><div class="gm-stat-value">${pveGroups}</div><div class="gm-stat-label">${t('dash.stat.pve_groups')}</div></div>
        <div class="gm-panel gm-dashboard-event-card">
          <h3 style="font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;">${t('dashboard.next_event')}</h3>
          ${nextEvent ? renderEventCard(nextEvent) : `<div style="color:var(--muted);font-size:13px;">${t('dashboard.no_upcoming_event')}</div>`}
        </div>
      </div>
      <div class="gm-dash-col">
        <div class="gm-panel gm-stat-card"><div class="gm-stat-value">${pvpGroups}</div><div class="gm-stat-label">${t('dash.stat.pvp_groups')}</div></div>
        ${myGroupEvents.length ? `
        <div class="gm-panel gm-dashboard-event-card">
          <h3 style="font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;">${t('dashboard.my_group_events')}</h3>
          <div style="display:flex;flex-direction:column;gap:14px;">
            ${myGroupEvents.map(g => renderGroupEventCard(g)).join('')}
          </div>
        </div>` : ''}
      </div>
      <div class="gm-dash-col">
        <div class="gm-panel gm-stat-card"><div class="gm-stat-value">${newCount}</div><div class="gm-stat-label">${t('dash.stat.new_players')}</div></div>
        ${(() => {
          const openGroups = GROUPS.filter(g => g.open && g.event);
          if (!openGroups.length) return '';
          return `
          <div class="gm-panel">
            <h3 style="font-size:13px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;">🔓 ${t('dashboard.open_groups')} (${openGroups.length})</h3>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${openGroups.map(g => {
                const neededRoles = computeNeededRoles(g);
                const creator = g.createdById ? PLAYERS.find(p => p.discordId === g.createdById) : null;
                return `<div class="gm-open-group-mini">
                <span class="gm-class-pill" style="border-color:${g.type==='pve'?'var(--tank)':'var(--dps)'}66;background:${g.type==='pve'?'var(--tank)':'var(--dps)'}1c;color:${g.type==='pve'?'var(--tank)':'var(--dps)'}">${g.type.toUpperCase()}</span>
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(g.event.title || g.name)}</div>
                    ${neededRoles.length ? `<div style="display:flex;gap:4px;flex-shrink:0;">${neededRoles.map(role => `<button class="gm-role-pill gm-role-pill-clickable" data-action="quick-join-role" data-group="${g.id}" data-role="${role}" style="font-size:9.5px;padding:2px 7px;border-color:${roleColor(role)}66;background:${roleColor(role)}1c;color:${roleColor(role)}">${role} +</button>`).join('')}</div>` : ''}
                  </div>
                  <div style="font-size:11px;color:var(--muted);">${esc(g.name)} · ${g.slots.filter(s=>s.playerId).length}/5${creator ? ` · ${t('groups.created_by')}: ${esc(creator.discordUsername || creator.pseudo)}` : ''}</div>
                </div>
              </div>`;
              }).join('')}
            </div>
          </div>`;
        })()}
      </div>
    </div>
  `;
}

/* ---- Players ---- */
function renderPlayers(){
  let list = PLAYERS.slice();
  if (PLAYER_FILTERS.search) list = list.filter(p => p.pseudo.toLowerCase().includes(PLAYER_FILTERS.search.toLowerCase()));
  if (PLAYER_FILTERS.classId) list = list.filter(p => p.classId === PLAYER_FILTERS.classId);
  if (PLAYER_FILTERS.status === 'new') list = list.filter(p => p.isNewPlayer);
  if (PLAYER_FILTERS.status === 'experienced') list = list.filter(p => !p.isNewPlayer);

  if (!PLAYERS.length){
    return `<div class="gm-players-layout">
      <div class="gm-players-main"><div class="gm-empty"><div class="gm-empty-crest"></div>${t('players.empty_title')}<br>${t('players.empty_sub')}</div></div>
      ${renderNotRegisteredPanel()}
    </div>`;
  }

  const playersHtml = `
    <div class="gm-filters">
      <select class="gm-select" data-action="filter-class"><option value="">${t('players.filter.all_classes')}</option>${CLASSES.map(c => `<option value="${c.id}" ${PLAYER_FILTERS.classId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select class="gm-select" data-action="filter-status">
        <option value="">${t('players.filter.all_status')}</option>
        <option value="new" ${PLAYER_FILTERS.status==='new'?'selected':''}>${t('players.filter.new')}</option>
        <option value="experienced" ${PLAYER_FILTERS.status==='experienced'?'selected':''}>${t('players.filter.experienced')}</option>
      </select>
    </div>
    ${!list.length ? `<div class="gm-empty">${t('players.no_match')}</div>` : `
    <div class="gm-players-grid">
      ${list.map(p => {
        const canEdit = isAdminView() || (discordUser && p.discordId === discordUser.id);
        const actions = `${canEdit ? `<button class="gm-btn gm-btn-ghost gm-btn-sm" data-action="edit-player" data-id="${p.id}" style="padding:7px 16px;font-size:12.5px;">${t('players.edit')}</button>` : ''}${isAdminView() ? `<button class="gm-btn gm-btn-danger gm-btn-sm" data-action="delete-player" data-id="${p.id}">✕</button>` : ''}`;
        return renderPlayerCard(p, actions);
      }).join('')}
    </div>`}
  `;

  return `<div class="gm-players-layout">
    <div class="gm-players-main">${playersHtml}</div>
    ${renderNotRegisteredPanel()}
  </div>`;
}

function renderNotRegisteredPanel(){
  const registeredIds = new Set(PLAYERS.map(p => p.discordId).filter(Boolean));

  const updatedLabel = discordMembersUpdatedAt
    ? new Date(discordMembersUpdatedAt).toLocaleString(LANG==='en'?'en-GB':'fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
    : null;
  return `<div class="gm-panel gm-not-registered">
    <h3 style="font-size:13px;margin:0 0 4px;">${t('notreg.title')}</h3>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">${t('notreg.subtitle')}${updatedLabel ? t('notreg.imported_suffix').replace('{date}', updatedLabel) : ''}</div>
    ${!discordMembersWithRole.length
      ? `<div style="font-size:12px;color:var(--muted-2);">${t('notreg.none_imported')}</div>`
      : !notRegistered.length
        ? `<div style="font-size:12px;color:var(--success);">${t('notreg.all_registered')}</div>`
        : `<div class="gm-not-registered-list">${notRegistered.map(m => `<div class="gm-not-registered-item">${esc(m.nick || m.globalName || m.username)}</div>`).join('')}</div>`

}

  const toggle = `<div class="gm-view-toggle">
    <button class="gm-btn gm-btn-sm ${EVENTS_VIEW==='calendar'?'gm-btn-primary':'gm-btn-ghost'}" data-action="events-view" data-view="calendar">${t('events.view_calendar')}</button>
    <button class="gm-btn gm-btn-sm ${EVENTS_VIEW==='list'?'gm-btn-primary':'gm-btn-ghost'}" data-action="events-view" data-view="list">${t('events.view_list')}</button>
  </div>`;
  if (!EVENTS.length){
    return `${toggle}<div class="gm-empty"><div class="gm-empty-crest"></div>${t('events.empty')}${isAdminView() ? `<br><br><button class="gm-btn gm-btn-primary" data-action="open-event-modal">${t('events.create_first')}</button>` : ''}</div>`;
  }
  if (EVENTS_VIEW === 'list'){
    const sorted = EVENTS.slice().sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    return `${toggle}<div class="gm-events-grid">${sorted.map(ev => renderEventCard(ev)).join('')}</div>`;
  }
  return toggle + renderEventsCalendar();
}
function renderEventsCalendar(){
  if (!CALENDAR_YM) { const now = new Date(); CALENDAR_YM = { y: now.getFullYear(), m: now.getMonth() }; }
  const { y, m } = CALENDAR_YM;
  const firstOfMonth = new Date(y, m, 1);
  const startWeekday = (firstOfMonth.getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  const eventsByDay = {};
  EVENTS.forEach(ev => {
    if (!ev.date) return;
    (eventsByDay[ev.date] = eventsByDay[ev.date] || []).push(ev);
  });

  const monthLabel = firstOfMonth.toLocaleDateString(LANG==='en'?'en-GB':'fr-FR', { month: 'long', year: 'numeric' });
  const weekdayLabels = LANG === 'en'
    ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    : ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="gm-cal-cell gm-cal-empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayEvents = eventsByDay[dateStr] || [];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === SELECTED_CAL_DAY;
    cells += `<div class="gm-cal-cell ${isToday ? 'gm-cal-today' : ''} ${isSelected ? 'gm-cal-selected' : ''} ${dayEvents.length ? 'gm-cal-has-events' : ''}" data-action="select-cal-day" data-day="${dateStr}">
      <div class="gm-cal-daynum">${day}</div>
      <div class="gm-cal-dots">
        ${dayEvents.slice(0,3).map(ev => {
          const color = { pve: 'var(--tank)', pvp: 'var(--dps)', other: 'var(--violet)' }[ev.type] || 'var(--violet)';
          return `<span class="gm-cal-dot" style="background:${color};" title="${esc(ev.title)}"></span>`;
        }).join('')}
        ${dayEvents.length > 3 ? `<span class="gm-cal-more">+${dayEvents.length - 3}</span>` : ''}
      </div>
    </div>`;
  }

  const selectedEvents = SELECTED_CAL_DAY ? (eventsByDay[SELECTED_CAL_DAY] || []) : [];

  return `
    <div class="gm-cal-header">
      <button class="gm-btn gm-btn-ghost gm-btn-sm" data-action="cal-prev-month">‹</button>
      <div class="gm-cal-month-label gm-font-display">${esc(monthLabel)}</div>
      <button class="gm-btn gm-btn-ghost gm-btn-sm" data-action="cal-next-month">›</button>
    </div>
    <div class="gm-cal-weekdays">${weekdayLabels.map(w => `<div>${w}</div>`).join('')}</div>
    <div class="gm-cal-grid">${cells}</div>
    ${SELECTED_CAL_DAY ? `
      <div class="gm-cal-day-detail">
        <h3 style="font-size:14px;margin:0 0 12px;">${esc(new Date(SELECTED_CAL_DAY + 'T00:00').toLocaleDateString(LANG==='en'?'en-GB':'fr-FR', { weekday:'long', day:'2-digit', month:'long' }))}</h3>
        ${selectedEvents.length
          ? `<div class="gm-events-grid">${selectedEvents.map(ev => renderEventCard(ev)).join('')}</div>`
          : `<div style="color:var(--muted);font-size:13px;">${t('events.no_event_this_day')}</div>`}
      </div>
    ` : ''}
  `;
}
function renderEventCard(ev){
  const dateObj = ev.date ? new Date(ev.date + 'T' + (ev.time || '00:00')) : null;
  const dateLabel = dateObj ? dateObj.toLocaleDateString(LANG==='en'?'en-GB':'fr-FR', { weekday:'short', day:'2-digit', month:'short' }) : '';
  const typeColor = { pve: 'var(--tank)', pvp: 'var(--dps)', other: 'var(--violet)' }[ev.type] || 'var(--violet)';
  return `<div class="gm-panel gm-event-card">
    <div class="gm-event-head">
      <span class="gm-class-pill" style="border-color:${typeColor}66;background:${typeColor}1c;color:${typeColor}">${esc(eventTypeLabel(ev.type))}</span>
      ${isAdminView() ? `<div class="gm-event-actions">
        <button class="gm-btn gm-btn-ghost gm-btn-sm" data-action="edit-event" data-id="${ev.id}">${t('players.edit')}</button>
        <button class="gm-btn gm-btn-danger gm-btn-sm" data-action="delete-event" data-id="${ev.id}">✕</button>
      </div>` : ''}
    </div>
    <div class="gm-event-title">${esc(ev.title)}</div>
    <div class="gm-event-datetime">🗓️ ${esc(dateLabel)} · 🕐 ${esc(ev.time || '')}</div>
    ${ev.description ? `<div class="gm-event-desc">${esc(ev.description)}</div>` : ''}
    ${ev.createdBy ? `<div class="gm-event-creator">${t('events.created_by')}: ${esc(ev.createdBy)}</div>` : ''}
    ${renderRsvpBlock(ev.rsvps, 'event', ev.id)}
  </div>`;
}


/* ---- PvE / PvP groups ---- */
function renderGroupsTab(type){
  const groups = GROUPS.filter(g => g.type === type && !g.open);
  if (!groups.length){
    return `<div class="gm-empty"><div class="gm-empty-crest"></div>${t('groups.none_title').replace('{type}', type.toUpperCase())}<br><br><button class="gm-btn gm-btn-primary" data-action="create-group" data-type="${type}">${t('groups.create_first')}</button></div>`;
  }
  return groups.map(g => renderGroupCard(g)).join('');

function renderGroupCard(g, showPublish, showOpenControls){
  const filledCount = g.slots.filter(s => s.playerId).length;
  const eligiblePlayers = PLAYERS.filter(p => g.type === 'pve' ? p.pve : p.pvp);

  const slotsHtml = g.slots.map((slot, i) => {
    const p = slot.playerId ? player(slot.playerId) : null;
    if (p){
      const canRemove = isAdminView() || (discordUser && p.discordId === discordUser.id);
      const actions = canRemove ? `<button class="gm-btn gm-btn-danger gm-btn-sm" data-action="remove-slot-player" data-group="${g.id}" data-slot="${i}" style="padding:7px 16px;font-size:12.5px;">${t('groups.remove_title')}</button>` : '';
      return `<div class="gm-slot-wrapper">${renderPlayerCard(p, actions, '')}</div>`;
    }
    const usedIds = new Set(g.slots.filter((s,si) => si !== i && s.playerId).map(s => s.playerId));
    const options = eligiblePlayers.filter(p => !usedIds.has(p.id) && !playerLimitReached(p.id, g));
    return `<div class="gm-slot">
      <div class="gm-slot-empty">
        <select data-action="set-slot-player" data-group="${g.id}" data-slot="${i}">
          <option value="">${t('groups.choose_player')}</option>
          ${options.map(p => `<option value="${p.id}">${esc(p.pseudo)}</option>`).join('')}
        </select>
      </div>
    </div>`;
  }).join('');

  const subEligible = eligiblePlayers.filter(p => !g.slots.some(s => s.playerId === p.id) && !g.substitutes.includes(p.id));
  const subsHtml = g.substitutes.map(id => {
    const p = player(id);
    if (!p) return '';
    return `<div class="gm-sub-chip">${avatarHtml(p, 22)}${esc(p.pseudo)}<button data-action="remove-substitute" data-group="${g.id}" data-player="${p.id}">✕</button></div>`;
  }).join('');

  const neededRoles = computeNeededRoles(g);
  const creator = g.createdById ? PLAYERS.find(p => p.discordId === g.createdById) : null;
  return `<div class="gm-panel gm-group-card">
    <div class="gm-group-head">
      <div class="gm-group-title-row">
        <input class="gm-group-name" value="${esc(g.name).replace(/"/g,'&quot;')}" data-action="update-group-name" data-group="${g.id}" />
        ${g.open && showOpenControls ? `<span class="gm-open-badge">${t('groups.open_badge')}</span>` : ''}
      </div>
      <div class="gm-group-actions">
        ${showOpenControls ? `<button class="gm-btn gm-btn-sm ${g.open ? 'gm-btn-primary' : 'gm-btn-ghost'}" data-action="toggle-group-open" data-group="${g.id}">${g.open ? t('groups.close_group') : t('groups.open_group')}</button>` : ''}
        ${showPublish ? `<button class="gm-btn gm-btn-ghost gm-btn-sm" data-action="publish-group-discord" data-group="${g.id}" style="background:#5865F2;border-color:#5865F2;color:#fff;">${t('groups.publish_discord')}</button>` : ''}
        ${isAdminView() ? `<button class="gm-btn gm-btn-ghost gm-btn-sm" data-action="reset-group" data-group="${g.id}">${t('groups.reset')}</button>` : ''}
        ${canManageGroup(g) ? `<button class="gm-btn gm-btn-danger gm-btn-sm" data-action="delete-group" data-group="${g.id}">${t('groups.delete')}</button>` : ''}
      </div>
    </div>
    ${showOpenControls && creator ? `<div class="gm-group-creator">${t('groups.created_by')}: ${esc(creator.discordUsername || creator.pseudo)}</div>` : ''}
    ${showOpenControls && g.open && neededRoles.length ? `
    <div class="gm-needed-roles">
      <span class="gm-needed-roles-label">${t('groups.seeking_roles')}</span>
      ${neededRoles.map(role => `<button class="gm-role-pill gm-role-pill-clickable" data-action="quick-join-role" data-group="${g.id}" data-role="${role}" style="border-color:${roleColor(role)}66;background:${roleColor(role)}1c;color:${roleColor(role)}">${role} +</button>`).join('')}
    </div>` : ''}
    <div class="gm-slots">${slotsHtml}</div>
    ${subsHtml ? `<div class="gm-subs-title">${t('groups.substitutes')}</div>
    <div class="gm-subs-list">${subsHtml}</div>` : ''}
    <div style="margin-top:12px;font-size:12px;color:var(--muted);text-align:center;">${filledCount}/5 ${t('groups.registered')}</div>
  </div>`;
}

  return GROUPS.filter(g =>

function canCancelGroupEvent(g){

}
function cancelGroupEvent(groupId){

function groupEventBanner(g){

    : '';
  return `<div class="gm-event-request-banner">📢 ${esc(msg)}${renderRsvpBlock(g.event.rsvps, 'group', g.id)}${cancelBtn}</div>`;

function renderMyGroupTab(){
  if (!discordUser) return `<div class="gm-empty">${t('mygroup.not_logged')}</div>`;

/* ---- Audit log ---- */
function auditActionLabel(actionKey){
  const map = {
    player_deleted: t('audit.player_deleted'),
    class_created: t('audit.class_created'),
    class_updated: t('audit.class_updated'),
    class_deleted: t('audit.class_deleted'),
    group_reset: t('audit.group_reset'),
    group_deleted: t('audit.group_deleted'),
    event_created: t('audit.event_created'),
    event_updated: t('audit.event_updated'),
    event_deleted: t('audit.event_deleted'),
  };
  return map[actionKey] || actionKey;
}
function auditActionColor(actionKey){
  if (actionKey.endsWith('_deleted')) return 'var(--danger)';
  if (actionKey.endsWith('_created')) return 'var(--success)';
  if (actionKey.endsWith('_reset')) return 'var(--new)';
  return 'var(--blue)';
}
function renderAuditLog(){
  if (!AUDIT_LOG.length){
    return `<div class="gm-empty"><div class="gm-empty-crest"></div>${t('audit.empty')}</div>`;
  }
  return `<div class="gm-panel" style="padding:0;overflow:hidden;">
    <table class="gm-table">
      <thead><tr><th>${t('audit.col_action')}</th><th>${t('audit.col_target')}</th><th>${t('audit.col_actor')}</th><th>${t('audit.col_when')}</th></tr></thead>
      <tbody>
        ${AUDIT_LOG.map(entry => {
          const d = new Date(entry.at);
          const dateLabel = d.toLocaleString(LANG==='en'?'en-GB':'fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
          const color = auditActionColor(entry.actionKey);
          return `<tr>
            <td><span style="color:${color};font-weight:600;font-size:12.5px;">${esc(auditActionLabel(entry.actionKey))}</span></td>
            <td style="font-size:12.5px;">${esc(entry.targetLabel || '—')}</td>
            <td style="font-size:12.5px;color:var(--muted);">${esc(entry.actor || '—')}</td>
            <td style="font-size:11.5px;color:var(--muted-2);white-space:nowrap;">${esc(dateLabel)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ---- Event binding (delegated) ---- */
function bindEvents(){
  const root = document.getElementById('gm-app');

  root.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    const evt = (el.tagName === 'SELECT' || el.tagName === 'INPUT') ? 'change' : 'click';
    if (el._bound) return;
    el._bound = true;

    if (action === 'nav'){
      el.addEventListener('click', () => { ACTIVE_TAB = el.dataset.tab; MOBILE_NAV_OPEN = false; render(); });
    } else if (action === 'toggle-group-nav'){
      el.addEventListener('click', () => { GROUP_NAV_EXPANDED = !GROUP_NAV_EXPANDED; render(); });
    } else if (action === 'toggle-mobile-nav'){
      el.addEventListener('click', () => { MOBILE_NAV_OPEN = !MOBILE_NAV_OPEN; render(); });
    } else if (action === 'discord-login'){
      el.addEventListener('click', loginWithDiscord);
    } else if (action === 'discord-logout'){
      el.addEventListener('click', logoutDiscord);
    } else if (action === 'toggle-preview'){
      el.addEventListener('click', () => {
        PREVIEW_AS_MEMBER = !PREVIEW_AS_MEMBER;
        if (PREVIEW_AS_MEMBER && ACTIVE_TAB === 'classes') ACTIVE_TAB = 'dashboard';
        toast(PREVIEW_AS_MEMBER ? t('toast.preview_on') : t('toast.preview_off'));
        render();
      });
    } else if (action === 'set-lang'){
      el.addEventListener('click', () => setLang(el.dataset.lang));
    } else if (action === 'edit-player'){
      el.addEventListener('click', () => openPlayerModal(el.dataset.id));
    } else if (action === 'delete-player'){
      el.addEventListener('click', () => requestDeletePlayer(el.dataset.id));
    } else if (action === 'filter-search'){
      el.addEventListener('input', () => {
        PLAYER_FILTERS.search = el.value;
        const cursorPos = el.selectionStart;
        render();
        const newEl = document.querySelector('[data-action="filter-search"]');
        if (newEl) { newEl.focus(); newEl.setSelectionRange(cursorPos, cursorPos); }
      });
    } else if (action === 'filter-class'){
      el.addEventListener('change', () => { PLAYER_FILTERS.classId = el.value; render(); });
    } else if (action === 'filter-status'){
      el.addEventListener('change', () => { PLAYER_FILTERS.status = el.value; render(); });
    } else if (action === 'open-class-modal'){
      el.addEventListener('click', () => openClassModal(null));
    } else if (action === 'edit-class'){
      el.addEventListener('click', () => openClassModal(el.dataset.id));
    } else if (action === 'delete-class'){
      el.addEventListener('click', () => requestDeleteClass(el.dataset.id));
    } else if (action === 'create-group'){
      el.addEventListener('click', () => createGroup(el.dataset.type));
    } else if (action === 'create-open-group'){
      el.addEventListener('click', () => createOpenGroup(el.dataset.type));
    } else if (action === 'set-slot-player'){
      el.addEventListener('change', () => setSlotPlayer(el.dataset.group, parseInt(el.dataset.slot), el.value));
    } else if (action === 'remove-slot-player'){
      el.addEventListener('click', () => removeSlotPlayer(el.dataset.group, parseInt(el.dataset.slot)));
    } else if (action === 'add-substitute'){
      el.addEventListener('change', () => addSubstitute(el.dataset.group, el.value));
    } else if (action === 'remove-substitute'){
      el.addEventListener('click', () => removeSubstitute(el.dataset.group, el.dataset.player));
    } else if (action === 'update-group-name'){
      el.addEventListener('change', () => updateGroupField(el.dataset.group, 'name', el.value));
    } else if (action === 'update-group-field'){
      el.addEventListener('change', () => updateGroupField(el.dataset.group, el.dataset.field, el.value));
    } else if (action === 'copy-group'){
      el.addEventListener('click', () => copyGroupToClipboard(el.dataset.group));
    } else if (action === 'duplicate-group'){
      el.addEventListener('click', () => duplicateGroup(el.dataset.group));
    } else if (action === 'publish-group-discord'){
      el.addEventListener('click', () => openPublishGroupModal(el.dataset.group));
    } else if (action === 'confirm-publish-group'){
      el.addEventListener('click', () => {
        const opts = {
          title: document.getElementById('pg-title').value,
          date: document.getElementById('pg-date').value,
          time: document.getElementById('pg-time').value,
          type: document.getElementById('pg-type').value,
          seekingSecondGroup: document.getElementById('pg-seeking').checked,
        };
        if (!opts.date || !opts.time) { MODAL.error = t('error.event_date_required'); render(); return; }
        const groupId = MODAL.groupId;
        MODAL = null; render();
        publishGroupToDiscord(groupId, opts);
      });
    } else if (action === 'cancel-group-event'){
      el.addEventListener('click', () => cancelGroupEvent(el.dataset.group));
    } else if (action === 'toggle-group-open'){
      el.addEventListener('click', () => toggleGroupOpen(el.dataset.group));
    } else if (action === 'quick-join-role'){
      el.addEventListener('click', () => quickJoinGroupRole(el.dataset.group, el.dataset.role));
    } else if (action === 'reset-group'){
      el.addEventListener('click', () => resetGroup(el.dataset.group));
    } else if (action === 'delete-group'){
      el.addEventListener('click', () => deleteGroup(el.dataset.group));
    } else if (action === 'close-modal' || action === 'close-modal-overlay'){
      el.addEventListener('click', (e) => { if (e.target !== el) return; MODAL = null; render(); });
    } else if (action === 'stop-propagation'){
      el.addEventListener('click', (e) => e.stopPropagation());
    } else if (action === 'confirm-modal'){
      el.addEventListener('click', () => { if (MODAL && MODAL.onConfirm) MODAL.onConfirm(); });
    } else if (action === 'save-player'){
      el.addEventListener('click', () => {
        MODAL.form.pseudo = document.getElementById('pf-pseudo').value;
        MODAL.form.classId = document.getElementById('pf-class').value;
        MODAL.form.secondaryClassId = document.getElementById('pf-class-secondary').value;
        MODAL.form.isNewPlayer = document.getElementById('pf-status').value === 'new';
        savePlayerForm();
      });
    } else if (action === 'save-class'){
      el.addEventListener('click', () => {
        MODAL.form.name = document.getElementById('cf-name').value;
        MODAL.form.role = document.getElementById('cf-role').value;
        MODAL.form.color = document.getElementById('cf-color').value;
        saveClassForm();
      });
    } else if (action === 'open-event-modal'){
      el.addEventListener('click', () => openEventModal(null));
    } else if (action === 'edit-event'){
      el.addEventListener('click', () => openEventModal(el.dataset.id));
    } else if (action === 'delete-event'){
      el.addEventListener('click', () => requestDeleteEvent(el.dataset.id));
    } else if (action === 'rsvp-event-yes'){
      el.addEventListener('click', () => setEventRsvp(el.dataset.id, 'yes'));
    } else if (action === 'rsvp-event-no'){
      el.addEventListener('click', () => setEventRsvp(el.dataset.id, 'no'));
    } else if (action === 'rsvp-group-yes'){
      el.addEventListener('click', () => setGroupEventRsvp(el.dataset.id, 'yes'));
    } else if (action === 'rsvp-group-no'){
      el.addEventListener('click', () => setGroupEventRsvp(el.dataset.id, 'no'));
    } else if (action === 'events-view'){
      el.addEventListener('click', () => { EVENTS_VIEW = el.dataset.view; render(); });
    } else if (action === 'select-cal-day'){
      el.addEventListener('click', () => {
        SELECTED_CAL_DAY = (SELECTED_CAL_DAY === el.dataset.day) ? null : el.dataset.day;
        render();
      });
    } else if (action === 'cal-prev-month'){
      el.addEventListener('click', () => {
        if (!CALENDAR_YM) { const now = new Date(); CALENDAR_YM = { y: now.getFullYear(), m: now.getMonth() }; }
        CALENDAR_YM.m -= 1;
        if (CALENDAR_YM.m < 0) { CALENDAR_YM.m = 11; CALENDAR_YM.y -= 1; }
        SELECTED_CAL_DAY = null;
        render();
      });
    } else if (action === 'cal-next-month'){
      el.addEventListener('click', () => {
        if (!CALENDAR_YM) { const now = new Date(); CALENDAR_YM = { y: now.getFullYear(), m: now.getMonth() }; }
        CALENDAR_YM.m += 1;
        if (CALENDAR_YM.m > 11) { CALENDAR_YM.m = 0; CALENDAR_YM.y += 1; }
        SELECTED_CAL_DAY = null;
        render();
      });
    } else if (action === 'save-event'){
      el.addEventListener('click', () => {
        MODAL.form.title = document.getElementById('ef-title').value;
        MODAL.form.date = document.getElementById('ef-date').value;
        MODAL.form.time = document.getElementById('ef-time').value;
        MODAL.form.type = document.getElementById('ef-type').value;
        MODAL.form.description = document.getElementById('ef-description').value;
        saveEventForm();
      });
    }
  });
}

/* ---- Access gate ---- */
function renderGate(){
  const root = document.getElementById('gm-app');
  let body = '';
  if (ACCESS_STATE === 'checking'){
    body = `<div style="text-align:center;color:var(--muted);">${t('gate.checking')}</div>`;
  } else if (ACCESS_STATE === 'denied'){
    body = `
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:15px;font-weight:600;color:#ff8b96;margin-bottom:8px;">${t('gate.denied_title')}</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;">${t('gate.denied_msg')}</div>
        <button class="gm-btn gm-btn-ghost" data-gate-action="logout">${t('gate.logout')}</button>
      </div>`;
  } else if (ACCESS_STATE === 'error'){
    body = `
      <div style="text-align:center;max-width:360px;">
        <div style="font-size:15px;font-weight:600;color:var(--new);margin-bottom:8px;">${t('gate.error_title')}</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;">${t('gate.error_msg')}</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
          <button class="gm-btn gm-btn-primary" data-gate-action="retry">${t('gate.retry')}</button>
          <button class="gm-btn gm-btn-ghost" data-gate-action="logout">${t('gate.logout')}</button>
        </div>
      </div>`;
  } else {
    body = `
      <div style="text-align:center;max-width:360px;">
        <img src="./logo-lfdb.webp" alt="" style="width:72px;height:72px;object-fit:contain;margin:0 auto 16px;display:block;" />
        <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px;">${t('gate.access_title')}</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;">${t('gate.access_msg')}</div>
        <button class="gm-btn gm-btn-primary" style="background:#5865F2;border-color:#5865F2;color:#fff;" data-gate-action="login">${DISCORD_LOGO} ${t('gate.login_discord')}</button>
        <div class="gm-lang-switch" style="margin-top:16px;">
          <button class="gm-btn gm-btn-sm ${LANG==='fr'?'gm-btn-primary':'gm-btn-ghost'}" data-gate-action="set-lang" data-lang="fr"><img src="${FLAG_FR}" alt="FR" style="width:16px;height:11px;object-fit:cover;border-radius:2px;" /> FR</button>
          <button class="gm-btn gm-btn-sm ${LANG==='en'?'gm-btn-primary':'gm-btn-ghost'}" data-gate-action="set-lang" data-lang="en"><img src="${FLAG_GB}" alt="EN" style="width:16px;height:11px;object-fit:cover;border-radius:2px;" /> EN</button>
        </div>
      </div>`;
  }
  root.innerHTML = `<div class="gm-root" style="display:flex;align-items:center;justify-content:center;padding:20px;">${body}</div>`;
  const loginBtn = root.querySelector('[data-gate-action="login"]');
  if (loginBtn) loginBtn.addEventListener('click', loginWithDiscord);
  const logoutBtn = root.querySelector('[data-gate-action="logout"]');
  if (logoutBtn) logoutBtn.addEventListener('click', logoutDiscord);
  const retryBtn = root.querySelector('[data-gate-action="retry"]');
  if (retryBtn) retryBtn.addEventListener('click', () => verifyRoleAndProceed(false));
  root.querySelectorAll('[data-gate-action="set-lang"]').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });
}

let discordMembersWithRole = [];
let discordMembersUpdatedAt = null;

function fetchDiscordMembersList(){
  fetch('./discord-members.json?t=' + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data) return;
      discordMembersWithRole = data.members || [];
      discordMembersUpdatedAt = data.updatedAt || null;
      if (ACTIVE_TAB === 'players') render();
    })
    .catch(() => {});
}

function startApp(){
  fetchDiscordMembersList();
  let firstLoad = true;
  docRef.onSnapshot(snap => {
    if (snap.exists){
      const d = snap.data();
      if (d.players) PLAYERS = d.players;
      if (d.classes && d.classes.length) CLASSES = d.classes;
      if (d.groups) GROUPS = d.groups;
      if (d.events) EVENTS = d.events;
      if (d.auditLog) AUDIT_LOG = d.auditLog;
    } else if (firstLoad){
      scheduleSave();
    }
    firstLoad = false;
    render();
  }, err => {
    console.error('Firestore error', err);
    render();
  });
}

/* ---- Init ---- */
document.documentElement.lang = LANG;
document.title = t('page.title');
renderGate();
bootstrapAccess();

})();

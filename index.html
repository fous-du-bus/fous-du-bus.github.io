<style>
  :root {
    --theme-bg1: #1a1530; --theme-bg2: #0f0d1a; --theme-bg3: #0a0812;

  #bgCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

  .discord-top-connect { display: flex; align-items: center; gap: 6px; background: #5865F2; border: none; border-radius: 20px; padding: 7px 14px; font-size: 12px; color: #fff; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(88,101,242,0.4); }
  .discord-top-connect:hover { background: #4752c4; }

  .discord-top-user img { width: 26px; height: 26px; border-radius: 50%; }
  .discord-top-user span { font-size: 12px; font-weight: 600; color: #e8e3f0; }
  @media (max-width: 480px) { .discord-top-user span { display: none; } }
  #notesPanel { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 100; width: min(340px, calc(100vw - 36px)); display: none; }
  #notesPanel.show { display: block; }
  .notes-card { background: #1a1530; border: 1px solid var(--theme-card-border, rgba(196,126,212,0.25)); border-radius: 14px; padding: 14px; box-shadow: 0 12px 34px rgba(0,0,0,.5); }
  .notes-card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #e8e3f0; }
  .notes-textarea { width: 100%; min-height: 140px; resize: vertical; background: #0f0d1a; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px; color: #e8e3f0; font-size: 12px; font-family: inherit; line-height: 1.5; }
  .notes-textarea:focus { outline: none; border-color: var(--theme-accent, #4fd1c5); }
  .notes-save-status { font-size: 9px; color: #544b68; margin-top: 5px; text-align: right; }
  body > *:not(#bgCanvas) { position: relative; z-index: 1; }
  body {

  /* ===== Mise en page large écran ===== */
  .wrap {
    width: min(100%, 1480px);
    max-width: 1480px;
    margin-inline: auto;
  }

  /* Les éléments de pilotage restent lisibles sans devenir excessivement larges. */
  .tabs,
  .progress-box,
  .summary-box,
  .chips,
  .edit-panel {
    width: min(100%, 1180px);
    margin-left: auto;
    margin-right: auto;
  }

  #blocksContainer {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px 28px;
    align-items: start;
  }

  .block {
    min-width: 0;
    margin-bottom: 0;
  }

  .block-body {
    width: 100%;
  }

  .task-row {
    flex-wrap: nowrap;
  }

  .task-label {
    min-width: 0;
  }

  .char-slots {
    flex: 0 0 auto;
  }

  .reset-btn,
  .footer-note,
  .footer-copy {
    width: min(100%, 1180px);
    margin-left: auto;
    margin-right: auto;
  }

  @media (max-width: 1100px) {
    .wrap {
      max-width: 760px;
    }

      grid-template-columns: 1fr;
      gap: 0;

      margin-bottom: 18px;

  @media (max-width: 680px) {
    body {
      padding: 20px 12px 48px;
    }

    .task-row {
      flex-wrap: wrap;
    }

    .char-slots {
      width: 100%;
      justify-content: flex-end;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .block-note,
    .pvp-timer {
      padding-left: 0;
    }
  }


  /* ===== Optimisations avancées ===== */
  :root { --panel: rgba(255,255,255,.035); --border: rgba(255,255,255,.09); }

  .tool-btn { border:1px solid var(--border); background:var(--panel); color:#aaa2b8; border-radius:10px; padding:8px 11px; cursor:pointer; font-size:12px; font-weight:650; }
  .tool-btn:hover,.tool-btn.active { color:#4fd1c5; border-color:#4fd1c5; background:rgba(79,209,197,.1); }

  .icon-menu { display:flex; flex-direction:column; gap:2px; }

  .icon-menu-row.danger { color:#e08a6a; }
  .icon-menu-check { margin-left:auto; font-size:12px; color:var(--theme-accent,#4fd1c5); }
  .dashboard { width:min(100%,1180px); margin:0 auto 20px; display:grid; grid-template-columns:1.35fr 1fr; gap:14px; }
  .rift-card { width:min(100%,1180px); margin:0 auto 20px; background: var(--theme-card-bg); border: var(--theme-border-w) solid var(--theme-card-border); border-radius: var(--theme-radius-card); padding: 18px 20px; }
  .sync-card { background: var(--theme-card-bg); border: var(--theme-border-w) solid var(--theme-card-border); border-radius: var(--theme-radius-inner); padding: 16px; margin-bottom: 20px; }

  .sync-status { font-size: 11px; color: #8b8299; text-align: center; margin-bottom: 6px; }
  .sync-hint { font-size: 11px; color: #8b8299; line-height: 1.5; }

  .rift-icon { width:36px; height:36px; border-radius:10px; background: rgba(196,126,212,0.15); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .rift-title { font-size:16px; font-weight:700; color:#e8e3f0; }
  .rift-subtitle { font-size:12px; color:#8b8299; margin-top:2px; }

  .rift-next-label { font-size:11px; color:#8b8299; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .rift-countdown-big { font-family:'Courier New', monospace; font-size:28px; font-weight:800; color:var(--theme-highlight); }
  .rift-window-label { font-size:11px; color:#8b8299; text-align:right; margin-bottom:4px; }
  .rift-window-value { font-size:16px; font-weight:700; color:#e8e3f0; text-align:right; }
  .rift-window-day { font-size:12px; color:#7c9fd4; text-align:right; }
  .rift-list-title { font-size:11px; color:#8b8299; letter-spacing:1px; text-transform:uppercase; margin: 10px 0 8px; }

  .now-empty { color:#5fc98d; font-size:12px; }
  .char-progress-row { display:grid; grid-template-columns:minmax(86px,1fr) 2fr auto; gap:9px; align-items:center; font-size:11px; }
  .mini-track { height:6px; border-radius:4px; overflow:hidden; background:rgba(255,255,255,.06); }

  .block-note-enhanced p { margin:7px 0 0; max-width:75ch; line-height:1.45; }

  .hide-completed .task-row.is-complete { display:none; }

  .history-modal.show { display:flex; }

  @media (max-width:780px){ .dashboard{grid-template-columns:1fr}.toolbar-spacer{display:none}.app-toolbar .tool-btn{flex:1 1 auto}.block-note-enhanced{padding-left:0}.history-row{grid-template-columns:90px 1fr auto} }



  /* ===== Spacetime Rift : panneau latéral toujours visible ===== */
  @media (min-width: 1400px) {
    /* Le panneau Rift occupe la droite ; toute la largeur restante est donnée au contenu. */
    body {
      padding-left: 24px;
      padding-right: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 1300px;
      margin: 0;
      padding-right: 0;
    }

    /* Suppression des anciennes limites à 1180 px sur grand écran. */
    .tabs,
    .progress-box,
    .summary-box,
    .chips,
    .edit-panel,
    .app-toolbar,
    .dashboard,
    .reset-btn,
    .footer-note,
    .footer-copy {
      width: 100%;
      max-width: none;
      margin-left: 0;
      margin-right: 0;
    }

    #blocksContainer {
      width: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 24px;
    }

    #eventSidebar {
      position: fixed;
      z-index: 500;
      top: 22px;
      right: 22px;
      width: 360px;
      max-height: calc(100vh - 44px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #eventSidebar .rift-card,
    #eventSidebar .rift-collapsed {
      width: 100%;
      margin: 0;
      box-shadow: 0 10px 24px rgba(0,0,0,.42), 0 0 0 1px rgba(196,126,212,.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    #eventSidebar .rift-card {
      padding: 15px 16px;
    }

    #eventSidebar .rift-head {
      margin-bottom: 12px;
    }

    #eventSidebar .rift-title {
      font-size: 15px;
    }

    #eventSidebar .rift-subtitle {
      font-size: 11px;
      line-height: 1.35;
    }

    #eventSidebar .rift-hero {
      padding: 12px 13px;
      margin-bottom: 11px;
    }

    #eventSidebar .rift-countdown-big {
      font-size: 24px;
    }

    #eventSidebar .rift-window-value {
      font-size: 14px;
    }

    #eventSidebar .rift-row {
      padding: 7px 2px;
      font-size: 12px;
    }

    #eventSidebar .rift-row-day,
    #eventSidebar .rift-row-cd {
      font-size: 11px;
    }

    #eventSidebar .rift-footer {
      font-size: 10px;
      line-height: 1.45;
      margin-top: 11px;
    }

  }

  /* En dessous de 1400 px, le bloc revient dans le flux pour éviter tout chevauchement. */
  @media (max-width: 1399px) {
    body {
      padding-right: 16px;
    }

    .wrap {
      padding-right: 0;
    }

    #eventSidebar {
      position: static;
      width: auto;
      max-height: none;
      overflow: visible;
      display: block;
    }

    #eventSidebar > div {
      margin-bottom: 20px;
    }
  }

  /* ===== Largeur fixe desktop / ultrawide =====
     Le contenu principal ne s'étire plus au-delà de 1480 px.
     Le panneau événements reste fixé à droite du contenu, dans un shell total de 1864 px (1480 + 24 + 360). */
  @media (min-width: 1400px) {
    body {
      padding: 28px 24px 60px;
    }

    .wrap {
      width: min(1480px, calc(100vw - 570px));
      max-width: 1480px;
      margin-left: max(70px, calc((100vw - 1910px) / 2));
      margin-right: 0;
      padding-right: 0;
    }

    .tabs,
    .progress-box,
    .summary-box,
    .chips,
    .edit-panel,
    .app-toolbar,
    .dashboard,
    .reset-btn,
    .footer-note,
    .footer-copy {
      width: 100%;
      max-width: none;
      margin-left: 0;
      margin-right: 0;
    }

    #blocksContainer {
      width: 100%;
      max-width: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #eventSidebar {
      right: max(70px, calc((100vw - 1910px) / 2));
      width: 360px;
    }

  }

let particleColors = ['#4fd1c5', '#7c9fd4', '#c47ed4'];
function updateParticleColors(){

  particleColors = [
    styles.getPropertyValue('--theme-accent').trim() || '#4fd1c5',
    styles.getPropertyValue('--theme-accent2').trim() || '#7c9fd4',

  ];

function initParticleBackground(){
  const canvas = document.getElementById('bgCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w, h, particles;
  const PARTICLE_COUNT = 46;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function makeParticle(){
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.6 + Math.random() * 1.8,
      speed: 0.12 + Math.random() * 0.35,
      drift: (Math.random() - 0.5) * 0.25,
      opacity: 0.15 + Math.random() * 0.45,
      color: particleColors[Math.floor(Math.random() * particleColors.length)],
      twinkle: Math.random() * Math.PI * 2,
    };
  }
  function init(){
    resize();
    particles = Array.from({ length: PARTICLE_COUNT }, makeParticle);
  }
  function tick(){
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y -= p.speed;
      p.x += p.drift;
      p.twinkle += 0.02;
      if (p.y < -10){ p.y = h + 10; p.x = Math.random() * w; p.color = particleColors[Math.floor(Math.random() * particleColors.length)]; }
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      const flicker = 0.6 + 0.4 * Math.sin(p.twinkle);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.opacity * flicker;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  init();
  updateParticleColors();
  window.addEventListener('resize', resize);
  requestAnimationFrame(tick);
}

const SYNC_CODE_KEY = 'aion2-sync-code';
let syncCode = localStorage.getItem(SYNC_CODE_KEY) || null;
let cloudPushTimer = null;
let cloudSyncStatus = 'idle';

const DISCORD_CLIENT_ID = '1532248812771606691';
const DISCORD_USER_KEY = 'aion2-discord-user';
let discordUser = loadJSON(DISCORD_USER_KEY, null);

function getRedirectUri(){
  return location.origin + location.pathname;
}

function loginWithDiscord(){
  const redirect = encodeURIComponent(getRedirectUri());
  location.href = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=identify`;
}

function logoutDiscord(){
  if (!confirm("Te déconnecter de Discord ? Tes données restent sur cet appareil mais ne seront plus synchronisées via ce compte.")) return;
  discordUser = null;
  localStorage.removeItem(DISCORD_USER_KEY);
  syncCode = null;
  localStorage.removeItem(SYNC_CODE_KEY);
  renderSyncPanel();
}

function handleDiscordRedirect(){
  const hash = location.hash;
  if (!hash || !hash.includes('access_token')) return;
  const params = new URLSearchParams(hash.slice(1));
  const token = params.get('access_token');
  if (!token) return;
  history.replaceState(null, '', getRedirectUri());
  cloudSyncStatus = 'syncing';
  fetch('https://discord.com/api/users/@me', { headers: { Authorization: `Bearer ${token}` } })
    .then(r => r.json())
    .then(user => {
      discordUser = { id: user.id, username: user.username, avatar: user.avatar };
      saveJSON(DISCORD_USER_KEY, discordUser);
      const code = 'discord-' + user.id;
      syncCode = code;
      localStorage.setItem(SYNC_CODE_KEY, code);
      addToSyncHistory(code);
      if (!fbDb) { renderSyncPanel(); return; }
      fbDb.collection('syncCodes').doc(code).get().then(snap => {
        if (snap.exists && snap.data().data){
          const remote = snap.data().data;
          for (let i = localStorage.length - 1; i >= 0; i--){
            const k = localStorage.key(i);
            if (k && k.startsWith('aion2-') && k !== SYNC_CODE_KEY && k !== SYNC_HISTORY_KEY && k !== DISCORD_USER_KEY) localStorage.removeItem(k);
          }
          Object.entries(remote).forEach(([k, v]) => { if (k !== SYNC_HISTORY_KEY) localStorage.setItem(k, v); });
          location.reload();
        } else {
          pushToCloud();
          renderSyncPanel();
        }
      });
    })
    .catch(err => { console.error('Discord auth error', err); cloudSyncStatus = 'error'; renderSyncPanel(); });
}

function collectLocalAionData(){
  const data = {};
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.startsWith('aion2-') && k !== SYNC_CODE_KEY){
      data[k] = localStorage.getItem(k);
    }
  }
  return data;
}

function queueCloudPush(){
  if (!syncCode || !fbDb) return;
  if (cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushToCloud, 1200);
}

function pushToCloud(){
  if (!syncCode || !fbDb) return;
  cloudSyncStatus = 'syncing';
  renderSyncPanel();
  fbDb.collection('syncCodes').doc(syncCode).set({ data: collectLocalAionData(), updatedAt: Date.now() })
    .then(() => { cloudSyncStatus = 'synced'; renderSyncPanel(); })
    .catch(err => { console.error('Erreur de synchronisation', err); cloudSyncStatus = 'error'; renderSyncPanel(); });
}

function pullFromCloud(code){
  if (!fbDb) return;
  cloudSyncStatus = 'syncing';
  renderSyncPanel();
  fbDb.collection('syncCodes').doc(code).get().then(snap => {
    if (!snap.exists){
      alert("Aucune donnée trouvée pour ce code. Vérifie qu'il est correct, ou crée un nouveau code.");
      cloudSyncStatus = 'idle';
      renderSyncPanel();
      return;
    }
    const remote = snap.data().data || {};
    for (let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if (k && k.startsWith('aion2-') && k !== SYNC_CODE_KEY && k !== SYNC_HISTORY_KEY) localStorage.removeItem(k);
    }
    Object.entries(remote).forEach(([k, v]) => { if (k !== SYNC_HISTORY_KEY) localStorage.setItem(k, v); });
    localStorage.setItem(SYNC_CODE_KEY, code);
    addToSyncHistory(code);
    location.reload();
  }).catch(err => {
    console.error('Erreur de récupération', err);
    alert("Impossible de récupérer les données. Vérifie ta connexion et réessaie.");
    cloudSyncStatus = 'idle';
    renderSyncPanel();
  });
}

function generateSyncCode(){
  const words = ['zilly','chimicz','hyperion','coubo','aegrim','templar','ranger','glad','bus','fous','abyss','reshanta'];
  const w = words[Math.floor(Math.random() * words.length)];
  return `${w}-${Math.random().toString(36).slice(2, 7)}`;
}

const SYNC_HISTORY_KEY = 'aion2-sync-history';

function addToSyncHistory(code){
  let history = loadJSON(SYNC_HISTORY_KEY, []);
  history = history.filter(h => h.code !== code);
  history.unshift({ code, date: new Date().toLocaleDateString('fr-FR') });
  history = history.slice(0, 5);
  try { localStorage.setItem(SYNC_HISTORY_KEY, JSON.stringify(history)); } catch(e){}
}

function getSyncHistory(){
  return loadJSON(SYNC_HISTORY_KEY, []);
}

function createNewSyncCode(){
  const code = generateSyncCode();
  syncCode = code;
  localStorage.setItem(SYNC_CODE_KEY, code);
  addToSyncHistory(code);
  pushToCloud();
  renderSyncPanel();
}

let view = 'daily';
let dailyChecked = loadJSON(todayKey(), {});
let weeklyChecked = loadJSON(weekKey(), {});
let dailyMissed = loadJSON(missedKey(), {});
let weeklyMissed = loadJSON(weeklyMissedKey(), {});
let charNames = loadJSON(CHAR_NAMES_KEY, {});
let charIcons = loadJSON(CHAR_ICONS_KEY, {});
let CHARACTERS = loadJSON(CHAR_LIST_KEY, DEFAULT_CHARACTERS);
let activeChar = 'all';
let showSummary = true;
let editingNames = false;

function persistCharacters(){ saveJSON(CHAR_LIST_KEY, CHARACTERS); }

function addAlt(){
  const altCount = CHARACTERS.filter(c => c.id !== 'main').length;
  const newId = 'alt' + Date.now();
  const color = ALT_COLOR_PALETTE[altCount % ALT_COLOR_PALETTE.length];
  CHARACTERS.push({ id: newId, name: 'Alt ' + (altCount + 1), role: 'Alt', icon: 'target', color });
  persistCharacters();
  render();
}

function removeAlt(id){
  if (id === 'main') return;
  CHARACTERS = CHARACTERS.filter(c => c.id !== id);
  persistCharacters();
  if (activeChar === id) activeChar = 'all';
  render();
}

function resolveTaskChars(task){
  const ids = [];
  task.chars.forEach(g => {
    if (g === 'main') ids.push('main');
    else if (g === 'alt') CHARACTERS.forEach(c => { if (c.id !== 'main') ids.push(c.id); });
    else ids.push(g);
  });
  return ids;
}

function qtyForChar(task, cid){
  if (!task.qty) return null;
  const group = cid === 'main' ? 'main' : 'alt';
  return task.qty[group] ?? task.qty[cid] ?? null;
}

function getChar(id){
  const base = CHARACTERS.find(c => c.id === id);
  if (!base) return null;
  const chosenClass = CLASS_OPTIONS.find(cl => cl.id === charIcons[id]);
  return {
    ...base,
    name: (charNames[id] && charNames[id].trim()) || base.name,
    icon: chosenClass ? chosenClass.icon : base.icon,
  };
}

function countSlots(blocks){
  let n = 0;
  blocks.forEach(b => b.tasks.forEach(t => n += resolveTaskChars(t).length));
  return n;
}

function toggle(taskId, charId, period){
  const key = `${taskId}:${charId}`;
  if (period === 'daily'){
    dailyChecked[key] = !dailyChecked[key];
    saveJSON(todayKey(), dailyChecked);
    if (dailyMissed[key]){ dailyMissed[key] = false; saveJSON(missedKey(), dailyMissed); }
  } else {
    weeklyChecked[key] = !weeklyChecked[key];
    saveJSON(weekKey(), weeklyChecked);
    if (weeklyMissed[key]){ weeklyMissed[key] = false; saveJSON(weeklyMissedKey(), weeklyMissed); }
  }
  render();
}

function toggleMissedTask(taskId, charId, period){
  const key = `${taskId}:${charId}`;
  if (period === 'daily'){
    dailyMissed[key] = !dailyMissed[key];
    saveJSON(missedKey(), dailyMissed);
    if (dailyChecked[key]){ dailyChecked[key] = false; saveJSON(todayKey(), dailyChecked); }
  } else {
    weeklyMissed[key] = !weeklyMissed[key];
    saveJSON(weeklyMissedKey(), weeklyMissed);
    if (weeklyChecked[key]){ weeklyChecked[key] = false; saveJSON(weekKey(), weeklyChecked); }
  }
  render();
}

function setView(v){
  view = v;
  document.getElementById('tabDaily').classList.toggle('active', v === 'daily');
  document.getElementById('tabWeekly').classList.toggle('active', v === 'weekly');
  document.getElementById('resetLabel').textContent = v === 'daily' ? 'la journée' : 'la semaine';
  render();
}

function toggleSummary(){ showSummary = !showSummary; render(); }

function doReset(){
  if (view === 'daily'){
    dailyChecked = {}; saveJSON(todayKey(), dailyChecked);
    dailyMissed = {}; saveJSON(missedKey(), dailyMissed);
  } else {
    weeklyChecked = {}; saveJSON(weekKey(), weeklyChecked);
    weeklyMissed = {}; saveJSON(weeklyMissedKey(), weeklyMissed);
  }
  render();
}

function setCharClass(id, classId){
  charIcons[id] = classId; saveJSON(CHAR_ICONS_KEY, charIcons);
  const chosen = CLASS_OPTIONS.find(cl => cl.id === classId);
  if (chosen){ charNames[id] = chosen.label; saveJSON(CHAR_NAMES_KEY, charNames); }
  render();
}

function setActiveChar(id){ activeChar = id; render(); }
function toggleEditPanel(){ editingNames = !editingNames; render(); }

function getNextOccurrence(daysOfWeek, hour){
  const now = new Date();
  for (let add = 0; add < 8; add++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + add, hour, 0, 0, 0);
    if (daysOfWeek.includes(d.getDay()) && d > now) return d;
  }
  return null;
}

function formatCountdown(ms){
  const totalSeconds = Math.max(0, Math.floor(ms / 1000));
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const mins = Math.floor((totalSeconds % 3600) / 60);
  const secs = totalSeconds % 60;
  const pad = value => String(value).padStart(2, '0');

  if (days > 0) return `${days}j ${pad(hours)}h ${pad(mins)}min ${pad(secs)}s`;
  if (hours > 0) return `${pad(hours)}h ${pad(mins)}min ${pad(secs)}s`;
  return `${pad(mins)}min ${pad(secs)}s`;
}

const RIFT_HOURS = [2, 5, 8, 11, 14, 17, 20, 23];
const RIFT_PORTAL_MIN = 5;
const RIFT_DURATION_MIN = 60;

function formatCountdownShort(ms){
  const totalMin = Math.max(0, Math.floor(ms / 60000));
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  if (days > 0) return `${days}j ${hours}h`;
  if (hours > 0) return `${hours}h ${mins}m`;
  return `${mins}m`;
}

function getRiftWindows(count){
  const now = new Date();
  const windows = [];
  for (let d = 0; windows.length < count && d < 4; d++){
    RIFT_HOURS.forEach(h => {
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, h, 0, 0, 0);
      const end = new Date(start.getTime() + RIFT_DURATION_MIN * 60000);
      if (start > now){
        const dayDiff = Math.floor((new Date(start.getFullYear(), start.getMonth(), start.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
        const dayLabel = dayDiff === 0 ? "Aujourd'hui" : dayDiff === 1 ? 'Demain' : start.toLocaleDateString('fr-FR', { weekday: 'long' });
        windows.push({ start, end, dayLabel });
      }
    });
  }
  windows.sort((a, b) => a.start - b.start);
  return windows.slice(0, count);
}

function toggleRiftReminder(startTs){
  if (!('Notification' in window)){ alert("Les notifications ne sont pas supportées par ce navigateur."); return; }
  const key = String(startTs);
  if (riftReminders[key]){
    delete riftReminders[key];
    saveJSON(RIFT_REMINDERS_KEY, riftReminders);
    if (riftReminderTimeouts[key]){ clearTimeout(riftReminderTimeouts[key]); delete riftReminderTimeouts[key]; }
    renderRiftCard();
    return;
  }
  Notification.requestPermission().then(perm => {
    if (perm !== 'granted'){ alert("Permission refusée — impossible d'activer le rappel."); return; }
    riftReminders[key] = true;
    saveJSON(RIFT_REMINDERS_KEY, riftReminders);
    scheduleRiftReminder(startTs);
    renderRiftCard();
  });
}

function scheduleRiftReminder(startTs){
  const key = String(startTs);
  if (riftReminderTimeouts[key]) return;
  const fireAt = startTs - RIFT_REMINDER_LEAD_MIN * 60000;
  const delay = fireAt - Date.now();
  if (delay <= 0){
    // window already too close or passed — drop the stale reminder
    delete riftReminders[key];
    saveJSON(RIFT_REMINDERS_KEY, riftReminders);
    return;
  }
  riftReminderTimeouts[key] = setTimeout(() => {
    if (riftReminders[key] && 'Notification' in window && Notification.permission === 'granted'){
      new Notification('Aion 2 — Spacetime Rift bientôt', { body: `Le portail s'ouvre dans ${RIFT_REMINDER_LEAD_MIN} minutes.` });
    }
    delete riftReminders[key];
    saveJSON(RIFT_REMINDERS_KEY, riftReminders);
    delete riftReminderTimeouts[key];
  }, delay);
}

function getWeeklyEventWindows(daysOfWeek, hour, minute, durationMin, count){
  const now = new Date();
  const windows = [];
  for (let d = 0; windows.length < count && d < 21; d++){
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, hour, minute || 0, 0, 0);
    if (daysOfWeek.includes(start.getDay()) && start > now){
      const end = new Date(start.getTime() + durationMin * 60000);
      const dayLabel = d === 0 ? "Aujourd'hui" : d === 1 ? 'Demain' : start.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });
      windows.push({ start, end, dayLabel });
    }
  }
  return windows.slice(0, count);
}

function scheduleGenericReminder(key, ts){

function armReminder(blockId, daysOfWeek, hour){

function scheduleReminder(blockId, daysOfWeek, hour){

        new Notification('Aion 2 — PvP dans 15 min', { body: 'Ne rate pas la fenêtre — pense à te connecter.' });

function render(){
  const blocks = view === 'daily' ? DAILY_BLOCKS : WEEKLY_BLOCKS;
  const checked = view === 'daily' ? dailyChecked : weeklyChecked;
  const missedStore = view === 'daily' ? dailyMissed : weeklyMissed;
  const total = countSlots(blocks);
  let done = 0;
  blocks.forEach(b => b.tasks.forEach(t => resolveTaskChars(t).forEach(cid => { if (checked[`${t.id}:${cid}`]) done++; })));
  const pct = total ? Math.round((done/total)*100) : 0;

  document.getElementById('progressVal').textContent = `${done}/${total} · ${pct}%`;
  document.getElementById('progressFill').style.width = pct + '%';

  const visibleChars = activeChar === 'all' ? CHARACTERS.map(c => c.id) : [activeChar];

  const missedEntries = [];
  blocks.forEach(block => {
    block.tasks.forEach(task => {
      resolveTaskChars(task).forEach(cid => {
        const key = `${task.id}:${cid}`;
        if (missedStore[key]){
          const c = getChar(cid);
          missedEntries.push({ key, charName: c.name, charColor: c.color, label: task.label,
            advice: CATCHUP_ADVICE[task.id] || 'À rattraper dès que possible' });
        }
      });
    });

  const summaryBox = document.getElementById('summaryBox');
  if (missedEntries.length > 0){
    summaryBox.classList.add('show');
    document.getElementById('summaryTitle').textContent = `⚠ À rattraper (${missedEntries.length})`;
    document.getElementById('summaryArrow').textContent = showSummary ? '▲' : '▼';
    document.getElementById('summaryList').style.display = showSummary ? 'flex' : 'none';
    document.getElementById('summaryList').innerHTML = missedEntries.map(m => `
      <div class="summary-item">
        <span style="color:${m.charColor};font-weight:700">${m.charName}</span> — ${m.label}
        <div class="summary-advice">${m.advice}</div>
      </div>`).join('');
  } else {
    summaryBox.classList.remove('show');
  }

  const displayChars = CHARACTERS.map(c => getChar(c.id));
  const chipsEl = document.getElementById('charChips');
  chipsEl.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeChar === 'all' ? ' active' : '');
  allChip.textContent = 'Tous';
  allChip.onclick = () => setActiveChar('all');
  chipsEl.appendChild(allChip);
  displayChars.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeChar === c.id ? ' active' : '');
    b.style.borderColor = activeChar === c.id ? c.color : 'rgba(255,255,255,0.12)';
    b.style.color = activeChar === c.id ? c.color : '#8b8299';
    b.innerHTML = CLASS_ICON_IMG[c.icon] ? `<img class="cicon" src="${CLASS_ICON_IMG[c.icon]}" alt="" /> ${c.name}` : `<span>${ICONS[c.icon]}</span> ${c.name}`;
    b.onclick = () => setActiveChar(c.id);
    chipsEl.appendChild(b);
  });
  const editBtn = document.createElement('button');
  editBtn.className = 'edit-btn' + (editingNames ? ' active' : '');
  editBtn.textContent = '✎';
  editBtn.title = 'Choisir la classe des personnages';
  editBtn.onclick = toggleEditPanel;
  chipsEl.appendChild(editBtn);

  const settingsBtn = document.createElement('button');
  settingsBtn.className = 'edit-btn';
  settingsBtn.innerHTML = '⚙ Réglages';
  settingsBtn.title = 'Synchronisation et thème';
  settingsBtn.style.marginLeft = 'auto';
  settingsBtn.onclick = toggleSyncPanel;
  chipsEl.appendChild(settingsBtn);

  const editPanel = document.getElementById('editPanel');
  editPanel.classList.toggle('show', editingNames);
  editPanel.innerHTML = CHARACTERS.map(c => {
    const dc = getChar(c.id);
    const currentClassId = charIcons[c.id];
    const classBtns = CLASS_OPTIONS.map(cl => {
      const isSelected = currentClassId ? currentClassId === cl.id : cl.icon === c.icon;
      const iconHtml = CLASS_ICON_IMG[cl.icon] ? `<img class="cicon" src="${CLASS_ICON_IMG[cl.icon]}" alt="" />` : ICONS[cl.icon];
      return `<button class="class-btn" title="${cl.label}" onclick="setCharClass('${c.id}','${cl.id}')"
                style="border-color:${isSelected ? dc.color : 'rgba(255,255,255,0.12)'};
                       background:${isSelected ? dc.color+'25' : 'transparent'};
                       color:${isSelected ? dc.color : '#544b68'}">${iconHtml}</button>`;
    }).join('');
    const removeBtn = c.id !== 'main'
      ? `<button class="remove-alt-btn" title="Supprimer cet alt" onclick="removeAlt('${c.id}')">🗑</button>`
      : '';
    return `
      <div>
        <div class="edit-row-head">
          <span class="edit-role">${c.role === 'Main' ? 'Main' : 'Alt'}</span>
          <span class="edit-name" style="color:${dc.color}">${dc.name}</span>

        <div class="class-picker">${classBtns}</div>

      ${block.pvpDays ? `<div class="pvp-timer" id="timer-${block.id}"></div>` : ''}
      <div class="block-body" id="body-${block.id}"></div>
    `;
    container.appendChild(blockEl);

    if (block.pvpDays){
      const timerEl = blockEl.querySelector(`#timer-${block.id}`);
      const updateTimer = () => {
        const next = getNextOccurrence(block.pvpDays, block.pvpHour);
        const countdown = next ? formatCountdown(next.getTime() - Date.now()) : '?';
        const armed = reminderArmed[block.id];
        timerEl.innerHTML = `<span class="countdown">⏱ Prochain event dans ${countdown}</span>
          <button class="remind-btn${armed ? ' armed' : ''}" onclick="armReminder('${block.id}', [${block.pvpDays}], ${block.pvpHour})">
            ${armed ? '🔔 Rappel actif' : '🔕 Activer le rappel'}
          </button>`;
      };
      updateTimer();
      if (timerIntervals[block.id]) clearInterval(timerIntervals[block.id]);
      timerIntervals[block.id] = setInterval(updateTimer, 1000);
    }

    const bodyEl = blockEl.querySelector(`#body-${block.id}`);
    block.tasks.forEach(task => {
      const relevantChars = resolveTaskChars(task).filter(c => visibleChars.includes(c));
      if (relevantChars.length === 0) return;

      const row = document.createElement('div');
      row.className = 'task-row';

      const slotsHTML = relevantChars.map(cid => {
        const c = getChar(cid);
        const key = `${task.id}:${cid}`;
        const isChecked = !!checked[key];
        const isMissed = !!missedStore[key];
        const qty = qtyForChar(task, cid);

        const checkboxClasses = ['checkbox'];
        if (isChecked) checkboxClasses.push('checked');
        if (isMissed) checkboxClasses.push('missed');
        const checkboxStyle = isChecked ? `border-color:${c.color};background:${c.color}` : '';
        const checkboxInner = isChecked ? '✓' : c.name[0];

        const missBtn = `<button class="miss-btn${isMissed ? ' active' : ''}" title="${c.name} — marquer comme manqué"
               onclick="toggleMissedTask('${task.id}','${cid}','${view}')">✕</button>`;

        const badge = isMissed
          ? `<span class="missed-badge">manqué</span>`
          : (qty ? `<span class="qty-badge" style="color:${c.color}">×${qty}</span>` : '');

        return `
          <div class="char-slot">
            <div class="slot-controls">
              <button class="${checkboxClasses.join(' ')}" style="${checkboxStyle}" title="${c.name}"
                onclick="toggle('${task.id}','${cid}','${view}')">${checkboxInner}</button>
              ${missBtn}
            </div>
            ${badge}
          </div>`;
      }).join('');

      row.innerHTML = `<span class="task-label">${task.label}</span><div class="char-slots">${slotsHTML}</div>`;
      bodyEl.appendChild(row);
    });
  });
}

const HISTORY_KEY = 'aion2-history-v3';
const BACKUP_KEY = 'aion2-last-backup-v3';
let appSettings = loadJSON(SETTINGS_KEY, { compact:false, hideCompleted:false });

function migrateStorage(){
  const current = Number(localStorage.getItem('aion2-app-version') || 0);
  if (current < APP_VERSION){
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(exportPayload())); } catch(e){}
    localStorage.setItem('aion2-app-version', String(APP_VERSION));
  }
}
function exportPayload(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.startsWith('aion2-') && k !== BACKUP_KEY) data[k]=localStorage.getItem(k);
  }
  return { app:'Routines les fous du bus', version:APP_VERSION, exportedAt:new Date().toISOString(), data };
}
function exportData(){
  const blob = new Blob([JSON.stringify(exportPayload(),null,2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`aion2-routines-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Sauvegarde exportée');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const p=JSON.parse(reader.result);
      if(!p || !p.data || typeof p.data!=='object') throw new Error('Format invalide');
      localStorage.setItem(BACKUP_KEY, JSON.stringify(exportPayload()));
      Object.entries(p.data).forEach(([k,v])=>{ if(k.startsWith('aion2-')) localStorage.setItem(k,String(v)); });
      toast('Import terminé, rechargement…'); setTimeout(()=>location.reload(),600);
    }catch(e){ alert('Import impossible : '+e.message); }
  }; reader.readAsText(file);
}
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }

function currentBlocks(){ return view==='daily'?DAILY_BLOCKS:WEEKLY_BLOCKS; }
function currentChecked(){ return view==='daily'?dailyChecked:weeklyChecked; }
function currentMissed(){ return view==='daily'?dailyMissed:weeklyMissed; }
function storeCurrent(){
  if(view==='daily'){ saveJSON(todayKey(),dailyChecked); saveJSON(missedKey(),dailyMissed); }
  else { saveJSON(weekKey(),weeklyChecked); saveJSON(weeklyMissedKey(),weeklyMissed); }
}
function bulkSet(mode){
  const checked=currentChecked(), missed=currentMissed();
  currentBlocks().forEach(b=>b.tasks.forEach(t=>resolveTaskChars(t).forEach(cid=>{
    if(activeChar!=='all' && cid!==activeChar) return;
    const key=`${t.id}:${cid}`;
    if(mode==='complete'){ checked[key]=true; missed[key]=false; }
    else { delete checked[key]; delete missed[key]; }
  })));
  storeCurrent(); render(); toast(mode==='complete'?'Tâches validées':'Progression effacée');
}
function snapshotHistory(period){
  const blocks=period==='daily'?DAILY_BLOCKS:WEEKLY_BLOCKS;
  const checked=period==='daily'?dailyChecked:weeklyChecked;
  const total=countSlots(blocks); let done=0;
  blocks.forEach(b=>b.tasks.forEach(t=>resolveTaskChars(t).forEach(cid=>{if(checked[`${t.id}:${cid}`])done++;})));
  historyData.unshift({date:new Date().toISOString(),period,done,total,pct:total?Math.round(done/total*100):0});
  historyData=historyData.slice(0,30); saveJSON(HISTORY_KEY,historyData);
}

function buildNowItems(blocks,checked,visibleChars){
  const items=[];
  blocks.forEach(b=>b.tasks.forEach(t=>{
    const remaining=resolveTaskChars(t).filter(cid=>visibleChars.includes(cid)&&!checked[`${t.id}:${cid}`]);
    if(remaining.length) items.push({p:b.priority||99,title:b.title,label:t.label,chars:remaining.map(cid=>getChar(cid).name).join(', ')});
  }));
  return items.sort((a,b)=>a.p-b.p).slice(0,6);
}
function renderDashboard(){
  const blocks=currentBlocks(), checked=currentChecked();

  const now=buildNowItems(blocks,checked,visible);

    const remaining = Math.max(0, odyleCap - val);

    const totalH = Math.floor(hoursToCap);

    const h = totalH % 24;
    const m = Math.round((hoursToCap - totalH) * 60);
    const label = remaining === 0 ? 'Plafond atteint'

    </div>`;
  }).join('');

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">

        <input type="checkbox" ${odyleSub ? 'checked' : ''} onchange="toggleOdyleSub()" style="accent-color:#c47ed4;width:12px;height:12px;" />

      <br><span style="color:#4fd1c5;">Optimal F2P :</span> 3 alts (main + 3) donne ≈72 runs cumulés — reste sous le seuil. Un 4ᵉ alt ferait dépasser les 84 (≈86 runs).
    </div>
  </div>`;
  document.getElementById('dashboard').innerHTML=`<div class="dash-card"><div class="dash-title"><span>À faire maintenant</span><span>${now.length} priorité(s)</span></div><div class="now-list">${nowHtml}</div></div><div class="dash-card"><div class="dash-title"><span>Progression par personnage</span><span>${view==='daily'?'Jour':'Semaine'}</span></div><div class="char-progress-list">${charHtml}</div>${odyleHtml}</div>`;
}

function refreshEnhancedTimers(){
  const all=[...DAILY_BLOCKS,...WEEKLY_BLOCKS].filter(b=>b.pvpDays);
  all.forEach(block=>{
    const el=document.getElementById(`timer-${block.id}`); if(!el)return;
    if(timerIntervals[block.id]){clearInterval(timerIntervals[block.id]);delete timerIntervals[block.id];}
    const ev=getEventState(block); if(!ev.target)return;
    const ms=ev.target-Date.now(), cd=formatCountdown(ms);
    let cls=''; if(ev.state==='live')cls='is-live'; else if(ms<=3600000)cls='is-urgent'; else if(ms<=86400000)cls='is-soon';

  });

function updateRiftClock(){const card=document.querySelector('#riftCard .rift-card');if(!card)return;const now=new Date(),hours=RIFT_HOURS.slice().sort((a,b)=>a-b);let activeStart=null,nextStart=null;for(let d=-1;d<=1;d++)for(const h of hours){const st=new Date(now.getFullYear(),now.getMonth(),now.getDate()+d,h);const en=new Date(st.getTime()+RIFT_DURATION_MIN*60000);if(st<=now&&now<en)activeStart=st;if(st>now&&(!nextStart||st<nextStart))nextStart=st;}const portalOpen=activeStart&&now<new Date(activeStart.getTime()+RIFT_PORTAL_MIN*60000);let target,label,status,pct=0;if(portalOpen){target=new Date(activeStart.getTime()+RIFT_PORTAL_MIN*60000);label='portail';status='PORTAIL OUVERT';pct=((now-activeStart)/(RIFT_PORTAL_MIN*60000))*100;}else if(activeStart){target=new Date(activeStart.getTime()+RIFT_DURATION_MIN*60000);label='fin';status='ÉVÉNEMENT EN COURS · PORTAIL FERMÉ';pct=((now-activeStart)/(RIFT_DURATION_MIN*60000))*100;}else{target=nextStart;label='prochain';status='PROCHAIN RIFT';const prev=new Date(nextStart.getTime()-3*3600000);pct=((now-prev)/(nextStart-prev))*100;}card.classList.toggle('portal-open',!!portalOpen);card.classList.toggle('urgent',!activeStart&&target-now<30*60000);document.getElementById('riftStatusText').textContent=status;document.getElementById('riftClock').textContent=formatCountdown(target-now);document.getElementById('riftClockLabel').textContent=label;document.getElementById('riftRing').style.setProperty('--p',Math.max(0,Math.min(100,pct)));document.querySelectorAll('[data-rift-row-ts]').forEach(x=>x.textContent=formatCountdownShort(Number(x.dataset.riftRowTs)-Date.now()));}

function formatResetCountdown(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  return d > 0 ? `${d}j ${h}h` : `${h}h ${m}min`;
}
function nextResetAt(hour, targetDay){
  const now = new Date();
  for (let i = 0; i < 8; i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i, hour, 0, 0, 0);
    if (d > now && (targetDay === undefined || d.getDay() === targetDay)) return d;
  }
}
function formatResetBadge(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if (d > 0) return `${d}j${h}h`;
  if (h > 0) return `${h}h${m}`;
  return `${m}min`;
}

  const weeklyBadge = document.getElementById('tabWeeklyBadge');
  if (dailyBadge) dailyBadge.textContent = formatResetBadge(nextResetAt(5) - now);
  if (weeklyBadge) weeklyBadge.textContent = formatResetBadge(nextResetAt(5, 3) - now);
}
function masterTick(){refreshEnhancedTimers();updateRiftClock();renderAllEventCards();renderResetBanner();if(new Date().getSeconds()===0){renderWeeklyPlanner();renderRiftCard();}}

migrateStorage(); applySettings();
document.getElementById('year').textContent = new Date().getFullYear();
function setSiteLang(l){
  localStorage.setItem('equipes-lang', l);
  document.getElementById('navLangFr').classList.toggle('active', l === 'fr');
  document.getElementById('navLangEn').classList.toggle('active', l === 'en');
}
(function initNavLang(){
  const l = localStorage.getItem('equipes-lang') || 'fr';
  document.getElementById('navLangFr').classList.toggle('active', l === 'fr');
  document.getElementById('navLangEn').classList.toggle('active', l === 'en');
})();

document.getElementById('tabDaily').setAttribute('role','tab'); document.getElementById('tabWeekly').setAttribute('role','tab');
document.querySelector('.tabs').setAttribute('role','tablist');
applyTheme();
handleDiscordRedirect();
renderDiscordTopButton();
initParticleBackground();
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW registration failed', err));
  });
}
render();
renderResetBanner();
sendHeartbeat();
updateOnlineCount();
setInterval(sendHeartbeat, 60000);
setInterval(updateOnlineCount, 45000);
enhancedTimerHandle=setInterval(masterTick,1000);
restoreRiftReminders();
restoreGenericReminders();
if (syncCode && !sessionStorage.getItem('aion2-synced-this-session')){
  sessionStorage.setItem('aion2-synced-this-session', '1');
  pullFromCloud(syncCode);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshEnhancedTimers();});

</script>
</body>
</html>

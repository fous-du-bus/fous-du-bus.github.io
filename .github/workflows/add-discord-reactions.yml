name: Add Discord reactions to LFG message

on:
  repository_dispatch:
    types: [add-lfg-reactions]

jobs:
  react:
    runs-on: ubuntu-latest
    steps:
      - name: Add reactions via Discord API
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ github.event.client_payload.channelId }}
          MESSAGE_ID: ${{ github.event.client_payload.messageId }}
        run: |
          for EMOJI in "%E2%9C%85" "%E2%9D%8C"; do
            curl -s -X PUT \
              -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
              "https://discord.com/api/v10/channels/$CHANNEL_ID/messages/$MESSAGE_ID/reactions/$EMOJI/@me"
            sleep 0.5
          done

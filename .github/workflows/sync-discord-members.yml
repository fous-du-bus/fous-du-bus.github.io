name: Sync Discord members with Aion 2 role

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Discord members with role and write JSON
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: "1355632831333798200"
          ROLE_ID: "1443636744267501618"
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const GUILD_ID = process.env.GUILD_ID;
          const ROLE_ID = process.env.ROLE_ID;
          const TOKEN = process.env.DISCORD_BOT_TOKEN;

          async function fetchAllMembers(){
            let members = [];
            let after = '0';
            while (true){
              const res = await fetch(`https://discord.com/api/v10/guilds/${GUILD_ID}/members?limit=1000&after=${after}`, {
                headers: { Authorization: `Bot ${TOKEN}` }
              });
              if (!res.ok){
                const text = await res.text();
                throw new Error(`Discord API error ${res.status}: ${text}`);
              }
              const batch = await res.json();
              if (batch.length === 0) break;
              members = members.concat(batch);
              after = batch[batch.length - 1].user.id;
              if (batch.length < 1000) break;
            }
            return members;
          }

          (async () => {
            const members = await fetchAllMembers();
            const withRole = members
              .filter(m => m.roles.includes(ROLE_ID))
              .map(m => ({
                id: m.user.id,
                username: m.user.username,
                nick: m.nick || null,
              }));
            const output = { updatedAt: new Date().toISOString(), members: withRole };
            fs.writeFileSync('discord-members.json', JSON.stringify(output, null, 2));
            console.log(`Wrote ${withRole.length} members with role ${ROLE_ID}`);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          SCRIPT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discord-members.json
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update Discord members list" && git push)

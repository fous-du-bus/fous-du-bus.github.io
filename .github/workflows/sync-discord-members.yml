name: Sync Discord members with Aion 2 role

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Discord members with role and write JSON
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: "1355632831333798200"
          ROLE_ID: "1443636744267501618"
        run: node .github/scripts/sync-discord-members.js

      - name: Commit and push
        run: bash .github/scripts/commit-and-push.sh

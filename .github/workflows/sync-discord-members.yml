name: Sync Discord members with Aion 2 role

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Discord members with role and write JSON
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: "1355632831333798200"
          ROLE_ID: "1443636744267501618"
        run: node .github/scripts/sync-discord-members.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add discord-members.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update Discord members list"
            git fetch
